l_english:
 ZAU_last_drop:0 "Meet at the Last Drop"
 ZAU_last_drop_desc:0 "Vander convenes foundry owners, lift crews and ward stewards. They must decide who can speak for the undercity when the crossings close."
 ZAU_air:0 "Inspect the Air Shafts"
 ZAU_air_desc:0 "Trace the Gray through the shafts below the Entresol and decide which maintenance work can proceed locally."
 ZAU_lift:0 "Reopen the Entresol Freight Lift"
 ZAU_lift_desc:0 "Commission a local hoist repair and settle who will maintain it."
 ZAU_foundries:0 "Standardize the Foundries"
 ZAU_foundries_desc:0 "Set compatible specifications for the yards that supply the crossing and the lower pumps."
 ZAU_ward_compact:0 "Charter the Ward Compact"
 ZAU_ward_compact_desc:0 "Give ward stewards seats on the maintenance board and fund the neighborhood workshops. Ekko's apprentices can repair equipment their own wards depend on."
 ZAU_markets:0 "Apprentices of the Lanes"
 ZAU_markets_desc:0 "Let independent shops train the crews who keep municipal equipment running. Publish the repair drawings so any ward can order replacements."
 ZAU_glasc:0 "Accept Glasc Credit"
 ZAU_glasc_desc:0 "Renata offers a single line of credit for foundries short on working capital. Its guarantee puts her procurement office between the wards and their suppliers."
 ZAU_consolidation:0 "The Foundry Receivership"
 ZAU_consolidation_desc:0 "Decide whether to put the indebted yards under Renata's purchasing office or guarantee separate charters."
 ZAU_singed:0 "Fund Singed's Laboratory"
 ZAU_singed_desc:0 "Commission research into filtering materials under a documented grant. The ward stewards can ask to see the books."
 ZAU_audit:0 "Audit Singed's Grant"
 ZAU_audit_desc:0 "Separate useful workshop research from work the city never agreed to fund."
 ZAU_engineers:0 "Seat the Ward Engineers"
 ZAU_engineers_desc:0 "Authorize an inspection team that knows the lower shafts and can answer a survey from Piltover."
 ZAU_bridge_works:0 "Fund the Lower Approach"
 ZAU_bridge_works_desc:0 "Send hoist crews to the bridge under the signed charter. The shared board can reopen the crossing once both approaches are funded."
 ZAU_detour:0 "Route Freight to Lower Landing"
 ZAU_detour_desc:0 "Restore the independent route after the charter fails. The new detour keeps goods moving without settling the dispute."
 ZAU_ward_compact_idea:0 "The Ward Compact"
 ZAU_ward_workshops_idea:0 "Ward Apprenticeships"
 ZAU_glasc_credit_idea:0 "Glasc Credit Lines"
 ZAU_glasc_receivership_idea:0 "Glasc Receivership"
 ZAU_ward_clinics_idea:0 "Ward Clinic Network"
 ZAU_lift_repairs_idea:0 "Lift and Pump Repair Crews"
 ZAU_glasc_directorate:0 "Renata's Directorate"
 ZAU_glasc_directorate_desc:0 "With the foundries in receivership, Renata can call their votes. If the ward stewards cannot keep a majority, Glasc Industries can turn its temporary purchasing office into the seat of government."
 ZAU_renata:0 "Renata Glasc"
 ZAU_events.10.t:0 "A Table at the Last Drop"
 ZAU_events.10.d:0 "The shift stewards have borrowed the back room. They want one list of broken lifts, missed pay and closed clinics to put before the people who run the crossing."
 ZAU_events.10.a:0 "Give the ward stewards a mandate."
 ZAU_events.10.b:0 "Let the industrial houses send their own delegates."
 ZAU_events.11.t:0 "Glasc Industries"
 ZAU_events.11.d:0 "Renata Glasc offers credit to workshops that have been turned away by Piltovan lenders. The lines of credit come with a common purchasing contract drawn up by Glasc Industries."
 ZAU_events.11.a:0 "Accept the investment."
 ZAU_events.11.b:0 "Keep the workshops independent."
 ZAU_events.12.t:0 "Lanterns After Curfew"
 ZAU_events.12.d:0 "With the regular tender gone, the Firelights are taking clinic supplies from one level to the next. A ward steward proposes paying the clinics to take deliveries without making the couriers register with the houses."
 ZAU_events.12.a:0 "Fund the clinics."
 ZAU_events.12.b:0 "Let the stewards arrange deliveries."
 ZAU_events.13.t:0 "The Air Below"
 ZAU_events.13.d:0 "Night workers can smell the Gray even through their filters. The ventilation crews trace the backlog to a shaft used by one of the crossing lifts. They can clear the local ducts now, but full access will require a deal with the upper city."
 ZAU_events.13.a:0 "Pay the ward crews to clear the ducts."
 ZAU_events.13.b:0 "Reserve the parts for the crossing repairs."
 ZAU_events.14.t:0 "Industrialize Chemtech"
 ZAU_events.14.d:0 "The yards can supply replacement pumps and housings in larger lots if the foundries agree on common fittings. Smaller shops want access to those drawings before the first contracts are awarded."
 ZAU_events.14.a:0 "Publish the standard and open the bids."
 ZAU_events.14.b:0 "Award the first lot to the established yards."
 ZAU_events.15.t:0 "Fund Singed's Laboratory"
 ZAU_events.15.d:0 "Singed asks for a room, a stipend and access to the old workshop records. The ward stewards will back the grant if they can inspect the premises and receive an account of what was purchased."
 ZAU_events.15.a:0 "Issue a supervised research grant."
 ZAU_events.15.b:0 "Keep the funds for public works."
 ZAU_events.27.t:0 "The Entresol Freight Lift"
 ZAU_events.27.d:0 "A hoist crew can reopen the Entresol's freight lift with fittings made in local yards. The wards want places on the maintenance committee before they commit more crews."
 ZAU_events.27.a:0 "Fund the hoist and give the wards seats."
 ZAU_events.27.b:0 "Issue a yard concession."
 ZAU_events.28.t:0 "Supper After the Second Shift"
 ZAU_events.28.d:0 "A cafe beneath the pipes has started keeping its lights on for crews working overtime on the lifts. The stewards ask whether the city will reimburse the owners while the repairs continue."
 ZAU_events.28.a:0 "Cover the meal vouchers."
 ZAU_events.28.b:0 "Leave the collections with the stewards."
 ZAU_events.29.t:0 "Singed's Ledger"
 ZAU_events.29.d:0 "The visit to the laboratory produces two records: the work the Council paid for, and a list of expenses that sit outside the grant. The inspector asks whether the same account should pay for both."
 ZAU_events.29.a:0 "Renew only the supervised grant."
 ZAU_events.29.b:0 "End the public stipend."
 ZAU_events.30.t:0 "Hostile Takeover"
 ZAU_events.30.d:0 "Glasc Industries holds the notes on three competing foundries. Renata offers to roll their debts into one company. The old owners can stay at their desks, but from tomorrow every order would carry the Glasc seal."
 ZAU_events.30.a:0 "Approve the consolidation."
 ZAU_events.30.b:0 "Guarantee separate charters."
 ZAU_meal_vouchers:0 "Visit the Night Shift Cafe"
 ZAU_ward_compact_idea_desc:0 "Ward crews publicize their accounts and keep emergency work under local control."
 ZAU_ward_workshops_idea_desc:0 "Neighborhood workshops teach crews how to maintain equipment without waiting for a licensed supplier."
 ZAU_glasc_credit_idea_desc:0 "Renata's office advances equipment and materials. The city budgets for repayment and guarantees the common purchasing contract."
 ZAU_glasc_receivership_idea_desc:0 "Renata's purchasing office directs the indebted yards. Independent owners and workers lose their leverage over orders and wages."
 ZAU_ward_clinics_idea_desc:0 "Stewards and neighborhood couriers keep clinics supplied through night shifts and closures."
 ZAU_lift_repairs_idea_desc:0 "Ward crews are working through the backlog of lifts, pumps and ventilation shafts."
 ZAU_meal_vouchers_desc:0 "Find out how the repair crews are making it through the second shift."
 ZAU_detour_tt:0 "Unlock the parallel freight decision for this city."
 ZAU_domestic_agenda:0 "Zaun's Civic Agenda"
