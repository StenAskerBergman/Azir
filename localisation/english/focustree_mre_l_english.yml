l_english: 
MRE_strike_freljord:0 "Striking The Freljord"
MRE_strike_freljord_desc:0 "For too long have the northern raids pillaged our lands. We must take the fight to them, and end their frostbitten tyranny!"
MRE_strike_beaches:0 "Striking The Beaches"
MRE_strike_beaches_desc:0 "We have united our lands on Valoran, yet we can still push our renewed ideals further. We must thrust outwards, and show the world what it means to be Demacian!"
MRE_strike_center:0 "Striking The Center"
MRE_strike_center_desc:0 "Demacia has been united to become a bastion of power on Valoran. Let us bring the lesser states into our fold and expedite our order outwards."
MRE_strike_noxus:0 "Striking Noxus"
MRE_strike_noxus_desc:0 "Long has Noxus been our main foreign enemy, sparking countless border conflicts and even wars. With our renewed strength, let us show them our might once more!"
MRE_higher_standards:0 "Higher Standards"
MRE_higher_standards_desc:0 "The mageseekers must adhere to the crown of Demacia, and they thus must work harder to maintain their positions in the government. Let us demand more for the same work from them to put them further in check."
MRE_a_more_free_demacia:0 "A More Free Demacia"
MRE_a_more_free_demacia_desc:0 "Under the banner of the royal council, we have unified the great region of Demacia. Through our new policies of cooperation with the rebels, we have hundreds of thousands flocking to join our new unified banner."
MRE_demacian_might_till_the_end:0 "Demacian Might Till The End"
MRE_demacian_might_till_the_end_desc:0 "Enlisting more elite units of demacian soldiers will demoralize the rebellion further, cementing their eventual defeat."
MRE_strike_at_their_heart:0 "Strike At Their Heart"
MRE_strike_at_their_heart_desc:0 "Sending elite infiltrator divisions into the heart of the enemy territory will exacerbate their fall even faster than it already is."
MRE_unleash_the_horrors:0 "Unleash The Horrors"
MRE_unleash_the_horrors_desc:0 "Success! The researchers claim to have a living experiment that is able to take orders and fight for our cause. The only thing in question now is how long will it live outside of its test tube."
MRE_royal_restructuring:0 "Royal Restructuring"
MRE_royal_restructuring_desc:0 "Rooting out the royal council of the decrepit order and replacing them with competent advisors will both kneecap the order's influence and free up royal resources."
MRE_downfall_of_the_mageseekers:0 "Downfall Of The Mageseekers"
MRE_downfall_of_the_mageseekers_desc:0 "After years of falling to their ploys, we finally have gained enough power to destroy the order's influence once and for all. They will no longer ever be able to influence our court again."
MRE_enter_negotiations:0 "Enter Negotiations"
MRE_enter_negotiations_desc:0 "Entering into peace talks with the rebellion will surely reduce the needless bloodshed that has already claimed so many Demacian lives."
MRE_grant_concessions:0 "Grant Concessions"
MRE_grant_concessions_desc:0 "Treating the traitorous mages as equals and ensuring their rights after the war is over will surely speed up the negotiations to end the war."
MRE_true_demacian_monsters:0 "True Demacian Monsters"
MRE_true_demacian_monsters_desc:0 "We have turned the horrors into a consistent fighting force that, at least for a time, will be able to carry out the will of their captors. The mages will tremble in their wake..."
MRE_utilize_our_influence:0 "Utilize Our Influence"
MRE_utilize_our_influence_desc:0 "Our newfound leadership role over Demacia has opened many new doors previously closed. One of those doors allows us to stabilize Demacia through a heightened management of the populace."
MRE_infiltrate_the_enemy:0 "Infiltrate The Enemy"
MRE_infiltrate_the_enemy_desc:0 "We can send our spies into the forest hideouts where the mages direct and lead their armies into battle. Through careful subversion, we can break their will to fight in the long term."
MRE_reconcile_with_lux:0 "Reconcile With Lux"
MRE_reconcile_with_lux_desc:0 "Luxanna Crownguard, while being a mage, is still part of the royal family. Working with her and earning her trust back not only can help us end this bloody civil war, but it can also help lower her support for the mages."
MRE_call_on_the_colossus:0 "Call on The Colossus"
MRE_call_on_the_colossus_desc:0 "Having one of the most powerful mages in Demacia on our side now allows us to call down the ancient petricite protector, who is uniquely suited to combat the power of the enemy mages."
MRE_total_annihilation:0 "Total Annihilation"
MRE_total_annihilation_desc:0 "As victory draws near, we must punish the mages for ever daring to defy our rule. Every city and region they own must be set ablaze and razed to the ground as a dominant show of our power."
MRE_promote_the_illuminators:0 "Promote The Illuminators"
MRE_promote_the_illuminators_desc:0 "The Illuminators are an old organization led by Luxanna Crownguard who deal with more local issues in Demacia. They have offered to aid us with our growing problems in exchange for varying levels of support."
MRE_establish_a_strategic_alliance:0 "Establish A Strategic Alliance"
MRE_establish_a_strategic_alliance_desc:0 "We must focus on our strategic goals on this continent to counter any potential foe."
MRE_a_demacian_military:0 "A Demacian Military"
MRE_a_demacian_military_desc:0 "The chain of command for the Demacian armed forces must be fleshed out and expanded upon if we seek any success in a future conflict."
MRE_growth_of_the_old_city:0 "Growth Of The Old City"
MRE_growth_of_the_old_city_desc:0 "Through new planning methods, our centuries-old city can be expanded upon and can grow to meet new demands."
MRE_political_maneuvering:0 "Political Maneuvering"
MRE_political_maneuvering_desc:0 "The governing body of Demacia has many interest groups that all have differing ideas on Demacia's future. How should we mold them to our advantage?"
MRE_quality_over_quantity:0 "Quality over Quantity"
MRE_quality_over_quantity_desc:0 "Our army has always sought to be of the highest quality in all of Valoran, and keeping up to date with current military technology will help that goal."
MRE_petricite_on_the_seas:0 "Petricite On The Seas"
MRE_petricite_on_the_seas_desc:0 "Our navy has traditionally been sidelined in favor of our other armed forces. We must expand our capabilities to meet new foes."
MRE_raptor_training:0 "Raptor Training"
MRE_raptor_training_desc:0 "Create 2 random airbases\n50% research bonus on fighter"
MRE_advanced_quotas:0 "Advanced Quotas"
MRE_advanced_quotas_desc:0 "Our economic situation has much to be desired, requiring us to increase the pressure on our artisans."
MRE_the_question_of_sylas:0 "The Question Of Sylas"
MRE_the_question_of_sylas_desc:0 "Among the dissenters is a lowly mage named Sylas, who has been caught conversing with those of the royal family. He must be executed as an example to all of Demacia."
MRE_focus_on_the_center:0 "Focus On The Center"
MRE_focus_on_the_center_desc:0 "The great city of Demacia has always been the heart and soul of our nation, and if we seek to grow our economic sector, we must focus our efforts here."
MRE_investigate_luxanna_crownguard:0 "Investigate Luxanna Crownguard"
MRE_investigate_luxanna_crownguard_desc:0 "There have been dangerous rumors that there is a potential mage in the royal family! Luxanna Crownguard of the Illuminators has been seen dodging scheduled Mageseeker searches and even practicing the arcane, which if word got out, would be absolutely catastrophic for us!"
MRE_matters_of_the_high_council:0 "Matters Of The High Council"
MRE_matters_of_the_high_council_desc:0 "The royal family's inner circle has always been a sacred and protected place, yet outside influences are now encroaching on us. We must prepare and face these new challenges."
MRE_establish_the_royal_guard:0 "Establish The Royal Guard"
MRE_establish_the_royal_guard_desc:0 "The Royal Guard will be a prestigious group of soldiers who aim to defend both the royal family of Demacia and the interests of her governing body."
MRE_securethekingsrule:0 "Secure The King's Rule"
MRE_securethekingsrule_desc:0 "Ensuring that the ruling king has the capacity to manage the kingdom effectively is vital to prevent this country from entering stagnation."
MRE_expand_the_quota_system:0 "Expand The Quota System"
MRE_expand_the_quota_system_desc:0 "Locals across the nation can be motivated to work slightly more for the great Demacian cause."
MRE_motivated_workers:0 "Motivated Workers"
MRE_motivated_workers_desc:0 "Ideas of a luxurious future stir among our populace, demanding many to ramp up their work effort in the short term."
MRE_efficient_allocation:0 "Efficient Allocation"
MRE_efficient_allocation_desc:0 "New allocations of resources have allowed us to use less of our workforce for consumer activities, freeing up many for future growth projects."
MRE_economic_revitalization:0 "Economic Revitalization"
MRE_economic_revitalization_desc:0 "Our economy now rivals the others of Valoran, and no longer are we the considered old-fashioned folk of the past!"
MRE_industrial_expansion:0 "Industrial Expansion"
MRE_industrial_expansion_desc:0 "We must rebrand this city to be a place that fosters growth amongst our populace."
MRE_demacian_arms_growth:0 "Demacian Arms Growth"
MRE_demacian_arms_growth_desc:0 "Our military capabilities must grow alongside our economic expansion in order to have a well-rounded economy."
MRE_construction_boom:0 "Construction Boom"
MRE_construction_boom_desc:0 "Newfound efficiencies have provided to necessary conditions for our great nation to have a construction boom!"
MRE_additional_training:0 "Additional Training"
MRE_additional_training_desc:0 "With more rigorous training, we can ensure the quality of our troops to be unlike any other!"
MRE_military_formations:0 "Military Formations"
MRE_military_formations_desc:0 "Utilizing the right doctrine to suit our needs in any situation is pivotal to gain an advantage over the enemy."
MRE_naval_modernization:0 "Naval Modernization"
MRE_naval_modernization_desc:0 "Catching up to modern naval standards is a key part of our continued naval effort."
MRE_forward_operating_bases:0 "Forward Operating Bases"
MRE_forward_operating_bases_desc:0 "As our gaze across Valoran ever changes, we must prepare for strikes against any enemy, especially one from our vulnerable west coast."
MRE_secure_rijenland:0 "Secure Rijenland"
MRE_secure_rijenland_desc:0 "Our modernization efforts have been nearly completed, we only now need a proving grounds to demonstrate the prowess of our armed forces."
MRE_tried_and_tested:0 "Tried and Tested"
MRE_tried_and_tested_desc:0 "After many months of modernization methods, our military tactics and strategies have been solidified in the heat of battle. Our armed forces are now prepared for any conflict in the future."
MRE_silverwing_bonding:0 "Silverwing Bonding"
MRE_silverwing_bonding_desc:0 "The bond between trainer and raptor ensures that our flying formations can stay in line, no matter the foe."
MRE_expand_the_guard:0 "Expand The Guard"
MRE_expand_the_guard_desc:0 "Enlisting 2 new guard units to help fill our ranks will make short work of any enemy we might face."
MRE_expand_the_factories:0 "Expand The Factories"
MRE_expand_the_factories_desc:0 "We must ensure our production lines do not fail the requests of our armed forces through growing local artisanship."
MRE_honor_the_trainers:0 "Honor The Trainers"
MRE_honor_the_trainers_desc:0 "The Silverwing Trainers of Demacia are unlike any other raptor trainers in the world. With trainer and raptor united together in the skies, nothing is quite as dangerous."
MRE_develop_a_stockpile:0 "Develop A Stockpile"
MRE_develop_a_stockpile_desc:0 "Through extensive breeding programs, we can be sure that our presence in the skies never falters!"
MRE_develop_an_advantage:0 "Develop An Advantage"
MRE_develop_an_advantage_desc:0 "By focusing on the birds that we have, we can hone in on their aerial capabilities to be the ultimate killing machines."
MRE_invite_a_virtuoso:0 "Invite A Virtuoso"
MRE_invite_a_virtuoso_desc:0 "Inviting an infamous virtuoso from abroad who is more in touch with her arcane side will certainly help soothe the minds of any hidden mages in our nation."
MRE_prepare_the_prince:0 "Prepare The Prince"
MRE_prepare_the_prince_desc:0 "While the rule of Jarvin III is certain and solidified, we must always be prepared for the future, and that starts with readying the next prince to be fit for a king.\nIf the current king dies without the prince being prepared for kingship, a negative event will appear."
MRE_hire_a_strong_champion:0 "Hire A Strong Champion"
MRE_hire_a_strong_champion_desc:0 "Amidst our search for a capable warrior, we have found a lowly fighter from the pits of Noxus who swears fealty to protect the royal house. His skills seem unmatched across Valoran and he would be a valuable asset for us to have."
MRE_establish_an_antimage_alliance:0 "Establish An Anti-Mage Alliance"
MRE_establish_an_antimage_alliance_desc:0 "Our focus on ridding Demacia and her neighbors of mages takes all precedence in our diplomacy!"
MRE_address_the_mageseekers:0 "Address The Mageseekers"
MRE_address_the_mageseekers_desc:0 "The Mageseekers are a growing group of political advocators who seek the utter removal of all mages from our nation. We must be prepared to shape their interests to our ideals."
MRE_peace_keeper_of_western_valoran:0 "Peace Keeper Of Western Valoran"
MRE_peace_keeper_of_western_valoran_desc:0 "Guarantee several small nations between Demacia and Noxus and relations"
MRE_mage_hunts:0 "Mage Hunts"
MRE_mage_hunts_desc:0 "There are rumors amidst our populace that potential mages are starting to gather and conspire against our governance. We must decide how we will act against them."
MRE_promote_mageseeker_eldred:0 "Promote Mageseeker Eldred"
MRE_promote_mageseeker_eldred_desc:0 "Among the Mageseeker organization lies Lord Eldred at its heart. He is the face of all action against mages and makes any who cross him quiver."
MRE_censored_speech:0 "Censored Speech"
MRE_censored_speech_desc:0 "We must break up any discontent in our nation before it grows into a dangerous movement that can put our government in peril."
MRE_a_graymark_in_every_home:0 "A Graymark In Every Home"
MRE_a_graymark_in_every_home_desc:0 "We must show those dissenters among us that they can find no refuge in the homes of Demacia and that they will be hunted to their day's end!"
MRE_fordemacia:0 "For Demacia!"
MRE_fordemacia_desc:0 "We must beat back these mages and maintain the rule of the crown at all costs! For Demacia!"
MRE_forallmages:0 "For All Mages!"
MRE_forallmages_desc:0 "For far too long have we suffered under the yoke of the royal oppressors. Now is our time, brothers and sisters, to take charge of our ill-given fate. For All Mages!"
MRE_mending_the_rift:0 "Mending The Rift"
MRE_mending_the_rift_desc:0 "PATH WILL BE ADDED SOON"
MRE_an_old_friend:0 "An Old Friend"
MRE_an_old_friend_desc:0 "Wisteria, a friend of Sylas from times long gone, has been used as a tool of the mageseekers both to hunt other mages and to be a test rat for their twisted experiments. Perhaps she will look kindly on our plight and join us in arms?"
MRE_aid_the_escape:0 "Aid The Escape"
MRE_aid_the_escape_desc:0 "Thousands of mages are still risking their lives to escape the prisons of the mageseekers every day. We must work to help these lost souls reach our open arms to possibly recruit them into our cause."
MRE_bring_the_fight_to_garen:0 "Bring The Fight To Garen"
MRE_bring_the_fight_to_garen_desc:0 "Garen Crownguard, a high-ranking general and strong warrior of Demacia, now stands in our way. We must overpower him and decide what will become of him in this war."
MRE_establish_an_operating_base:0 "Establish An Operating Base"
MRE_establish_an_operating_base_desc:0 "In order to better lead our people in this great crusade, we must be able to have a location to plan our defenses. Let us establish this encampment as our temporary means of communion."
MRE_maintain_permanent_tunnels:0 "Maintain Permanent Tunnels"
MRE_maintain_permanent_tunnels_desc:0 "By virtue of most of us being escaped prisoners, we have a unique understanding of the heavily fortified walls surrounding the central city, and thus we have a duty for our cause to keep them open."
MRE_war_measures:0 "War Measures"
MRE_war_measures_desc:0 "Our capital city lies on the front line of this war! We must enact quick wartime measures to ensure the safety of our people and our royal family!"
MRE_seek_the_boon_of_the_veiled_lady:0 "Seek The Boon Of The Veiled Lady"
MRE_seek_the_boon_of_the_veiled_lady_desc:0 "By illustrating that we are capable warriors who can inflict damage on the oppressive Demacians, we can earn the favor of the Veiled Lady, who will hopefully help us in our great fight."
MRE_wrestle_control_over_the_wildlife:0 "Wrestle Control Over The Wildlife"
MRE_wrestle_control_over_the_wildlife_desc:0 "Our fight is already tough enough against the wretched Demacians, we must not waste any more resources falling towards simple beasts. Let us take a detachment of men and carve our dominion over these forests once and for all!"
MRE_confront_the_prince:0 "Confront The Prince"
MRE_confront_the_prince_desc:0 "We finally have the opportunity to fight the king of Demacia, Jarvin IV. He is an experienced warrior with many battle-hardened scars to prove it, but with the dedication to end Demacian tyranny, victory must be achieved."
MRE_breaking_the_system:0 "Breaking The System"
MRE_breaking_the_system_desc:0 "War is not only about the physical battle. We can win the hearts and minds of the Demacian people on the faulty ideals their government's leadership hold so dear."
MRE_negotiating_the_means_to_an_end:0 "Negotiating The Means To An End"
MRE_negotiating_the_means_to_an_end_desc:0 "Peace is the ultimate form of successful diplomacy and for us, it will save thousands of innocent lives, both mage and Demacian. Let us work towards a more peaceful tomorrow! Warning: The rebellion must be higher than 50% capitulation during this decision or else its timer will reset!"
MRE_itsnotovertillitsover:0 "It's Not Over Till It's Over"
MRE_itsnotovertillitsover_desc:0 "Total victory over the Demacians is what we require to ensure our future as mages remains free. Let us seek to end this repressive regime once and for all!"
MRE_free_captured_mages:0 "Free Captured Mages"
MRE_free_captured_mages_desc:0 "Thousands of tortured and oppressed mages flock to our ranks, seeking revenge and retribution for the years of suffering they have endured under the Demacian government."
MRE_the_laboratory_horrors:0 "The Laboratory Horrors"
MRE_the_laboratory_horrors_desc:0 "This prevents Demacia from pursuing laboratory experiements."
MRE_rising_up:0 "Rising Up"
MRE_rising_up_desc:0 "Thousands of mages inside the borders of Demacia have decided to join in the great cause, flocking to gather any weapon they can to fight their oppressors!"
MRE_calls_of_the_nation:0 "Calls Of The Nation"
MRE_calls_of_the_nation_desc:0 "Brothers and sisters! Hear this call! Rise up and fight to break the shackles placed upon you by this wretched regime!"
MRE_feeding_off_our_fear:0 "Feeding Off Our Fear"
MRE_feeding_off_our_fear_desc:0 "In the wake of the fear and terror thousands have endured from our rebellion, a demon has decided to make itself at home in our lands. We must fight back this evil and keep our citizen's minds on the topic of freedom from the mageseekers!"
MRE_illuminating_the_nation:0 "Illuminating The Nation"
MRE_illuminating_the_nation_desc:0 "With the help of the lady of luminosity, we no longer have to lie in fear of a greater demon entrenching itself within our cities. We truly are on the right course for a safer and brighter future."
MRE_seek_the_winged_protector:0 "Seek The Winged Protector"
MRE_seek_the_winged_protector_desc:0 "The Judicator has been prophesized to aid Demacia in its hour of need, and seeing the mages on the cusp of annihilating us, no other hour has been as dire. Let us just hope Demacia will still be standing once she has rained down her holy fire from the heavens."
MRE_demilitarize_the_conflict:0 "Demilitarize The Conflict"
MRE_demilitarize_the_conflict_desc:0 "Arms reductions are an important part in promising peace to an opposing foe. Let us both lay down our arms in an act of good faith between our nations."
MRE_freeze_the_fronts:0 "Freeze The Fronts"
MRE_freeze_the_fronts_desc:0 "Stopping all heated conflicts is the best way to advance the narrative of peace, all the while saving thousands of lives in the process."
MRE_ensure_future_mage_rights:0 "Ensure Future Mage Rights"
MRE_ensure_future_mage_rights_desc:0 "It is not enough for us to win this armed conflict. In the chambers of tomorrow's Demacia, the plight of the mage must not be maintained. We must make sure that mages will be not discriminated against now and forever!"
MRE_create_a_friendly_mage_state:0 "Create A Friendly Mage State"
MRE_create_a_friendly_mage_state_desc:0 "Following Unification of the countries, the small nation of terbisa will be created to harbor mages of all kinds.\n+10 stability.\nLowers decision by 50 days"
MRE_we_stand_united:0 "We Stand United"
MRE_we_stand_united_desc:0 "The peace negotiations have finally been completed, and with it, a united Demacia. Let us restore our lost glory as a prideful nation that accepts all.\nIf we did not deal with the mageseeker order already, we will receive a large negative national spirit following the completion of this focus."
MRE_a_new_demacia:0 "A New Demacia"
MRE_a_new_demacia_desc:0 "We have overcome our greatest challenge to date. No nation, no threat, and no fear will ever plague our great people again, for we are Demacians!"
MRE_cuttingoffthesnakeshead:0 "Cutting Off The Snake's Head"
MRE_cuttingoffthesnakeshead_desc:0 "Maiming the leadership of the mageseeker order will doom the organization from within as without a strong and capable leader to suit their needs, they will fail to captivate and manipulate anyone."
MRE_doom_the_order:0 "Doom The Order"
MRE_doom_the_order_desc:0 "Ridding the mageseekers of their influence is the only way we can reunite with Demacia as they will never seek a peaceful unification. They wish for death on all mages who ever lived, and for that, we must vanquish them."
MRE_a_future_of_safety:0 "A Future Of Safety"
MRE_a_future_of_safety_desc:0 "Breaking the mageseeker organization is the number one priority in ensuring mages will be safe in this new Demacia for centuries to come. By destroying any semblance of influence they might have, the order will crumble into obscurity."
MRE_a_bloody_path:0 "A Bloody Path"
MRE_a_bloody_path_desc:0 "Let us rip and tear a path through the remaining strongholds of royalist supporters, for we will break their resolve and their war effort."
MRE_breaking_tradition:0 "Breaking Tradition"
MRE_breaking_tradition_desc:0 "With the decreased usage of petricite in our new Demacia, mages and runes can flourish, ushering in a new era of magical prosperity!"
MRE_drain_their_resources:0 "Drain their resources"
MRE_drain_their_resources_desc:0 "Requires a certain number of casualties.\nDespawns All Demacian event troops."
MRE_invite_the_prosecuted_back:0 "Invite The Prosecuted Back"
MRE_invite_the_prosecuted_back_desc:0 "All who have been sentenced to exile from the old government are welcome to join our new Demacia. Welcome brothers and sisters."
MRE_total_victory:0 "Total Victory"
MRE_total_victory_desc:0 "Finally, this bloody war has come to an end. We can now focus on rebuilding and repairing this great nation into a power never before seen on this continent!"
MRE_hand_over_the_reigns:0 "Hand Over The Reigns"
MRE_hand_over_the_reigns_desc:0 "With the old king gone, the prince must step up the the plate in order to lead our nation into a brighter future."
MRE_take_back_control:0 "Take Back Control"
MRE_take_back_control_desc:0 "The mageseeker's strict and outdated code against all mages is what directly brought us into this mess in the first place. We must undo their damages and seek to repair our great nation under an incorruptible banner."
MRE_themageseekers:0 "The Mageseekers..."
MRE_themageseekers_desc:0 "The mageseekers have been at the heart of this conflict, and as such it is only natural that we directly address them. We will convene a hearing with the mageseekers in the royal council on the subject of their meddling."
MRE_promote_the_order:0 "Promote The Order"
MRE_promote_the_order_desc:0 "The order that the mageseekers have built up is our best and only shot at victory against the mages! Only they know how to best counter them."
MRE_squash_this_rebellion:0 "Squash This Rebellion"
MRE_squash_this_rebellion_desc:0 "We must act quickly to crush this fledgling rebellion before it becomes entrenched! A swift yet relentless push is all we should need to snuff this out."
MRE_a_vengeful_prince:0 "A Vengeful Prince"
MRE_a_vengeful_prince_desc:0 "Now that the prince has solidified his control as king, he is now more free to take the fight to the mages for all of there transgressions against the crown."
MRE_set_fire_to_the_countryside:0 "Set Fire To The Countryside"
MRE_set_fire_to_the_countryside_desc:0 "Destruction of the passageways and small arms suppliers of the rebellion will inhibit the short-term ability of the rebellion to deliver a dangerous strike against us!"
MRE_seize_open_stockpiles:0 "Seize Open Stockpiles"
MRE_seize_open_stockpiles_desc:0 "While we were caught off guard by the sudden separation of the mages, they managed to steal thousands of war supplies in our old stockpiles. We must venture out and retrieve most of these stockpiles to deprive the rebellion of equipment!"
MRE_focused_fighting:0 "Focused Fighting"
MRE_focused_fighting_desc:0 "Adaptability and martial prowess is what has always separated our military leaders from other nations. We must make our general adhere to our strict martial code in order to get better results on the battlefield."
MRE_theprinceseliteguard:0 "The Prince's Elite Guard"
MRE_theprinceseliteguard_desc:0 "Following the catastrophe of the previous king's assassination, we must maintain an elite guard in the royal quarters to ensure no disaster ever strikes Demacia again!"
MRE_a_hidden_interest:0 "A Hidden Interest"
MRE_a_hidden_interest_desc:0 "Ever since Jarvin IV has been sent out into the outskirts of Demacia as a young warrior, he has always been in contact with the famed Dragon Shyvana. If the king's life is threatened, we should be able to call upon this great dragon protector."
MRE_demandthedragonshelp:0 "Demand The Dragon's Help"
MRE_demandthedragonshelp_desc:0 "Demacia is on the brink of extinction and must find any extra help it can get in order to survive. If that means calling on the new king's "interest", then so be it."
MRE_the_ascendency_of_eldred:0 "The Ascendency Of Eldred"
MRE_the_ascendency_of_eldred_desc:0 "Lord Eldred of the mageseekers has for far too long been pulling the strings in the background of Demacia. It is time he takes center stage and directs the nation into a brighter, less-magical future."
MRE_weaponize_the_sigil:0 "Weaponize The Sigil"
MRE_weaponize_the_sigil_desc:0 "We have amassed a loyal following of those who are devoted to the mageseeker cause who would take up arms given the chance to silence any mage."
MRE_pursue_the_experiments:0 "Pursue The Experiments"
MRE_pursue_the_experiments_desc:0 "The mageseekers claim to be working on a series of experiments that can be turned into weapons for the state. If what they say is true, pursuing their research might help us win this war."
MRE_elevate_wisteria:0 "Elevate Wisteria"
MRE_elevate_wisteria_desc:0 "An old mage experiment, Wisteria has always been a powerful magic wielder. With some false promises and lies, we can easily convert her to be a tool of the mageseekers."
MRE_military_oversight:0 "Military Oversight"
MRE_military_oversight_desc:0 "Our generals must become devoted mageseekers alongside us if they seek our favor. We must work these generals into a stronger, more adaptive force that is ready for any challenge."
MRE_strongarm_the_order_for_good:0 "Strong-arm The Order For Good"
MRE_strongarm_the_order_for_good_desc:0 "The corrupt order, while inherently evil, can be used in ways to benefit the country. Utilizing their old ministers for local governance and order can help stabilize our fractured nation."
MRE_dominance_of_the_mageseekers:0 "Dominance Of The Mageseekers"
MRE_dominance_of_the_mageseekers_desc:0 "The war is over and the mage threat is no more. After hundreds of thousands dying to the tyranny of the arcane, we have persevered and become a better, stronger, and more unified nation."
MRE_banish_those_with_the_sigil:0 "Banish Those With The Sigil"
MRE_banish_those_with_the_sigil_desc:0 "Those we continue to be devoutly loyal to the mageseeker cause must be banished out to the far reaching mountains of our realm. Let them die for the cause they hold so dear."
MRE_raptor_training:0 "Raptor Training"
MRE_raptor_training_desc:0 "The Silverwing Raptors have been a consistent force to demonstrate Demacian airpower, and as such we must expand their training grounds."
MRE_request_aid_from_the_night_hunter:0 "Request Aid From The Night Hunter"
MRE_request_aid_from_the_night_hunter_desc:0 "In light of the increased demonic presence in Demacia, we should call upon the services of Vayne, a notorious demon hunter who can surely help us."
MRE_ideas_of_freedom:0 "Ideas of Freedom"
MRE_ideas_of_freedom_desc:0 "Hundreds of thousands of citizens who are rather dissatisfied with our governance have begun whispering the words of independence from our rule. We must project unity to all before it is too late."
MRE_supported_communities:0 "Supported Communities"
MRE_supported_communities_desc:0 "Through the support of our local communities, we can foster cooperation and harmony among the citizens of our nation."
MRE_turn_to_local_support:0 "Turn To Local Support"
MRE_turn_to_local_support_desc:0 "Smaller, regional governments have their civilian's localized interests in mind better than we do, and we must relax our tight grip if we wish to mend our nation's great rift."
MRE_shadows_emerge:0 "Shadows Emerge"
MRE_shadows_emerge_desc:0 "Those who are in-tune with the arcane have begun appearing inside our borders from the shadows. We must deal with this onset of mages!"
MRE_crowded_dungeons:0 "Crowded Dungeons"
MRE_crowded_dungeons_desc:0 "The prison works underneath the great city of Demacia harbor many supposed criminals, yet they have been receiving far more than expected recently. How should we solve this issue?"
