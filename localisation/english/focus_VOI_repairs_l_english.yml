l_english:
 VOI_unseen_threats_desc: "Icathia's ruins hide dangers that scouts cannot always see. Watchers trained to read warped ground and unnatural silence will keep the realm alert."
 VOI_voidborne_acoustics_desc: "Voidborn do not communicate like mortal armies. By studying their pulses, cries, and vibrations, our hunters may learn to anticipate a swarm."
 VOI_our_army_desc: "Survivors, hunters, and disciplined formations must become one army capable of defending Icathia from enemies both mortal and Voidborn."
 VOI_remora_reborn_desc: "The ancient port of Icathia will rise again as a fortified link between the ruined interior and the wider seas."
 VOI_our_world_desc: "Icathia was more than the catastrophe that consumed it. We will reclaim a future defined by its people rather than by the Void."
 VOI_Open_Void_Gate_desc: "Some believe the power beneath Icathia can be controlled. Opening another breach may grant terrible strength, but the Void has never honored mortal intentions."
 VOI_Mageking_Restoration_desc: "The Mage King once led Icathia's revolt against Shurima. Restoring that legacy will place arcane authority at the center of the reborn state."
 VOI_purple_meat_desc: "Voidborn flesh is dangerous, mutable, and poorly understood. Desperate researchers insist it can still be rendered into supplies for those willing to accept the risk."
 VOI_purple_royalty_desc: "Bel'Veth claims a new order beyond the mindless hunger of the Watchers. Serving her Lavender Sea would exchange mortal freedom for an alien promise of survival."
 VOI_Icathian_Mircle_desc: "That any Icathian people survived the first breach is a miracle bought with memory, exile, and sacrifice. Their endurance will become the foundation of renewal."
 VOI_pacify_our_neightbours_desc: "The lands around Icathia must be secured before rebuilding can endure. Diplomacy is preferable, but hostile raiders and cults cannot be allowed to gather."
 VOI_penal_bandit_divisions_desc: "Captured bandits can repay their crimes in dangerous frontier battalions, preserving trained soldiers for the battles that matter most."
 VOI_invite_settlers_desc: "Reclaimed oases and guarded roads will attract families willing to rebuild the empty places of Icathia."
 VOI_expand_the_textile_industry: "Expand the Textile Workshops"
 VOI_expand_the_textile_industry_desc: "Cloth, tents, uniforms, and trade goods are humble foundations for a country returning from ruin."
 VOI_purge_the_void_desc: "The Void took Icathia once. Every nest, cult, and corrupted ruin must be burned out before it can do so again."
