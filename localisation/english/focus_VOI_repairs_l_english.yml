l_english:
 VOI_unseen_threats_desc: "The cult looks beyond the dangers visible on the surface, imagining a place for the Void's hunters in its campaigns. Rek'Sai stands at the center of these ambitions, though seeking her service will require a further commitment."
 VOI_voidborne_acoustics_desc: "Our followers hope to understand the signs that accompany the Void's hunters. Their attention turns again to Rek'Sai as they consider how her hunting expertise might serve the campaigns ahead."
 VOI_our_army_desc: "While we hold the rift's foothold, the cult will gather more followers into its military ranks. Additional recruits and army experience will help sustain the campaigns ahead."
 VOI_remora_reborn_desc: "Bel'Veth's remora offer the cult an image of the growing host it hopes to serve. While we hold our foothold, we will gather more followers into the ranks and renew their confidence in that purpose."
 VOI_our_world_desc: "The faithful will proclaim a world remade in the image of the power they serve. While we hold the rift's foothold, that common vision will steady the cult and strengthen its authority."
 VOI_Open_Void_Gate_desc: "The faithful will deepen their commitment to the power beneath Icathia while they hold the rift's foothold. The resulting strength will sharpen our attacks and ease the supplies our forces require, sustaining the cult's growing ranks."
 VOI_Mageking_Restoration_desc: "The restored realm will renew its commitment to mage rule. A common vision of recovery will strengthen public confidence and the authority of its leaders."
 VOI_purple_meat_desc: "Icathia's survivors must decide how far they are willing to go in the name of recovery. We will rally them around a common course and strengthen the authority needed to pursue it."
 VOI_purple_royalty_desc: "Icathia will affirm the authority of the order it has chosen to restore. That common allegiance will strengthen public confidence and the army's resolve in battle."
 VOI_Icathian_Mircle_desc: "The restored realm will celebrate its endurance and reaffirm the purpose that binds its people. Shared confidence will steady Icathia and strengthen the armies defending its future."
 VOI_pacify_our_neightbours_desc: "With the immediate Void threat addressed, Icathia will seek better relations with its neighbors and reopen the way to alliances. We will leave the policy of isolation behind as we prepare for recovery."
 VOI_penal_bandit_divisions_desc: "We will organize penal formations under the Shakkal Bandit Division template and bring more recruits into our ranks. Where we still hold secure ground, these infantry formations will reinforce Icathia's army."
 VOI_invite_settlers_desc: "Families willing to return will need work as well as shelter. Where we securely control the land, new civilian workshops will give them a place in Icathia's recovery."
 VOI_expand_the_textile_industry: "Expand the Textile Workshops"
 VOI_expand_the_textile_industry_desc: "Cloth, tents, and uniforms are practical foundations for a country returning from ruin. Where secure land has room for expansion, we will build civilian workshops to support this trade."
 VOI_purge_the_void_desc: "Rebuilding Icathia means preparing for the dangers that remain beyond its settlements. We will give further study of the Void a place in our national effort and rally support for the struggle ahead."
