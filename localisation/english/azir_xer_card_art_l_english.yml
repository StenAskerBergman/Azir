l_english:
 xerath.7.t:0 "The Restored Devout"
 xerath.7.d:0 "In Nerimazeth, Xerath's acolytes brought relics out of the old tombs and turned them into conduits for his power. The Restored Devout show what his followers are willing to give for that strength. Our commanders can now muster Baccai assault companies to break fortified lines."
 xerath.7.a:0 "Muster the assault companies."
