l_english:
 NAZ_bop:0 "The Defense of Nazumah"
 NAZ_bop_decisions:0 "The Defense of Nazumah"
 NAZ_bop_decisions_desc:0 "The council can fund a permanent guard or charter independent hunter companies."
 NAZ_bop_neutral:0 "Civilian Council"
 NAZ_bop_guard:0 "Oasis Guard"
 NAZ_bop_hunters:0 "Hunter Compacts"
 NAZ_bop_guard_range:0 "Oasis Levy in Force"
 NAZ_bop_hunters_range:0 "Company Muster in Force"
 NAZ_council_defense_hearings:0 "Council Defense Hearings"
 NAZ_council_defense_hearings_desc:0 "The elders call K'Sante and Tope to Renek Outcrops to hear how each would keep the city free."
 NAZ_oasis_water_reserves:0 "Reserve Cisterns"
 NAZ_oasis_water_reserves_desc:0 "The council stores water behind the defenses and reinforces the approaches to the oasis."
 NAZ_train_oasis_reserves:0 "Train the Oasis Reserves"
 NAZ_train_oasis_reserves_desc:0 "K'Sante assembles local reserves and stocks the city armories."
 NAZ_company_drills:0 "Train the Hunter Companies"
 NAZ_company_drills_desc:0 "Tope teaches the companies to scout supply routes and coordinate patrols beyond the oasis."
 NAZ_process_monster_materials:0 "Outfit the Expeditions"
 NAZ_process_monster_materials_desc:0 "Nazumah's exotic-material workshops turn the hunters' quarry into field equipment for the companies."
 NAZ_guard_levy:0 "Oasis Defense Levy"
 NAZ_guard_levy_desc:0 "K'Sante's permanent officers maintain a council-funded levy. The concentrated garrison is costly to supply."
 NAZ_contract_muster:0 "Contract Muster"
 NAZ_contract_muster_desc:0 "Tope's expedition advisers muster independent companies. Mobile forces draw less supply but dispersed companies dig in more slowly."
 NAZ_guard_stood_down:0 "Reserves Stood Down"
 NAZ_guard_stood_down_desc:0 "Discharged levy reservists need time to reorganize."
 NAZ_companies_recalled:0 "Companies Recalled"
 NAZ_companies_recalled_desc:0 "Returning companies must settle their contracts and reorganize."
 NAZ_joint_mobilization:0 "Joint Emergency Command"
 NAZ_joint_mobilization_desc:0 "The elders have temporarily combined K'Sante's guard and Tope's companies. Simultaneous mobilization strains supply."
 NAZ_enact_oasis_levy:0 "Enact the Oasis Defense Levy"
 NAZ_enact_oasis_levy_desc:0 "Install K'Sante's permanent officers and fund the reserve levy."
 NAZ_enact_hunter_muster:0 "Enact the Contract Muster"
 NAZ_enact_hunter_muster_desc:0 "Seat Tope's expedition advisers and authorize the hunter-company muster."
 NAZ_release_levy:0 "Release the Levy Obligations"
 NAZ_release_levy_desc:0 "Release the reserve levy and its officers. Readiness falls for 90 days before a replacement charter can take effect."
 NAZ_buy_out_companies:0 "Buy Out the Companies"
 NAZ_buy_out_companies_desc:0 "Pay out the existing contracts and recall the companies. Expedition capacity falls for 90 days before a replacement charter can take effect."
 NAZ_begin_readiness_trial:0 "Begin the Oasis Readiness Trial"
 NAZ_begin_readiness_trial_desc:0 "Hold Renek Outcrops under the levy for 180 consecutive days as an independent Nazumah."
 NAZ_oasis_readiness_trial:0 "Oasis Readiness Trial"
 NAZ_oasis_readiness_trial_desc:0 "Maintain independence, the levy and control of Renek Outcrops until the review. Losing any requirement ends the trial."
 NAZ_contract_oasis_routes:0 "Contract the Oasis Supply Routes"
 NAZ_contract_oasis_routes_desc:0 "Commission a 45-day caravan escort. Returning patrols replenish the support-equipment reserve."
 NAZ_contract_frontier_patrols:0 "Contract the Frontier Patrols"
 NAZ_contract_frontier_patrols_desc:0 "Commission a 60-day expedition to train reconnaissance patrols beyond the oasis."
 NAZ_ratify_hunter_network:0 "Ratify the Hunter Network"
 NAZ_ratify_hunter_network_desc:0 "Recognize two completed contracts and a voluntary regional settlement as the foundation of the hunter network."
 NAZ_joint_emergency_command:0 "Convene the Joint Emergency Command"
 NAZ_joint_emergency_command_desc:0 "Give K'Sante and Tope 120 days of joint command. Mobilizing both establishments increases army supply use."
 NAZ_joint_mandate_term:0 "Joint Command Mandate"
 NAZ_joint_mandate_term_desc:0 "At the end of this term, the council can restore civilian control or vote once for an extension if the emergency persists."
 NAZ_regional.1.t:0 "A Compact with Shurima"
 NAZ_regional.1.d:0 "Shurima proposes a voluntary defense compact. The council can accept the agreement while retaining Nazumah's authority over its companies and garrison."
 NAZ_regional.1.a:0 "Accept the compact."
 NAZ_regional.1.b:0 "Decline the terms."
 NAZ_regional.2.t:0 "Xerath Offers an Armistice"
 NAZ_regional.2.d:0 "Envoys from Xerath have brought terms for ending the war. Renek Outcrops remains in our hands. The council must decide how to answer."
 NAZ_regional.2.a:0 "Send our acceptance."
 NAZ_regional.2.b:0 "Refuse the armistice."
 NAZ_regional.3.t:0 "The Emergency Mandate Expires"
 NAZ_regional.3.d:0 "The joint command has reached the end of its term. The elders may reclaim control or spend political legitimacy on one final term while the frontier emergency continues."
 NAZ_regional.3.a:0 "Return command to the council."
 NAZ_regional.3.b:0 "Vote for one final term."
 NAZ_regional.4.t:0 "The Oasis Guard Stands Ready"
 NAZ_regional.4.d:0 "The reserves have finished their readiness trial. The city held its approaches and the council has certified the garrison for sustained defense."
 NAZ_regional.4.a:0 "Keep the watch."
 NAZ_regional.5.t:0 "A Network of Free Companies"
 NAZ_regional.5.d:0 "Tope's companies have completed both contracts and the council has secured a regional settlement. Nazumah can now rely on a network beyond the oasis."
 NAZ_regional.5.a:0 "Ratify the charter."
