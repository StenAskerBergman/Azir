l_english:
 SHU_labor_law_category:0 "The Question of Slavery"
 SHU_labor_law_category_desc:0 "Azir's decree was proclaimed as the old capital fell. Houses and warbands still enforce their claims. The restored government must decide which claims its own courts and officers will recognize."
 SHU_pass_child_enslavement_bill:0 "Pass the Child Enslavement Bill"
 SHU_pass_child_enslavement_bill_desc:0 "Forbid new claims on children and give local courts authority to hear disputes over family separation. The building guilds lose access to part of their coerced workforce."
 SHU_pass_slave_rights_act:0 "Pass the Slave Rights Act"
 SHU_pass_slave_rights_act_desc:0 "Recognize the right to petition, to keep families together and to contest an owner's claim. If the slaver licences are in force, revoke them. Fund the courts and their inspectors."
 SHU_pass_slaver_rights_act:0 "Pass the Slaver Rights Act"
 SHU_pass_slaver_rights_act_desc:0 "The old houses offer labor for public works in return for recognition of their claims. Issue licences and collect their levies. Communities that fled their rule will see the bargain for what it is."
 SHU_establish_sun_service:0 "Establish the Sun Service"
 SHU_establish_sun_service_desc:0 "Pay workers to repair roads, canals and wells under contracts they are free to leave. Meeting the payroll costs civilian resources, but the service can take over work now done under force."
 SHU_enforce_emancipation:0 "Enforce the Emancipation Decree"
 SHU_enforce_emancipation_desc:0 "Void outstanding ownership claims, fund courts to hear complaints and give local officials the means to enforce their rulings. Work on some building sites will slow while wages and contracts replace coercion."
 SHU_child_protection_law:0 "Child Enslavement Bill"
 SHU_child_protection_law_desc:0 "Shuriman courts no longer recognize new claims over children."
 SHU_slave_rights_law:0 "Slave Rights Act"
 SHU_slave_rights_law_desc:0 "Petitions and inspections give those held in bondage legal recourse. The courts require public funding."
 SHU_slaver_licensing_law:0 "Slaver Rights Act"
 SHU_slaver_licensing_law_desc:0 "Licensed houses supply labor for public works. Their protected claims deepen distrust of the restored government."
 SHU_sun_service_programme:0 "Sun Service"
 SHU_sun_service_programme_desc:0 "Paid crews repair the desert's routes and waterworks. Their wages and supplies draw on civilian resources."
 SHU_emancipation_law:0 "Emancipation Enforced"
 SHU_emancipation_law_desc:0 "The restored state no longer recognizes ownership of people. Formerly enslaved Shurimans can enlist on their own terms."
 SHU_emancipation_transition:0 "Transition to Paid Labor"
 SHU_emancipation_transition_desc:0 "Building projects face disruption while former owners lose command of workers and paid crews negotiate their terms."
