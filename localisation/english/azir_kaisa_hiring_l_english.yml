l_english:
 azir_kaisa_open_foreign_offers_tt: "Kai'Sa will seek a command protecting civilians abroad. She approaches Shurima first, then Nazumah, then Zaun, stopping at the first government that accepts her."
 azir_kaisa_hiring.1.t: "A Hunter Comes to the Gate"
 azir_kaisa_hiring.1.d_shu: "Kai'Sa has brought survivors out of the southern reaches. Now she wants authority to lead a field command against the creatures that hunted them. The refugees speak for her. Soldiers who have seen her living armor close over her face want to know why their government would put her in command.\n\n[GetAzirKaisaSponsorship] If we refuse, she will take her offer to Nazumah."
 azir_kaisa_hiring.1.d_naz: "Our hunters recognize the tracks Kai'Sa has drawn in the dust. She knows how to kill what left them. They ask us to give her a command, but families who depend on the hunters for water fear the creature fastened to her skin. The council must answer to both.\n\n[GetAzirKaisaSponsorship] If we refuse, Zaun is her last prospect."
 azir_kaisa_hiring.1.d_zau: "A maintenance shift is overdue from the lower sumps. Families have been waiting at the pump station since morning. Kai'Sa has been turned away elsewhere. Here the foreman has one question for her: can she bring his crew home? He can offer her a place on the search while the city decides whether to trust her."
 azir_kaisa_hiring_resistance_price: "Public sponsorship costs §Y125 political power§! and carries a §R10-point stability penalty§!. Each anniversary of her appointment removes one point of the penalty."
 azir_kaisa_hiring_invasion_price: "The Void invasion has begun. Public sponsorship now costs §Y250 political power§! and carries a §R10-point stability penalty§!. Each anniversary of her appointment removes one point of the penalty."
 azir_kaisa_hiring.1.hire: "Give Kai'Sa a field command."
 azir_kaisa_hiring.1.trial: "Send Kai'Sa to the pump station."
 azir_kaisa_hiring.1.decline: "We cannot offer her a place here."
 azir_kaisa_hiring_command_tt: "Recruit §YKai'Sa§! as a field commander. [GetAzirKaisaSponsorship]"
 azir_kaisa_hiring_trial_tt: "Take on §YKai'Sa§! provisionally without spending political power. Zaun takes a §R10-point stability penalty§!. Complete the rescue and commission her crew to remove the penalty and unlock her Husk portrait and field command."
 azir_kaisa_public_backlash: "Fear of Kai'Sa's Living Armor"
 azir_kaisa_public_backlash_desc: "Kai'Sa has offered to protect our people. For those who have lost kin to the Void, the sight of her living carapace is reason enough to doubt the government's judgment."
 VOI_refer_kaisa_after_old_reunion: "Refer Kai'Sa to Shurima"
 VOI_refer_kaisa_after_old_reunion_desc: "We let Kai'Sa go her own way after her reunion with Kassadin. Send word that Shurima's southern settlements could use a protector."
