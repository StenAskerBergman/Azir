l_english:
 PIL_city:0 "The City of Progress"
 PIL_city_desc:0 "Use the city's traffic accounts to decide where the Council should put its next round of investment."
 PIL_progress:0 "Hold Progress Day"
 PIL_progress_desc:0 "Give merchants and Academy inventors a public hearing for the proposed charter."
 PIL_hextech:0 "Charter a Hextech Freight Trial"
 PIL_hextech_desc:0 "License a limited trial for high-value cargo and settle who can certify the equipment."
 PIL_timetable:0 "Publish the Regular Departures"
 PIL_timetable_desc:0 "Open a regular timetable once the experimental service has passed its acceptance run."
 PIL_ledger:0 "Review the Sun Gates Ledger"
 PIL_ledger_desc:0 "Ask the harbor master how much of the city's trade still depends on the canal berths."
 PIL_academy:0 "Award the Academy Prize"
 PIL_academy_desc:0 "Call for inventions that can improve the freight service or keep the aging lifts running."
 PIL_open_patents:0 "Open the Patent Register"
 PIL_open_patents_desc:0 "Authorize independent Academy licenses and open the bidding to workshops without a clan sponsor."
 PIL_ferros:0 "The Ferros Concession"
 PIL_ferros_desc:0 "Give Clan Ferros first claim on licensed production. Camille's house can organize supply quickly, but competing suppliers lose access to the drawings."
 PIL_warrants:0 "Caitlyn's Public Warrant"
 PIL_warrants_desc:0 "Ask the Wardens to publish the scope of their inspections, the grounds for detention, and a process for contested permits."
 PIL_charter_board:0 "A Seat for Clan Ferros"
 PIL_charter_board_desc:0 "Give the concession holder a Council seat on commercial security. This makes the house directly answerable for shipments while putting rivals outside the room."
 PIL_survey:0 "Commission the Canal Survey"
 PIL_survey_desc:0 "Authorize an inspection of the shared transfer point. Send it once Zaun can field its own crew."
 PIL_negotiators:0 "Appoint the Crossing Delegation"
 PIL_negotiators_desc:0 "Give the Council's delegation a mandate to offer equal seats or retain unilateral permits once Zaun has answered the inspection."
 PIL_bridge_works:0 "Fund the Upper Approach"
 PIL_bridge_works_desc:0 "Commit Council crews and equipment to the upper approach. The shared board will publish the reopening once Zaun has completed its approach too."
 PIL_detour:0 "Charter a Canal Detour"
 PIL_detour_desc:0 "Put the emergency cargoes on barges and build capacity on Piltover's bank after negotiations break down."
 PIL_open_patents_idea:0 "Open Academy Patents"
 PIL_ferros_concession_idea:0 "Ferros Concession"
 PIL_public_warrants_idea:0 "Published Warrants"
 PIL_clan_board_idea:0 "Ferros on the Trade Board"
 PIL_events.1.t:0 "Progress Day"
 PIL_events.1.d:0 "By noon the demonstration hall is full. Three merchant houses offer to put up the money for the Hexgate. Each has made the same request in a different hand: a standing reservation on the first departures."
 PIL_events.1.a:0 "Sell guaranteed departure slots."
 PIL_events.1.b:0 "Keep the timetable open to all licensed carriers."
 PIL_events.2.t:0 "The Tower on Paper"
 PIL_events.2.d:0 "The drawings show where the tower will stand. The Academy wants independent inspectors to sign off on the load tests. The sponsors have already printed a date for the opening."
 PIL_events.2.a:0 "Give the inspectors time to finish."
 PIL_events.2.b:0 "Let the project engineers certify it."
 PIL_events.3.t:0 "First Light Over Piltover"
 PIL_events.3.d:0 "The tower sends its first scheduled cargo through at dusk. The clerk keeps the dispatch ledger open until confirmation arrives from the far terminal. Only then does the harbor ring its bells."
 PIL_events.3.d0:0 "The tower lights at dusk. The first three consignments belong to the houses that underwrote the charter. The smaller carriers watch the departure boards fill up before the public counter opens."
 PIL_events.3.a:0 "Put the charter into effect."
 PIL_events.4.t:0 "The Sun Gates Ledger"
 PIL_events.4.d:0 "Express consignments have moved to the Hexgate, but the canal still carries the heavy cargo. The harbor master asks the Council to spend some of the new revenue on berths that both kinds of trade depend on."
 PIL_events.4.d0:0 "The harbor master recognizes the small carrier still waiting for a Hexgate slot. Its heavy freight already goes by canal, and now the captain asks the Council to put some of the new fees back into the berths she can actually use."
 PIL_events.4.a:0 "Reinvest in the old docks."
 PIL_events.4.b:0 "Leave the revenue with the air carriers."
 PIL_events.5.t:0 "A License to Build"
 PIL_events.5.d:0 "A workshop has been selling a small drive based on an Academy patent. The inventor complains that no merchant house will sponsor an independent license. The patent holders want the Council to stop the sales."
 PIL_events.5.a:0 "Offer a public license."
 PIL_events.5.b:0 "Uphold the exclusive contract."
 PIL_events.6.t:0 "The Academy Prize"
 PIL_events.6.d:0 "The judges have narrowed the civic prize to two entries. One promises a more efficient freight drive. The other is a new governor for old lift cages, built so local mechanics can service it."
 PIL_events.6.a:0 "Back the lift design."
 PIL_events.6.b:0 "Back the freight drive."
 PIL_events.7.t:0 "Above the Fog"
 PIL_events.7.d:0 "Low cloud has grounded the morning carriers three times this month. The crews ask for public approach beacons. The largest carriers already have private stations and see little reason to pay again."
 PIL_events.7.a:0 "Fund common approach beacons."
 PIL_events.7.b:0 "Let the carriers manage their approaches."
 PIL_events.8.t:0 "A View from the Roofs"
 PIL_events.8.d:0 "A city inspector finds two children on a roof over the Academy district. The report notes where they crossed. There is no box on the form for what they came to see."
 PIL_events.8.a:0 "File the report."
 PIL_events.9.t:0 "The First Regular Departures"
 PIL_events.9.d:0 "The timetable has been posted long enough for the clerks to wear through their first stack of manifests. For the crews that used to wait on the tide, departures now have a time of day."
 PIL_events.9.a:0 "Record the first month of service."
 PIL_events.16.t:0 "The Glasc Offer"
 PIL_events.16.d:0 "Glasc Industries offers to supply the replacement parts at a fixed price. The contract is attractive, but the Council would have to accept a single supplier on both sides of the crossing."
 PIL_events.16.a:0 "License the contract."
 PIL_events.16.b:0 "Require competitive licenses."
 PIL_events.16.c:0 "Let the offer lapse."
 PIL_events.23.t:0 "The Calibration Report"
 PIL_events.23.d:0 "The independent team signs the test register. It asks for a slower first flight and a reduced test load. The engineers have provisioned a cargo hold light enough to meet the new limit."
 PIL_events.23.a:0 "Commission the tower."
 PIL_events.24.t:0 "A Dark Tower at Dusk"
 PIL_events.24.d:0 "The tower goes dark before the first cargo run. A fault recorded during a dry test has to be reviewed before the clerks can take new bookings. The Council's deadline goes by while another shift stays at the tower."
 PIL_events.24.a:0 "Put the tower back through inspection."
 PIL_tower_retest:0 "Complete the Hexgate Retest"
 PIL_beacons:0 "Survey the Air Approaches"
 PIL_roof_report:0 "Read the Rooftop Report"
 PIL_open_patents_idea_desc:0 "Independent workshops can license Academy designs and submit competing prototypes."
 PIL_ferros_concession_idea_desc:0 "Clan Ferros finances licensed production. Its exclusive supply terms leave the Council dependent on one house."
 PIL_public_warrants_idea_desc:0 "Wardens must document the grounds for searches and let merchants appeal a disputed inspection."
 PIL_clan_board_idea_desc:0 "The concession holder coordinates procurement with the Council, which comes to depend on the clan's private suppliers."
 PIL_tower_retest_desc:0 "Run the delayed inspection and clear the tower for service."
 PIL_beacons_desc:0 "Hear the pilots who have lost work to low cloud."
 PIL_roof_report_desc:0 "A city inspector files an unusual report from the Academy district."
 PIL_detour_tt:0 "Unlock the parallel freight decision for this city."
 PIL_domestic_agenda:0 "Piltover's Civic Agenda"
