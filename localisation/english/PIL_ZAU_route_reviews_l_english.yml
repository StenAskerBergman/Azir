l_english:
 PIL_review_licensed_designs:0 "Review Licensed Designs"
 PIL_review_licensed_designs_desc:0 "Spend 30 days comparing designs covered by public warrants and current partner permissions. The Warrant Council will decide whether to commission common gauges or publish the award ledger."
 PIL_route_review.1.t:0 "The First Licensed Designs"
 PIL_route_review.1.d:0 "The Academy delegates bring two items to Jayce: a set of gauges several shops can make from the same licensed drawings, and a ledger showing which firms won the first warrants. The gauges would help small workshops build to the new specifications. Publishing the awards would let those same shops challenge the next round of tenders."
 PIL_route_review.1.a:0 "Commission common workshop gauges"
 PIL_route_review.1.b:0 "Publish the award ledger"
 PIL_review_ferros_reserve:0 "Review the River Pilt Reserve"
 PIL_review_ferros_reserve_desc:0 "Check the dispatch yards under the exclusive concession. The board will choose who bears the cost of keeping reserve shifts staffed."
 PIL_route_review.2.t:0 "Who Pays for the Reserve?"
 PIL_route_review.2.d:0 "The yards can fill an emergency order once. Keeping a reserve shift on call is another expense. The Ferros delegates propose a guaranteed allocation that would increase output and divert civilian capacity. The quartermasters instead ask to use existing crews for a dispatch drill so they can find where an order would stall."
 PIL_route_review.2.a:0 "Guarantee the reserve shifts for 90 days"
 PIL_route_review.2.b:0 "Run a dispatch drill with the existing crews"
 PIL_check_inspected_tenders:0 "Check the First Inspected Tenders"
 PIL_check_inspected_tenders_desc:0 "Check the first contracts issued under Regulated Inspection. Caitlyn can use the results to improve the public tender register or train the bench inspectors."
 PIL_route_review.3.t:0 "The First Signed Inspections"
 PIL_route_review.3.d:0 "The new register shows who signed each tender and who inspected the delivery. Caitlyn has found the same faulty gauge on orders from three workshops. She proposes publishing aggregate findings and a way to challenge a ruling, or using the rejected batches to train inspectors on a common bench standard."
 PIL_route_review.3.a:0 "Publish the findings and appeals procedure"
 PIL_route_review.3.b:0 "Train inspectors on a common bench standard"
 ZAU_review_ward_service_budget:0 "Review the Ward Service Budget"
 ZAU_review_ward_service_budget_desc:0 "Spend 30 days checking clinic deliveries and workshop repair orders before the ward delegates decide how to use their reserve."
 ZAU_route_review.1.t:0 "Where the Ward Reserve Goes"
 ZAU_route_review.1.d:0 "Delegates arrive with a clinic requisition book and a list of pumps that the workshops can keep in service if they share spares. Both lists carry local signatures. The ward delegates have enough money to cover one request this quarter."
 ZAU_route_review.1.a:0 "Guarantee the clinic deliveries"
 ZAU_route_review.1.b:0 "Pool the workshop spares"
 ZAU_review_glasc_contract:0 "Review the Directorate Contract"
 ZAU_review_glasc_contract_desc:0 "Check freight performance under a delivered regional contract. If it remains live, Glasc can choose between a payroll guarantee and a short output drive."
 ZAU_route_review.2.t:0 "The Cost of Guaranteed Delivery"
 ZAU_route_review.2.d:0 "The contract is paying on time. Renata Glasc can promise the yards a fixed payroll from the current receipts, or ask the same crews to run a more profitable schedule with fewer breaks. The first buys some confidence from workers. The second increases output and leaves less capacity for ordinary contracts."
 ZAU_route_review.2.a:0 "Guarantee the current payroll"
 ZAU_route_review.2.b:0 "Run the yards on the delivery schedule"
 ZAU_confirm_federation_oversight:0 "Convene the Federation Delegates"
 ZAU_confirm_federation_oversight_desc:0 "After ratification, give the ward delegates 30 days to decide how often to review the Firelights' repair mandate."
 ZAU_route_review.3.t:0 "Who Can Recall the Crews?"
 ZAU_route_review.3.d:0 "Ekko brought crews to keep people moving when the crossings closed. Now the wards must decide what he can ask those crews to do. Rotating the repair leads keeps the detour staffed. A public hearing would let the wards recall a contractor and insist on seeing the accounts."
 ZAU_route_review.3.a:0 "Rotate the crews through the wards"
 ZAU_route_review.3.b:0 "Let the wards challenge emergency contracts"
 PIL_ferros_reserve_shifts:0 "Guaranteed Reserve Shifts"
 PIL_ferros_reserve_shifts_desc:0 "Ferros keeps additional crews available for reserve orders by drawing capacity away from civilian contracts."
 ZAU_glasc_delivery_shifts:0 "Glasc Delivery Shifts"
 ZAU_glasc_delivery_shifts_desc:0 "The Directorate is giving priority to the scheduled shipments and reducing capacity for other contracts."
 PIL_ZAU_route_review_defer:0 "File the review and defer the decision"
