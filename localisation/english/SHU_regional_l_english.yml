l_english:
 SHU_bop:0 "Authority of the Sun Disc"
 SHU_bop_decisions:0 "Restoration and Provincial Charters"
 SHU_bop_compact:0 "Provincial Compact"
 SHU_bop_compact_desc:0 "Provincial Compact"
 SHU_bop_court:0 "Imperial Court"
 SHU_bop_court_desc:0 "Imperial Court"
 SHU_bop_neutral:0 "Contested Authority"
 SHU_bop_neutral_desc:0 "Contested Authority"
 SHU_bop_assemblies:0 "Provincial Mandates"
 SHU_bop_assemblies_desc:0 "Provincial Mandates"
 SHU_bop_entrenched_compact:0 "Chartered Provinces"
 SHU_bop_entrenched_compact_desc:0 "Chartered Provinces"
 SHU_bop_administration:0 "Royal Administration"
 SHU_bop_administration_desc:0 "Royal Administration"
 SHU_bop_entrenched_court:0 "Crown Authority"
 SHU_bop_entrenched_court_desc:0 "Crown Authority"
 SHU_crown_levy:0 "Crown Levy"
 SHU_crown_levy_desc:0 "A standing levy concentrates troops and supplies along the royal road. The levy benefit is suspended when the Sun Disc or Vekaura falls."
 SHU_local_muster:0 "Local Muster"
 SHU_local_muster_desc:0 "Provincial rolls and depots sustain local defense. Separate commands take longer to prepare a concentrated offensive."
 SHU_levy_transition:0 "Disbanding the Crown Levy"
 SHU_levy_transition_desc:0 "Royal engineers are reassigned while the standing levy is demobilized."
 SHU_muster_transition:0 "Renegotiating Provincial Musters"
 SHU_muster_transition_desc:0 "Provincial officials suspend collections while the charter terms are rewritten."
 SHU_imperial_restoration:0 "Restored Imperial Administration"
 SHU_imperial_restoration_desc:0 "The court can support a concentrated standing force while the Sun Disc and Vekaura remain secure."
 SHU_provincial_compact:0 "Ratified Provincial Compact"
 SHU_provincial_compact_desc:0 "Provincial institutions continue to provide resources and local defense through disruptions at the center."
 SHU_custodianship:0 "Custody of the Sun Disc"
 SHU_custodianship_desc:0 "Sivir holds temporary authority pending a public vote and a formal handover."
 SHU_imperial_engineers:0 "Imperial Engineers"
 SHU_provincial_delegates:0 "Provincial Delegates"
 SHU_restore_royal_administration:0 "Restore the Royal Administration"
 SHU_restore_royal_administration_desc:0 "Fund the imperial rolls and appoint a permanent garrison at the Sun Disc."
 SHU_build_royal_supply_road:0 "Rebuild the Royal Supply Road"
 SHU_build_royal_supply_road_desc:0 "Repair the road and depots at Vekaura. The imperial supply benefits require control of Vekaura and the Sun Disc."
 SHU_charter_assemblies:0 "Charter the Local Assemblies"
 SHU_charter_assemblies_desc:0 "Fund local assemblies to appoint delegates and register local obligations."
 SHU_charter_waterworks:0 "Charter the Provincial Waterworks"
 SHU_charter_waterworks_desc:0 "Spend political power on the Southern Flow irrigation works and the district responsible for maintaining them."
 SHU_charter_garrisons:0 "Charter the Local Garrisons"
 SHU_charter_garrisons_desc:0 "Fund locally commanded garrisons with recruits registered by the provincial assemblies."
 SHU_enact_crown_levy:0 "Enact the Crown Levy"
 SHU_enact_crown_levy_desc:0 "Raise the standing levy and give its supply depots priority. Both ends of the royal road must remain secure."
 SHU_enact_local_muster:0 "Enact the Local Muster"
 SHU_enact_local_muster_desc:0 "Use provincial rolls to raise local defense forces. Coordinating a concentrated offensive takes longer."
 SHU_repeal_crown_levy:0 "Repeal the Levy and Reassign the Engineers"
 SHU_repeal_crown_levy_desc:0 "Disband the levy, reassign the royal engineers to provincial works, and accept a 90-day mobilization slowdown."
 SHU_renegotiate_provincial_charters:0 "Renegotiate the Provincial Charters"
 SHU_renegotiate_provincial_charters_desc:0 "Transfer provincial musters to central administration. Local collections fall for 90 days while delegates renegotiate their mandates."
 SHU_offer_nazumah_defense_compact:0 "Offer Nazumah a Defense Compact"
 SHU_offer_nazumah_defense_compact_desc:0 "Ask Nazumah to sign a voluntary defense compact. Only explicit acceptance counts toward ratification."
 SHU_custody_category:0 "Temporary Custody of the Sun Disc"
 SHU_public_charter_vote:0 "Hold the Public Charter Vote"
 SHU_public_charter_vote_desc:0 "Convene a public vote on the charter naming Nasus as interim administrator at handover."
 SHU_request_custody_handover:0 "Convene the Handover"
 SHU_request_custody_handover_desc:0 "Call Sivir and Nasus to the Sun Disc to transfer temporary authority before the deadline."
 SHU_custody_deadline:0 "The Custody Charter Expires"
 SHU_custody_deadline_desc:0 "Hold the public vote and complete the handover within 120 days. On expiry, Sivir loses the powers of custody and Shurima loses stability and political power."
 SHU_regional.2.t:0 "An Armistice at the Sun Disc"
 SHU_regional.2.d:0 "Xerath has offered to end the fighting. The Sun Disc remains in our hands. The court must decide whether to sign."
 SHU_regional.2.a:0 "Accept the armistice."
 SHU_regional.2.b:0 "Reject the terms."
 SHU_regional.3.t:0 "The Custodian of the Sun Disc"
 SHU_regional.3.d:0 "Azir is gone and the Sun Disc remains secure. Sivir will hold it under a public charter only if the country agrees to vote on a successor and hand over power within 120 days."
 SHU_regional.3.a:0 "Offer Sivir the temporary charter."
 SHU_regional.3.b:0 "Decline the proposal."
 SHU_regional.4.t:0 "The Custodian Hands Over the Disc"
 SHU_regional.4.d:0 "The public vote has approved the charter. Sivir asks Nasus to administer the Sun Disc and honor the limits set by the assemblies."
 SHU_regional.4.a:0 "Record the handover."
 SHU_regional.4.b:0 "Postpone the ceremony."
 SHU_regional.5.t:0 "The Charter Expires"
 SHU_regional.5.d:0 "The deadline passed without a handover. The charter suspends Sivir’s powers and the court faces a loss of public confidence."
 SHU_regional.5.a:0 "Close the custodianship."
 SHU_codify_imperial_restoration:0 "Codify the Imperial Restoration"
 SHU_codify_imperial_restoration_desc:0 "Confirm the restored royal administration once the war over the Sun Disc is settled and the Vekaura supply road is complete."
 SHU_ratify_provincial_compact:0 "Ratify the Provincial Compact"
 SHU_ratify_provincial_compact_desc:0 "The compact requires three provincial charters, uncontested control of the Sun Disc and Nazumah’s explicit consent to a defense compact."
