l_english:
 PLT_zaun_tension:0 "Piltover's Grip on Zaun"
 PLT_exploitation:0 "Exploitation"
 PLT_concessions:0 "Concessions"
 PLT_total_control:0 "Total Control"
 PLT_total_control_desc:0 "Piltover's control boosts its political influence and construction, but repression erodes stability and suppresses Zaun's autonomy."
 PLT_hard_exploitation:0 "Hard Exploitation"
 PLT_hard_exploitation_desc:0 "Extraction strengthens the Council while resentment grows and Zaun's autonomy is held back."
 PLT_uneasy_coexistence:0 "Uneasy Coexistence"
 PLT_uneasy_coexistence_desc:0 "Neither side has gained enough influence to impose its preferred settlement."
 PLT_limited_concessions:0 "Limited Concessions"
 PLT_limited_concessions_desc:0 "Piltover accepts a small loss of political control as Zaun gains autonomy each day."
 PLT_zaun_autonomy:0 "Zaunite Autonomy"
 PLT_zaun_autonomy_desc:0 "Zaun gains autonomy quickly, while Piltover pays for relinquishing control with slower construction and less political influence."
 PLT_expand_exploitation:0 "Tighten Piltover's Grip"
 PLT_expand_exploitation_desc:0 "Increase extraction and control in the Undercity, strengthening Piltover's position at the cost of worsening resentment."
 PLT_force_control:0 "Impose Direct Control"
 PLT_force_control_desc:0 "Further coercion is costly and destabilising. This decision is available only while Piltover has not reached its maximum control."
 PLT_offer_concessions:0 "Offer Limited Concessions"
 PLT_offer_concessions_desc:0 "Ease pressure on Zaun and give the Undercity a reason to remain compliant."
 PLT_extend_zaun_autonomy:0 "Extend Zaunite Autonomy"
 PLT_extend_zaun_autonomy_desc:0 "Granting further autonomy is politically expensive. This decision is available only until Zaun reaches the highest autonomy tier."
 ZAU_revolution:0 "Zaun's Unrest"
 ZAU_fragile_peace:0 "Fragile Peace"
 ZAU_revolutionary_fervor:0 "Revolutionary Fervor"
 ZAU_vanders_peace:0 "Vander's Peace"
 ZAU_vanders_peace_desc:0 "Order strengthens stability and industry but dampens war support and Zaun's daily autonomy gain."
 ZAU_rising_tensions:0 "Rising Tensions"
 ZAU_rising_tensions_desc:0 "A tense peace preserves some stability while suppressing the will to fight."
 ZAU_growing_discontent:0 "Growing Discontent"
 ZAU_growing_discontent_desc:0 "Discontent weakens stability even as Zaun's readiness to fight begins to grow."
 ZAU_organised_resistance:0 "Organised Resistance"
 ZAU_organised_resistance_desc:0 "Resistance increases war support, manpower and autonomy, while undermining stability."
 ZAU_open_revolt:0 "Open Revolt"
 ZAU_open_revolt_desc:0 "Open revolt accelerates autonomy and mobilisation, but damages stability and production. At the peak, Zaun can choose to launch a war of independence against Piltover."
 ZAU_preserve_fragile_peace:0 "Preserve the Fragile Peace"
 ZAU_preserve_fragile_peace_desc:0 "Keep tensions contained and prevent discontent from becoming an organised revolt."
 ZAU_force_order:0 "Enforce Order"
 ZAU_force_order_desc:0 "Suppressing unrest this far along is expensive. This decision is unavailable once the peace track reaches its extreme."
 ZAU_organize_revolt:0 "Organise the Revolt"
 ZAU_organize_revolt_desc:0 "Turn Zaun's anger into a coordinated movement capable of challenging Piltover."
 ZAU_escalate_revolt:0 "Escalate the Uprising"
 ZAU_escalate_revolt_desc:0 "Further escalation demands substantial political power and risks pushing Zaun into open revolt."
 PLT_zaun_bop_decisions:0 "Piltover's Policy Toward Zaun"
 ZAU_revolution_bop_decisions:0 "Zaun's Struggle"


