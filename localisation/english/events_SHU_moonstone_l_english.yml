l_english:
 shurima_moonstone.1.t: "The Tidecaller Ashore"
 shurima_moonstone.1.d: "Nami speaks for the Marai. In every generation, their Tidecaller bore an abyssal pearl into the darkness and returned it to a lunar guardian. The guardian transformed it into a Moonstone, whose light kept the creatures of the deep at bay. This time the guardian never came. The ancient accord with Targon is broken, and the Marai's protection is failing."
 shurima_moonstone.1.a: "Shurima will help the Marai."
 shurima_moonstone.2.t: "Where the Moon Has Gone"
 shurima_moonstone.2.d: "The old guardian is gone, but the moon's power has not vanished. Nami's staff points toward the Lunari and toward Diana, host of the Moon Aspect. We may petition Targon openly, or follow scattered Lunari exiles and reconstruct the rite without its rulers."
 shurima_moonstone.2.a: "Send Nami's petition to Diana."
 shurima_moonstone.2.b: "Seek the hidden Lunari ourselves."
 shurima_moonstone.3.t: "The Marai Petition"
 shurima_moonstone.3.d: "Envoys from Shurima have brought Nami, Tidecaller of the Marai, to Targon's threshold. Their ancient lunar guardian no longer answers the sacred exchange, and the magic shielding the Marai is failing. Diana's bond with the Moon Aspect and the Lunari's suppressed rites may be the only way to create a new Moonstone."
 shurima_moonstone.3.a: "Diana will restore the ancient accord."
 shurima_moonstone.3.b: "Targon's sacred power is not Shurima's to command."
 shurima_moonstone.4.t: "Moonlight Beneath the Waves"
 shurima_moonstone.4.d: "Under Diana's guidance, Lunari ritualists have renewed the broken exchange. Nami returns bearing a Moonstone alive with pale light. Far below the surface, the glow spreads across the Marai settlement and drives the hungering darkness back into the abyss."
 shurima_moonstone.4.a: "The Marai will endure."
 shurima_moonstone.5.t: "The Moonlit Gate Closes"
 shurima_moonstone.5.d: "Targon has refused Nami's petition. The old guardian remains absent and the Marai cannot wait for doctrine or politics to change. Lunari refugees, forbidden texts, and the pull of the Tidecaller staff offer one last path toward reconstructing the rite."
 shurima_moonstone.5.a: "Find those who still remember."
 shurima_moonstone.6.t: "A Moonstone Reborn"
 shurima_moonstone.6.d: "After weeks following fragments of Lunari teaching, Nami and the exiles complete the sacred exchange. The new Moonstone does not come from the vanished guardian, but its light answers the tides all the same. The Marai's long night is ending."
 shurima_moonstone.6.a: "Carry its light home."
 SHU_moonstone_decisions: "The Broken Moonstone Accord"
 SHU_moonstone_decisions_desc: "If Targon will not restore the old rite, Nami must gather the Lunari knowledge scattered across Runeterra."
 SHU_seek_lunari_exiles: "Seek the Hidden Lunari"
 SHU_seek_lunari_exiles_desc: "Search the mountain roads, coastal sanctuaries, and refugee communities for Lunari who remember enough of the ancient Marai accord to forge a new Moonstone."
 SHU_moonstone_quest_unresolved: "The Fading Moonstone"
 SHU_moonstone_quest_unresolved_desc: "The magic that protects the Marai is weakening while Nami's search remains unfinished. Fear spreads with every darkening tide."
 SHU_moonstone_blessing: "Moonstone's Tidal Blessing"
 SHU_moonstone_blessing_desc: "A renewed Moonstone guards the Marai settlement and binds their Tidecaller, Shurima, and the Lunari through a restored sacred accord."
 SHU_moonstone_cooperation: "Restored the Marai Accord"
 SHU_moonstone_refused: "Refused the Marai Petition"
