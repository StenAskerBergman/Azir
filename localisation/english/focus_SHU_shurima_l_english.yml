SHU_lectures_in_shakkal: "Lectures in Shakkal"
SHU_lectures_in_shakkal_desc: "The struggle against the Void demands more than resolve. Gather the lessons discussed in Shakkal and put them before our commanders, strengthening the experience and authority behind our preparations."

SHU_shakkal_deal: "Shakkal Deal"
SHU_shakkal_deal_desc: "Our dealings with Shakkal must give the restored state firmer ground on which to act. Pursue an understanding that strengthens confidence at home and the authority needed to sustain our course."

SHU_nomadic_library: "Nomadic Library"
SHU_nomadic_library_desc: "Knowledge carried between camps should have a place in Shurima's renewal. Assemble a traveling collection of technical learning, supporting the study of communications and other electronic devices."

SHU_shakkal_lecture: "Shakkal Lecture"
SHU_shakkal_lecture_desc: "The experience gathered in Shakkal deserves a hearing among our officers. Use these lessons to sharpen their judgment and strengthen the authority guiding the legions."

SHU_subjugate_the_locals: "Subjugate the Locals"
SHU_subjugate_the_locals_desc: "Impose the restored state's authority upon those who resist it. Our commanders will gain experience and supporters will rally to the campaign, but coercion will deepen unrest at home."

# SHU_marai_marines: "Marai Marines"
# SHU_marai_marines_desc: "Form the Marai Marines to strengthen our coastal defenses and project our power across the seas. This will add a naval company and increase our maritime capabilities."

#  SHU_nazumahs_pride: "Nazumah's Pride"
#  SHU_nazumahs_pride_desc: "Emphasize the pride and strength of Nazumah. This will foster loyalty and respect among the Nazumah people."

SHU_in_the_hawks_eyes: "In the Hawk's Eyes"
SHU_in_the_hawks_eyes_desc: "Study the desert with the patience of a watchful hawk. Refine the judgment of our commanders and rally support for the preparations that must precede action."

SHU_subjugation_tactics: "Subjugation Tactics"
SHU_subjugation_tactics_desc: "Our commanders must prepare for the resistance that imperial coercion invites. Draw lessons from the campaign and strengthen resolve for the struggle ahead."

SHU_diplomacy_approach: "Diplomatic Approach"
SHU_diplomacy_approach_desc: "The restored state must be able to speak with authority as well as command its armies. Build support for a diplomatic course, strengthening confidence at home before seeking agreements abroad."

SHU_allies: "Allies"
SHU_allies_desc: "Shurima should seek partners willing to stand beside its renewal. Rally domestic support for cooperation with Shakkal and prepare the authority needed to pursue that relationship."

SHU_great_crusade: "Great Crusade"
SHU_great_crusade_desc: "Call the people to a great campaign in the name of Shurima's restoration. Gather fresh recruits, draw on the legions' experience and strengthen the resolve needed for the struggles ahead."

SHU_remove_the_natives: "Remove the Savages"
SHU_remove_the_natives_desc: "The hardliners demand a campaign against those they condemn as enemies of the restored empire. Rally their supporters and prepare our commanders for coercion, knowing that this course will deepen division at home."

SHU_regional_investment: "Regional Investment"
SHU_regional_investment_desc: "Restoration must be supported by productive work throughout our lands. Establish a new civilian workshop in a province we own and control, strengthening the authority behind our investment program."

SHU_shakkal_region: "The Shakkal Frontier"
SHU_shakkal_region_desc: "Assert a clearer imperial policy toward the Shakkal frontier. Strengthen the government's mandate and public confidence in its approach, preparing the ground for the relationship we seek."

SHU_shakkal_autonomy_region2: "Shakkal Autonomy"
SHU_shakkal_autonomy_region2_desc: "Secure control over the Shakkal region to strengthen our strategic position but let them retain a local mandate. This will enhance our influence, without upsetting the order and still provide valuable resources."

SHU_recover_our_sand: "Recover Our Sand"
SHU_recover_our_sand_desc: "Call fresh recruits to the cause of recovering Shurima's lost lands. Build the experience and resolve of the legions before the struggle to reclaim them begins."

SHU_work_camps: "Work Camps"
SHU_work_camps_desc: "The military authorities will organize compulsory labor for the restored state's factories and building projects. Greater output and faster construction will come at a continuing cost to stability."

SHU_the_neighbours: "The Neighbours"
SHU_the_neighbours_desc: "Shurima's renewal cannot be considered apart from the peoples beyond its borders. Set out an expansion policy and weigh the courses available toward our neighbors before committing to them."

SHU_Minors: "Minor Nations"
SHU_Minors_desc: "Address the issues and concerns of the minor nations within our borders. This will ensure their loyalty and integration into the Shuriman Empire."

SHU_Major: "Major Nations"
SHU_Major_desc: "Engage with the major nations surrounding Shurima. This will strengthen our diplomatic relations and secure our position as a dominant power."

SHU_fate_of_targon: "Fate of Targon"
SHU_fate_of_targon_desc: "With an expansion policy established, Shurima must define its course toward Targon. Build the authority needed to pursue that policy before choosing the demands or agreements that will follow."

SHU_annex_targon: "Demand Targon's Annexation"
SHU_annex_targon_desc: "The crown will demand that Targon accept direct Shuriman rule. Its answer will determine whether incorporation proceeds by agreement or leaves us preparing an annexation campaign."

SHU_example_ba_targon: "Occupy the Mountain Passes"
SHU_example_ba_targon_desc: "Prepare the legions for the struggle over Targon's mountain approaches. Draw on our commanders' experience and rally support for the campaign, before attempting to hold the passes."

SHU_example_ca_targon: "Break the Celestial Strongholds"
SHU_example_ca_targon_desc: "The campaign against Targon needs steadier direction at home. Strengthen the authority behind our policy and public confidence in the government as it pursues its ambitions upon the mountain."

SHU_rich_mountains_gold: "Develop Steel Deposits"
SHU_rich_mountains_gold_desc: "The restored state needs a steadier supply of metal for its workshops and arsenals. Develop steel resources in land we own and control, strengthening the authority behind this new industrial effort."

SHU_rich_mountains_dia: "Develop Chromium Deposits"
SHU_rich_mountains_dia_desc: "Carry our mineral development further by opening chromium resources in our own controlled lands. Give the government firmer means to support the industries on which Shurima's renewal depends."

SHU_puppet_or_ally_targon: "Puppet or Ally Targon"
SHU_puppet_or_ally_targon_desc: "Choose the relationship Shurima will pursue with Targon: a demand for submission or, where faction ties permit, an approach toward alliance. The mountain's response must follow through the diplomatic exchange."

SHU_shuriman_argreement_targon: "Shuriman Agreement with Targon"
SHU_shuriman_argreement_targon_desc: "Give the proposed relationship with Targon a firmer place in Shurima's policy. Rally confidence and authority behind the compact we seek, without presuming that every term has already been accepted."

SHU_example_cb_targon: "Celestial Exchange"
SHU_example_cb_targon_desc: "Bring the lessons of our dealings with Targon before the imperial court and the legions. Strengthen the authority, experience and confidence needed to carry this course forward."

SHU_fate_of_ixtal: "Fate of Ixtal"
SHU_fate_of_ixtal_desc: "Shurima must establish a course toward Ixtal before pursuing its ambitions there. Strengthen the authority behind that policy and prepare to choose the relationship our government will seek."

SHU_annex_ixtal: "Demand Ixtal's Annexation"
SHU_annex_ixtal_desc: "We will demand that Ixtal submit to incorporation into the Shuriman Empire. Acceptance would bring it under our rule; refusal will give us grounds to pursue annexation by force."

SHU_jungle_machine: "Jungle Warfare Training"
SHU_jungle_machine_desc: "The empire must prepare its specialist troops for fighting beneath the jungle canopy. Training marines, mountaineers, and airborne troops for these conditions will improve their movement and attacks in jungle terrain."

SHU_jungle_adventure: "Jungle Adventure"
SHU_jungle_adventure_desc: "Prepare our forces for the demands of a campaign beyond the desert. Draw lessons from the jungle venture and gather support for the course Shurima intends to pursue."

SHU_rich_lands_gold: "Broaden the Steel Supply"
SHU_rich_lands_gold_desc: "Extend the search for steel resources through lands we own and control. A broader supply will give Shurima's industrial ambitions firmer foundations and strengthen the mandate for development."

SHU_rich_lands_dia: "Open Tungsten Deposits"
SHU_rich_lands_dia_desc: "Develop tungsten resources in our own controlled lands as the next step in mineral expansion. Place the government's authority behind an effort to supply the restored state's industries."

SHU_puppet_or_ally_ixtal: "Puppet or Ally Ixtal"
SHU_puppet_or_ally_ixtal_desc: "Choose whether Shurima will seek Ixtal's submission or, where faction ties permit, approach it as a prospective ally. The diplomatic exchange must determine the response; our choice alone does not settle the relationship."

SHU_shuriman_pact_ixtal: "Shuriman Pact with Ixtal"
SHU_shuriman_pact_ixtal_desc: "Give our proposed relationship with Ixtal a firmer place in imperial policy. Strengthen public confidence and the authority behind the pact we seek to sustain."

SHU_example_cb_ixtal: "Elemental Exchange"
SHU_example_cb_ixtal_desc: "Put the technical lessons sought through our dealings with Ixtal to work in Shurima. Support the study of electronic devices and strengthen confidence in the policy guiding this exchange."

SHU_example_noxian_start: "The Noxian Question"
SHU_example_noxian_start_desc: "Shurima must prepare a course toward Noxus while its coast remains within reach. Gather military experience and political authority before deciding whether confrontation or diplomacy will serve the restored state."

SHU_example_aa_noxian: "Pursue Noxian Submission"
SHU_example_aa_noxian_desc: "Commit the government to seeking Noxian submission beneath Shuriman authority. Build confidence in this course at home before making any demand abroad."

SHU_example_ba_noxian: "Rally Against Noxus"
SHU_example_ba_noxian_desc: "Strengthen the mandate for our chosen course against Noxus. Rally supporters behind the government and prepare them for the possibility of a wider struggle."

SHU_example_ca_noxian: "Prepare the Noxian Campaign"
SHU_example_ca_noxian_desc: "The pursuit of imperial supremacy requires commanders ready for the struggle. Develop their experience and strengthen support for the campaign we intend to undertake."

SHU_example_ab_noxian: "Treat with the Trifarix"
SHU_example_ab_noxian_desc: "Prepare a diplomatic approach toward the Noxian leadership. Strengthen the authority and confidence behind our negotiating position before seeking a bargain with the other empire."

SHU_example_bb_noxian: "Arms Across the Mountains"
SHU_example_bb_noxian_desc: "Our diplomatic course must rest on an arsenal of our own. Establish a new arms workshop in land we own and control, giving the government firmer means to sustain its policy."

SHU_example_cb_noxian: "Reinforce the Desert Host"
SHU_example_cb_noxian_desc: "Bring fresh recruits into Shurima's available manpower and draw on the experience of our commanders. The desert host must be ready to support the course our government has chosen."

SHU_example_ac_noxian: "Prepare War with Noxus"
SHU_example_ac_noxian_desc: "Gather the political authority and public confidence needed to prepare for confrontation with Noxus. Establish our intended course before deciding when and how it will be carried into action."

SHU_example_bc_noxian: "Shatter the Border Forts"
SHU_example_bc_noxian_desc: "Prepare the legions for the hard fighting that a Noxian frontier campaign would demand. Develop their experience and rally support for the advance we intend to attempt."

SHU_example_cc_noxian: "The Empire against the Trifarix"
SHU_example_cc_noxian_desc: "The hardliners demand that Shurima persist in its struggle against Noxian power. Rally their supporters and draw lessons for the legions, accepting that this determination will strain stability at home."

SHU_example_ionian_start: "The Ionian Question"
SHU_example_ionian_start_desc: "A course toward Ionia must be established before Shurima acts beyond the sea. Gather the authority needed to weigh imperial demands against other approaches to the First Lands."

SHU_example_aa_ionian: "Pursue Ionian Submission"
SHU_example_aa_ionian_desc: "Commit our government to seeking recognition of Shuriman authority in Ionia. Strengthen confidence in that policy at home before attempting to enforce it abroad."

SHU_example_ba_ionian: "Break Provincial Resistance"
SHU_example_ba_ionian_desc: "The pursuit of supremacy in Ionia will demand steadier direction from the capital. Consolidate the government's mandate and public confidence before confronting the resistance we anticipate."

SHU_example_ca_ionian: "Prepare the Ionian Host"
SHU_example_ca_ionian_desc: "Develop the experience of our commanders and rally support for the course chosen toward Ionia. The legions must be prepared before they can attempt to carry that policy beyond our shores."

SHU_example_ab_ionian: "Prepare Ionian Integration"
SHU_example_ab_ionian_desc: "Build the government's mandate for the relationship it seeks with the First Lands. Strengthen confidence in this course before attempting any change to the political order beyond our borders."

SHU_example_bb_ionian: "Study Ionian Methods"
SHU_example_bb_ionian_desc: "Support technical study arising from our interest in the First Lands. Direct that learning toward electronic devices and gather the authority needed to sustain the effort."

SHU_example_cb_ionian: "Gather the Expeditionary Recruits"
SHU_example_cb_ionian_desc: "Gather fresh recruits for Shurima's available manpower and develop the experience of our commanders. Our forces must be prepared to carry the policy chosen toward Ionia."

SHU_example_ac_ionian: "Seek an Ionian Accord"
SHU_example_ac_ionian_desc: "Rally confidence in seeking an accord with Ionia. Strengthen the authority behind this diplomatic ambition before pursuing agreement with those beyond our shores."

SHU_example_bc_ionian: "Wisdom of the First Lands"
SHU_example_bc_ionian_desc: "Turn the lessons sought from the First Lands toward the preparation of our commanders. Develop their experience and strengthen support for the course we intend to carry forward."

SHU_example_cc_ionian: "Rally for the Ionian Compact"
SHU_example_cc_ionian_desc: "Call for renewed resolve behind our intended course toward Ionia. The legions will gain experience and supporters will rally, though this commitment will strain stability at home."

SHU_scout_remote_islands: "Extend Influence to Bilgewater"
SHU_scout_remote_islands_desc: "Our coastal foothold gives Shurima a route to Bilgewater. We will use it to promote our political influence among its people and prepare for further imperial dealings."

SHU_pirate_hunt: "Pirate Hunt"
SHU_pirate_hunt_desc: "Prepare our maritime service for a campaign against piracy around Bilgewater. Develop the experience of our captains and rally support for the pursuit of safer passage."

SHU_pirate_alliance: "Pirate Alliance"
SHU_pirate_alliance_desc: "Invite Bilgewater to stand within our faction while its captains remain outside another alliance and at peace with us. The invitation offers a place beside Shurima; their response must decide whether that partnership is formed."

SHU_independant_republic: "Seek Aurman Submission"
SHU_independant_republic_desc: "If Aurma still stands, demand its submission and await its response. If its state has fallen, reconstitute an administration beneath Shuriman authority from eligible Aurman core lands fully under our control, excluding our own claimed and core territories."

SHU_autonomus_state: "Reconstitute Aurma as a Subject"
SHU_autonomus_state_desc: "Where Aurma has ceased to exist and eligible Aurman core lands are fully under our control, restore its administration beneath Shuriman authority. Lands claimed by or core to Shurima will remain outside this transfer."

SHU_rule_aurma: "The Aurma Question"
SHU_rule_aurma_desc: "Establish a course toward Aurma while our coast provides a foothold for maritime policy. Gather political authority and naval experience before choosing the relationship Shurima will pursue."

SHU_potential_alliance: "Potential Alliance"
SHU_potential_alliance_desc: "Invite Aurma to stand beside Shurima within our faction while it remains outside another alliance and at peace with us. Its response must determine whether this prospective partnership is formed."

SHU_rebuilding_our_armada: "Rebuilding Our Armada"
SHU_rebuilding_our_armada_desc: "It is time we start rebuilding our fleets to their former glory! By revitalizing our naval forces, we will ensure the protection of our trade routes, assert our dominance at sea, and prepare for any maritime challenges. This will strengthen our naval capabilities and secure Shurima's position as a formidable maritime power."

SHU_merchant_fleet: "Merchant Fleet"
SHU_merchant_fleet_desc: "Establish a strong and expansive merchant fleet to boost our trade capabilities. This will enhance our economic strength by increasing the flow of goods and resources between Shurima and other regions."

# TODO: Write Definition + Maybe BOP: Guild vs Workers
SHU_work_unions: "Work Unions"
SHU_work_unions_desc: "Organize the labor force around the work of restoration. The unions will strengthen factory output, ease civilian demands on industry and support a steadier recovery of stability."

#TODO: We must give the Marai People a reason to help us! + Idea
SHU_marai_dockyards: "Seize the Marai Coast"
SHU_marai_dockyards_desc: "Bring the Marai lands directly under imperial control and turn their annexation toward our naval ambitions. Where we own and control a coastal site, establish new dockyard capacity and draw on the experience gained for Shurima's maritime service."

#TODO: The Marai People are willing to help us, however their skillset needs to be
SHU_marai_dockyards_company: "Marai Shipbuilding Company"
SHU_marai_dockyards_company_desc: "With the Moonstone secured and an alliance with Nazumah established, we can develop the Marai shipbuilding partnership. Where we hold a coastal state, new dockyards will strengthen our naval industry."

SHU_military_complex: "Military Complex"
SHU_military_complex_desc: "Develop a state-of-the-art military complex to bolster our defense capabilities. This will enhance our military production, improve training facilities, and ensure our armed forces are well-equipped and prepared for any conflict."


SHU_example_ba_aurma: "Naval Cooperation"
SHU_example_ba_aurma_desc: "Put the lessons of our approach to Aurma before the imperial maritime service. Develop naval experience and strengthen the authority needed to pursue cooperation."

SHU_example_ca_aurma: "A Southern Maritime Pact"
SHU_example_ca_aurma_desc: "Rally our maritime service behind the pact we seek in the southern seas. Strengthen naval experience and public resolve before attempting to secure that relationship."

SHU_example_bb_aurma: "Affirm the Aurman Arrangement"
SHU_example_bb_aurma_desc: "Strengthen confidence in the political arrangement we seek for Aurma. Gather authority behind our intended autonomy policy without presuming that this proclamation alone changes its status."

SHU_example_cb_aurma: "Reinforce the Maritime Service"
SHU_example_cb_aurma_desc: "Bring fresh recruits into Shurima's available manpower and develop the experience of its maritime service. Our ambitions at sea need people and judgment before they can be sustained."

SHU_example_bc_aurma: "Support Coastal Shipbuilding"
SHU_example_bc_aurma_desc: "Give our maritime policy a stronger industrial foundation. Where we own and control a coastal site, establish another dockyard and strengthen the authority supporting the work."

SHU_example_cc_aurma: "Autonomous Fleet Command"
SHU_example_cc_aurma_desc: "Develop the experience of our maritime service and rally support for its course. The arrangement sought for Aurma must be supported by sound naval judgment, rather than assumed changes to its officers or command."

# SHU_shuriman_ship_builders: "Shuriman Ship Builders"
# SHU_shuriman_ship_builders_desc: "Utilize the shipbuilding expertise of Aurma. This will enhance our naval capabilities and strengthen our maritime presence."

SHU_example_bd_aurma: "Imperial Naval Contracts"
SHU_example_bd_aurma_desc: "Strengthen the government's authority behind its naval contracting ambitions. Rally confidence in the policy intended to bring Aurma's shipbuilding into Shurima's plans."

SHU_example_cd_aurma: "Rally the Imperial Maritime Service"
SHU_example_cd_aurma_desc: "Develop the experience and resolve of our maritime service for the next stage of imperial policy. This greater commitment will strain stability at home, rather than automatically placing Aurma's ships under our command."

SHU_overseer_taliyah: "Seek Taliyah's Counsel"
SHU_overseer_taliyah_desc: "Shurima should seek Taliyah's counsel as it considers the future of the Crystal Scar. A policy mindful of those who live upon the land can strengthen confidence in the crown."

SHU_taliyahs_supervision: "Lessons of the Stoneweaver"
SHU_taliyahs_supervision_desc: "Taliyah's command of stone offers an example for those studying the earth beneath Shurima. We will support excavation research and seek a steadier approach to developing the region."

SHU_our_crystal_scar: "Our Crystal Scar"
SHU_our_crystal_scar_desc: "Put the ambitions of our Crystal Scar policy behind a new effort to develop tungsten resources in lands we own and control. Strengthen the government's mandate for this program without mistaking a proclamation for territorial possession."

SHU_develop_crystal_scar: "Develop Crystal Scar"
SHU_develop_crystal_scar_desc: "Support the development program through new civilian production in our own controlled lands. Establish a workshop and strengthen the authority needed to carry our chosen policy forward."

SHU_approach_piltover: "Approach Piltover"
SHU_approach_piltover_desc: "Shurima will carry its political influence into Piltover. Our envoys will promote the principles of our government as we prepare for further dealings with the city."

SHU_annex_piltover: "Demand Piltover's Annexation"
SHU_annex_piltover_desc: "We will press Piltover to accept incorporation into the empire. Its government can accept our demand or refuse, leaving Shurima with a cause for an annexation campaign."

SHU_deep_pockets_piltover: "Deep Pockets of Piltover"
SHU_deep_pockets_piltover_desc: "Give the industrial ambitions of our Piltover policy a foundation within Shurima. Establish a civilian workshop in land we own and control, strengthening the government's authority to sustain its projects."

SHU_mutal_assurance: "Mutual Assurance"
SHU_mutal_assurance_desc: "Rally confidence behind the assurances we seek with Piltover. Strengthen the government's mandate for cooperation before attempting to settle that relationship through agreement."

SHU_hostile_takeover: "Hostile Takeover"
SHU_hostile_takeover_desc: "Rally support for a forceful course toward Piltover and prepare our commanders for the struggle it may bring. This determination will strain stability at home; control of foreign industry must still be won."

SHU_brain_gain: "Brain Gain"
SHU_brain_gain_desc: "Support technical study drawing upon the expertise sought through our Piltover policy. Accelerate research into electronic devices and strengthen the authority sustaining that effort."

SHU_new_management_piltover: "Administer the Piltover Policy"
SHU_new_management_piltover_desc: "Give our intended Piltover policy firmer administrative and industrial support within Shurima. Build public confidence and establish a new civilian workshop in land we own and control."

SHU_approach_zaun: "Approach Zaun"
SHU_approach_zaun_desc: "We will make Shurima's political case in Zaun and seek support for our governing principles. This approach will extend our influence before the crown decides its next course."

SHU_silco_plan: "Silco's Plan"
SHU_silco_plan_desc: "Commit imperial backing to the prospect of Silco gaining authority in Zaun. Gather the political mandate for this course before attempting to bring that ambition into effect."

SHU_futher_funding: "Further Funding"
SHU_futher_funding_desc: "Provide our chosen Zaun policy with an arsenal of its own. Establish a new arms workshop in Shurima's owned and controlled lands and strengthen the authority behind the program."

SHU_shadow_plan: "Shadow Plan"
SHU_shadow_plan_desc: "Prepare a covert course toward Zaun before attempting to carry it into effect. Develop military experience and political authority behind the plan, without presuming that its targets are already ours."

SHU_shadow_deal: "Shadow Deal"
SHU_shadow_deal_desc: "Strengthen support for the covert arrangement we seek in Zaun. Build the authority and public confidence needed to sustain our chosen policy without presuming that foreign cooperation has already been secured."

SHU_annex_zaun: "Demand Zaun's Annexation"
SHU_annex_zaun_desc: "Shurima will demand that Zaun come under direct imperial rule. Acceptance would permit incorporation; refusal will provide grounds for an annexation campaign."

SHU_chemical_warefare: "Zaunite Arms Research"
SHU_chemical_warefare_desc: "Direct the technical ambitions of our Zaun policy toward improved infantry weapons. Develop military experience and support for the program while accelerating the research needed to equip the legions."

SHU_new_management_zaun: "Administer the Zaun Policy"
SHU_new_management_zaun_desc: "Support our intended Zaun policy through steadier administration and arms production within Shurima. Build confidence in the government and establish a new arms workshop in land we own and control."

