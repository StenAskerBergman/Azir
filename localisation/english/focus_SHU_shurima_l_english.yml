SHU_farmers_rights: "Farmers Right"
SHU_farmers_rights_desc: ""

SHU_irigation_system: "Irrigation System"
SHU_irigation_system_desc: "Implement a comprehensive irrigation system to revitalize our agricultural lands. This will boost food production and ensure the prosperity of our people."

SHU_diverse_farmland: "Diverse Farmland"
SHU_diverse_farmland_desc: "Support a broader agricultural program with technical study and steadier public confidence. Advance industrial research and strengthen the authority needed to pursue the productive lands we envision."

SHU_shuriman_guilds: "Shuriman Guilds"
SHU_shuriman_guilds_desc: "Bring Shurima's guilds into the work of restoration and convene their first meeting. Set aside new building capacity throughout the core lands firmly under our control, giving their industrial efforts room to grow."

SHU_war_guild: "War Guild"
SHU_war_guild_desc: "The armies of a restored empire need workshops as well as weapons. The War Guild will expand civilian production across our fully controlled heartlands, laying a broader industrial foundation for Shurima."

SHU_craft_guild: "Craft Guild"
SHU_craft_guild_desc: "Organize the craft guild around the building work Shurima's renewal demands. Its methods will accelerate civilian-factory construction, helping turn the restored state's plans into productive workshops."

SHU_rebuilding_our_harbours: "Rebuild Our Harbours"
SHU_rebuilding_our_harbours_desc: "Shurima must recover the craft and discipline needed to work its coasts. Where we own and control a coastal site, establish a new dockyard and lay the foundations of a renewed maritime service."

SHU_stronger_fleet: "Stronger Fleet"
SHU_stronger_fleet_desc: "We must modernize our naval fleet to protect our trade routes and assert our dominance at sea. A stronger navy is essential! We need a stronger navy for the security and prosperity of Shurima."

SHU_shuriman_legions: "Shuriman Legions"
SHU_shuriman_legions_desc: "The legions cannot be sustained by the army alone. Put the economy on a wartime footing, directing the resources of the restored state toward the demands of its defense."

# SHU_arm_the_defenders: "Arm the Defenders"
# SHU_arm_the_defenders_desc: "Provide weapons and equipment to our defenders. This will enhance our defensive capabilities and ensure that Shurima is protected from external threats."

SHU_rebuild_armory2: "Rebuild Armory"
SHU_rebuild_armory2_desc: "Reconstruct our armories to ensure a steady supply of military equipment. This will strengthen our military forces and improve our readiness for conflict."

SHU_refilling_armory: "Expand the Armory"
SHU_refilling_armory_desc: "A rebuilt arsenal must grow with the demands of the legions. Expand arms production at an eligible site in our own controlled lands, laying the industrial foundation for replenishing our stores."

SHU_expand_armory: "Expand Armory"
SHU_expand_armory_desc: "Develop and produce advanced weaponry for our troops. This will enhance their protection and effectiveness we have in combat!"

# SHU_question_of_nazumah: "Question of Nazumah"
# SHU_question_of_nazumah_desc: "Decide the fate of Nazumah and its people. This important decision will determine our relationship with the region and its integration into the empire."

SHU_public_order2: "Public Order"
SHU_public_order2_desc: "Establish public order across Shurima. This will ensure stability and security, allowing our people to live in peace and prosperity."

SHU_imperial_law: "Imperial Law"
SHU_imperial_law_desc: "A renewed Shurima needs laws that can bind its scattered communities to a common authority. Establish a clearer legal order, strengthening public confidence in the institutions that govern our lands."

SHU_plan_frontlines2: "Plan Frontlines"
SHU_plan_frontlines2_desc: "Strategically plan our frontlines to defend against potential threats. This will strengthen our defensive positions and ensure the security of our borders."

SHU_defensive_lines2: "Defensive Lines"
SHU_defensive_lines2_desc: "Establish defensive lines to protect our territory. These fortifications will deter enemy invasions and safeguard our people."

SHU_storm_nerimazeth2: "Storm Nerimazeth"
SHU_storm_nerimazeth2_desc: "Launch an offensive to capture Nerimazeth. This strategic move will expand our territory and weaken our enemies."

SHU_hunters_for_hire: "Enlist Kassadin"
SHU_hunters_for_hire_desc: "Seek Kassadin's service while he remains available beyond our borders. Bring the Void Walker into Shurima's ranks, placing his counsel and experience at the disposal of our struggle."

SHU_shuriman_recognition: "Shuriman Recognition"
SHU_shuriman_recognition_desc: "Extend a formal gesture of recognition between Shurima and Nazumah. Let it stand as a statement of the relationship we seek, without presuming that recognition alone settles their differences."

SHU_minors: "Minor Nations"
SHU_minors_desc: "Address the issues and concerns of the minor nations within our borders. This will ensure their loyalty and integration into the Shuriman Empire."

SHU_major: "Major Nations"
SHU_major_desc: "Engage with the major nations surrounding Shurima. This will strengthen our diplomatic relations and secure our position as a dominant power."

# Tier 2
SHU_rebuild_trade_hubs: "Rebuild Trade Hubs"
SHU_rebuild_trade_hubs_desc: "Revitalize our key trade hubs to restore Shurima's position as a central trading power. By upgrading these vital centers of commerce, we will attract merchants from far and wide, increase economic activity, and secure Shurima's wealth and influence in the region."

# Tier 1
SHU_rebuild_trade_routes: "Rebuild Trade Routes"
SHU_rebuild_trade_routes_desc: "Re-establish our ancient trade routes to bring wealth and exotic goods back to Shurima. Enhancing our trade infrastructure will boost our economy and strengthen ties with neighboring regions, ensuring Shurima's prosperity and dominance in commerce."


#"With the Sun Disc restored and Shurima's influence expanding, we must re-establish our ancient trade routes. These routes once brought wealth, knowledge, and exotic goods to our empire. Enhancing our trade infrastructure will bolster our economy and strengthen ties with neighboring regions, ensuring Shurima's prosperity and dominance in commerce."

#"With the Sun Disc restored and Shurima's influence expanding, it is imperative to re-establish and enhance our ancient trade routes. These routes were once the lifeblood of our empire, bringing wealth, knowledge, and exotic goods from distant lands. By improving our trade infrastructure, we will not only bolster our economy but also strengthen our ties with neighboring regions, ensuring Shurima's prosperity and dominance in commerce. Let us revive the golden paths that once connected the heart of Shurima to the farthest reaches of Runeterra."


SHU_imperial_courts: "Imperial Courts"
SHU_imperial_courts_desc: "A throne cannot restore order by proclamation alone. Reestablish the imperial courts so that disputes can be heard under a common authority and confidence in the crown can take root."

SHU_sun_disc_restorations: "Sun Disc Restorations"
SHU_sun_disc_restorations_desc: "The Sun Disc must stand at the heart of a living capital, not amid neglected ruins. Organize the restoration works and establish a new civilian workshop, giving the crown the means and authority to sustain its renewal."

SHU_our_leader: "Our Leader"
SHU_our_leader_desc: "Shurima must decide who will carry its restored crown. Will Azir continue the work of imperial restoration, or yield the throne to Sivir and the different future she would seek?"

SHU_emperor: "Emperor Azir"
SHU_emperor_desc: "Azir will retain the imperial throne and the burden of restoring Shurima. His authority rests on the promise that the scattered lands can once again stand beneath a common crown."

SHU_empress: "Empress Sivir"
SHU_empress_desc: "Azir will relinquish his imperial role, and Sivir will take the throne. The mercenary captain must now turn her resolve toward governing Shurima, seeking the steadier rule envisioned for her crown."
SHU_empress_effect: "§BSivir Becomes our new Ruler!§!"

SHU_imperial_law2: "Imperial Law"
SHU_imperial_law2_desc: "Without Imperial Law, Shurima cannot be governed effectively!"


SHU_question_of_slavery2: "Question of Slavery"
SHU_question_of_slavery2_desc: "Address the issue of slavery within Shurima. This crucial decision will shape the future of our society and define our moral standing."

SHU_question_of_slavery: "Question of Slavery"
SHU_question_of_slavery_desc: "The restoration has reopened the question of bondage and the obligations owed to Shurima's people. Bring the dispute before our institutions: the authority we claim will be judged by the laws we choose to uphold."

SHU_plan_frontlines: "Plan Frontlines"
SHU_plan_frontlines_desc: "The restored legions need a plan before they march against the empire's enemies. Study the approaches to Xerath's strongholds and prepare our commanders for the campaigns ahead."

SHU_defensive_lines: "Defensive Lines"
SHU_defensive_lines_desc: "The legions must learn to hold what Shurima has restored. Strengthen their defensive formations so that the empire's enemies face a steadier shieldwall."

SHU_storm_nerimazeth: "Storm Nerimazeth"
SHU_storm_nerimazeth_desc: "Prepare to carry the struggle against Xerath to Nerimazeth. Establish our claim to war and rally the legions for an offensive, leaving the hour of the march to our command."

SHU_rebuild_armory: "Rebuild Armory"
SHU_rebuild_armory_desc: "The restored legions need an arsenal capable of sustaining their service. Where an owned province under our control has room for arms works, establish new production halls and rebuild Shurima's capacity to equip its defenders."

SHU_aircraft_industry: "Aircraft Industry"
SHU_aircraft_industry_desc: "We must build up our airfleet to ensure air supremacy against all the dragons and aircrafts that pose a threat to our empire"

SHU_shuriman_armor: "Shuriman Armor"
SHU_shuriman_armor_desc: "Our Soldiers is our last line of defense! But if we want our last line to become our first line, then something has to change!"

SHU_shurima_bow_deep: "SHURIMA KNEEL!"
SHU_shurima_bow_deep_desc: "Once More We stand at the gates of History! No Longer shall we take the filth left over by others! BOW FOR DAUGHTERS OF SHURIMA, KNEEL MY SONS OF THE SUN TODAY I RISE!"

SHU_shurima_stand_tall: "STAND TALL SHURIMA!"
SHU_shurima_stand_tall_desc: "Once More We stand at the gates of History! No Longer shall we take the filth left over by others! STAND TALL DAUGHTERS OF SHURIMA, STAND STRONG SONS OF THE SUN TODAY WE RISE!"

SHU_shrines_of_shurima: "Shrines of Shurima"
SHU_shrines_of_shurima_desc: "Restoring the shrines will give our people places to honor the Ascended and renew the traditions of the old realm. Their restoration can strengthen public confidence in Shurima's future."

SHU_sun_service: "Sun Service"
SHU_sun_service_desc: "The Sun doesn't need slaves to shine! My Brothers, and Sisters... WE RISE ANEW!"

SHU_child_enslavement_bill: "Child Enslavement Bill"
SHU_child_enslavement_bill_desc: "What role does Children in Shurima play in slavery?"

SHU_open_crystal_mines: "Open Chromium Workings"
SHU_open_crystal_mines_desc: "Carry the prospecting program into the next stage of mineral development. Open chromium resources at the designated sites wherever Shurima or its subjects maintain control."

SHU_start_the_mines: "Develop the Resource Sites"
SHU_start_the_mines_desc: "Bring the designated resource sites into productive service wherever Shurima or its subjects hold control. Expand their capacity for building and develop rubber supplies for the restored state's industries."

SHU_expand_the_mines: "Expand Mines"
SHU_expand_the_mines_desc: "Our commitment to harness the boundless power hidden beneath the earth only grows. As we delve deeper into the heart of our land, we unlock the secrets of hexcraft. By expanding the Mines, we unearth not only the life-giving energy of the crystals but also the hope for a brighter future. With each excavation, we empower our magicians with hex, fuel our inventions with minerals, and strengthen our defense against the coming darkness." #OLD: and strengthen our defense against the encroaching darkness."

# OLD
SHU_nationalize_the_mines: "Nationalize The Mines!"
SHU_nationalize_the_mines_desc: "For too long, our people have suffered, our wealth plundered, and our spirits broken. The elite of Piltover have exploited our labor, monopolized our precious Hex Crystals, and left our lands in despair. It's time to reclaim what is rightfully ours!"

# NEW
SHU_nationalize_hexore: "Nationalize Our Hexore"
SHU_nationalize_hexore_desc: "Shurima will assert a national claim over its hexore industry. This policy will guide our dealings over the Crystal Scar and our wider plans for economic recovery."

SHU_gold_refinement: "Gold Refinement"
SHU_gold_refinement_desc: "The value of our mines depends on methods that recover more from the earth. Support excavation research and strengthen the authority behind a more disciplined refinement program."


#OLD "Mineral Deposits" "Deep Mineral Veins" "Deep Minerals" "Deep Mineral Mining" "Deep Mineral Mines" "Digging Deeper" "Deep Dig" "Dig Deeper!" "Deep Mineral Ore"
SHU_open_metal_mines: "Deep Mineral Ore"
SHU_open_metal_mines_desc: "With Taliyah available to our government, pursue the deeper metal deposits envisioned for the resource program. Develop steel supplies at the designated sites under Shuriman or subject control."

# Extra S
SHU_gold_reserves: "Gold Reserves"
SHU_gold_reserves_desc: "The this much Gold about to enter into circulation, will tank its price, its better if we build up our own gold stockpile instead, and use it to bargin with when needed, that way we also have secure funding for whatever we desire."

# Default
SHU_gold_reserve: "Gold Reserve"
SHU_gold_reserve_desc: "Organize the reserves envisioned for Shurima's renewal with greater discipline. This policy will ease the burden of civilian consumption on our industry, leaving more capacity for the state's wider ambitions."

# "Gold Trade" "Golden Trade" "Golden Monopoly" "Gold Market"
# "Gold Index" "Gold Value" "Gold Price" "Golden Profits"
# "Price Index"  "Stock exchange" "Gold Exchange"

SHU_gold_trade: "Price Index"
SHU_gold_trade_desc: "Bring greater order to the trade policy pursued by our guilds. Reduce the industrial burden of civilian consumption so that Shurima can devote more of its capacity to renewal."

SHU_safermines: "Develop the Oil Deposits"
SHU_safermines_desc: "With Taliyah among our people, we can pursue the next stage of resource development. New oil deposits will expand the supplies available in territory we own and control."
# "With Taliyah's on our side we can afford to dig deeper!"

SHU_shuriman_university: "Shuriman University"
SHU_shuriman_university_desc: "Gather Shurima's scholars into a university devoted to the restored state's future. Expand our capacity for research and improve the pace at which new knowledge can be put to work."

SHU_library_of_shurima: "Library of Shurima"
SHU_library_of_shurima_desc: "Library of Shurima lead us to greatness! but also to our doom, this tells us that we need to re-approach our stand on 'forbidden knowledge' \n We must  reconsider and re-think for us to not repeat the mistake of the past!"

SHU_rebuild_library: "Rebuild Shuriman Library"
SHU_rebuild_library_desc: "Gather the scattered works of learning into a rebuilt Shuriman library. Expand our capacity for research and improve its pace, giving the work of renewal a stronger scholarly foundation."
SHU_rebuild_library_tooltip: "Its time we Rebuild Shurima's library & minds from the ground up! Let's learn from the mistakes of our past and grow!"

SHU_Restoring_Shuriman_Economy: "Restoring Shuriman Economy"
SHU_Restoring_Shuriman_Economy_desc: "Our mines, refiners, and hexore policy must serve a common plan for recovery. A steadier economy will strengthen confidence in the crown and give us grounds to move beyond the burdens of decline."
SHU_Restoring_Shuriman_Economy_TT: "Completing this focus satisfies a removal condition for the Shuriman decline economy laws; it does not change the current law automatically."

SHU_general_academy: "OLD"
SHU_officer_academy: "OLD"


SHU_officer_school: "Officer School"
SHU_officer_school_desc: "Give the legions an institution devoted to disciplined study and military preparation. Expand research capacity while improving army intelligence, doctrine study and the effectiveness of our forces in the field."

SHU_war_academy: "War Academy"
SHU_war_academy_desc: "Establish an academy devoted to the study of war and the preparation of the legions. Expand research capacity and improve army intelligence, doctrine study and field effectiveness through disciplined instruction."

SHU_restore_great_library: "Restore Shuriman Library"
SHU_restore_great_library_desc: "Extend the scholarly foundation established by our chosen school or library. Expand research capacity and, while Nasus remains available, prepare the separate restoration work that can further improve the pace of study."

SHU_library_of_nasus: "Library of Nasus"
SHU_library_of_nasus_desc: "With Nasus serving as an adviser, give the knowledge gathered under his guidance a lasting home. Expand Shurima's research capacity so that study can accompany the restored state's ambitions."

SHU_school_of_nasus: "School of Nasus"
SHU_school_of_nasus_desc: "With Nasus serving as an adviser, establish a school under his guidance. Give Shurima greater capacity for research so that learning can sustain the work of restoration."

SHU_land_prospect: "Land Prospect"
SHU_land_prospect_desc: "A sustained prospecting program needs scholars and methods equal to the task. Expand our research capacity and accelerate the study of excavation, building the knowledge needed to develop what lies beneath our lands."

SHU_open_gold_mines: "Build the Extraction Workshops"
SHU_open_gold_mines_desc: "Support the resource program with a new civilian workshop in land we own and control. Strengthen the authority behind this industrial effort so that our ambitions can be sustained by productive work."

SHU_shurima_arise: "Shurima Arise!"
SHU_shurima_arise_desc: "Finally The Internal Battle has been resolved! As One WE RISE AGAIN!"

SHU_national_defense_state: "Shurima Stand!"
SHU_national_defense_state_desc: "The Internal Battle has been resolved! As One, WE STAND FOR SHURIMA!"

SHU_shurimastand: "Shurima Stand!"
SHU_shurimastand_desc: "The Internal Battle has been resolved! As One, WE STAND FOR SHURIMA!"

SHU_slave_rights_act: "Slave Rights Act"
SHU_slave_rights_act_desc: "The Bare Rights afforded to Slaves"

SHU_slaver_rights_act: "Slaver Rights Act"
SHU_slaver_rights_act_desc: "The Right of Slavers"

SHU_public_order: "Public Order"
SHU_public_order_desc: "Restoration must bring security to the streets as well as splendor to the throne. Coordinate the authorities charged with keeping order, giving our people firmer grounds to trust the government."

SHU_imperial_order: "Imperial Order"
SHU_imperial_order_desc: "The Imperial Law is back! Finally, we have the power to bring justice to the lawless Raiders for their rampant abuse, both past and present.\nTechnically, the Shuriman Courts never officially 'closed.' Any laws broken during the long slumber still count as offenses, giving us the legal leverage to hold foreign colonialist, trader scalpers, and local raiders alike accountable for their actions.\nIt's time people realize that their actions can have dire consequences!"

SHU_ascended_council: "Ascended Council"
SHU_ascended_council_desc: "Our Royalty requires a royal court for their disputes and family issues away from the public, important issues must have a fast lane in both dire and good times for the Emperor to bring justice for all whom deserve it!\nIt was using these courts that Azir was able to gain the power over the priesthood to perform forbidden sacred ascension ritual to begin with."

SHU_republican_future: "Republican Future"
SHU_republican_future_desc: "Sivir's crown can look toward a future shaped by broader public confidence. Strengthen stability around that ambition before attempting the political changes it may demand."

#old: "Imperial Dream"
#new: "Imperial State"
SHU_imperial_state: "Imperial State"
SHU_imperial_state_desc: "Azir's restoration needs an imperial administration capable of turning his commands into a common purpose. Rallying officials and subjects behind the throne will strengthen the authority and resolve of the state."

SHU_royal_high_courts: "Royal High Courts"
SHU_royal_high_courts_desc: "Our Royalty requires a royal court for their disputes and family issues away from the public, important issues must have a fast lane in both dire and good times for the Emperor to bring justice for all whom deserve it! \nIt was using these courts that Azir was able to gain the power over the priesthood to perform forbidden sacred ascension ritual to begin with."

SHU_return_of_the_amulet: "Return of the Amulet"
SHU_return_of_the_amulet_desc: "The return of the amulet will become a symbol of Shurima's renewal. Its place in the restoration will strengthen the crown's authority and rally support for the realm."

# SHU_shuriman_guilds: "Royal Shuriman Guilds"
# SHU_shuriman_guilds_desc: "Shuriman Guilds desc"

# SHU_war_guild: "Royal War Guild"
# SHU_war_guild_desc: "Shuriman War Guilds desc"

SHU_economic_revival: "Economic Revival"
SHU_economic_revival_desc: "Shurima needs room to build a future worthy of its inheritance. Set aside new sites for workshops and industry throughout the core lands firmly under our control."

SHU_rebirth_legions: "Rebirth of the Legions"
SHU_rebirth_legions_desc: "Shurima must gather its scattered strength into an army worthy of the restored realm. New recruits will swell our ranks, while reorganizing the Shuriman Infantry will give commanders greater freedom to shape the legions."

SHU_military_expansion_b: "Military Expansion"
SHU_military_expansion_b_desc: "In a world growing ever more dangerous, it is imperative that we expand our military capabilities. This focus will increase our armed forces, modernize our equipment, and ensure our nation is ready for any threat."

SHU_rebuilding_our_fleet: "Rebuilding Our Fleet"
SHU_rebuilding_our_fleet_desc: "A fleet must be rebuilt through skilled crews and the yards that sustain them. Expand shipbuilding at an owned coastal site under our control and develop the naval experience needed for the work ahead."

SHU_workers_rights: "Worker Rights"
SHU_workers_rights_desc: "Recognize the rights of the workers whose labor sustains Shurima's renewal. Greater stability will come with reduced factory and dockyard output and a larger commitment of industry to civilian needs."

SHU_trade_guild: "Royal Trade Guild"
SHU_trade_guild_desc: "Give the royal trade guild the authority and public confidence needed to support Shurima's renewal. Establish a civilian workshop in our own controlled lands, turning its commercial ambitions toward a stronger industrial foundation."

SHU_replant_the_basin: "Replant The Basin!"
SHU_replant_the_basin_desc: "The ambitions of renewal need practical work around the capital. Establish a civilian workshop and strengthen public confidence in the program intended to restore life to the basin."

SHU_we_remember_shurima: "We Remember Shurima"
SHU_we_remember_shurima_desc: "The memory of Shurima survives in the traditions its people carried through the long years of ruin. We will make that inheritance part of the restored realm's purpose, while seeking a place for communities whose loyalties cannot simply be commanded."

SHU_sundisc_has_risen: "The Sun Disc Has Risen"
SHU_sundisc_has_risen_desc: "The Sun Disc stands above Shurima once more, and its return must be proclaimed beyond our borders. As we face Xerath, this announcement will rally the authority of the restored realm."

SHU_military_court: "Military Court"
SHU_military_court_desc: "Give military discipline a firmer place in the restored state's institutions. Draw on the experience of the legions and strengthen confidence in the authority charged with judging their conduct."

SHU_military_law: "Imperial Intelligence Service"
SHU_military_law_desc: "The restored state needs an organized service to gather intelligence. Where the means to establish an agency are available and none already exists, create the S.S.S. to support imperial policy."

SHU_tribal_unity: "Tribal Unity"
SHU_tribal_unity_desc: "Its time high time, we finally unite our tribes against our common enemies!"

SHU_tribal_recognition: "Legal Recognition"
SHU_tribal_recognition_desc: "Affirm the tribes' place within Shurima's intended legal order. Let this recognition express the relationship we seek between their traditions and the restored state."

SHU_tribal_respect: "Tribal Respect"
SHU_tribe_respect_desc: "It's time we pull some favours for our tribes inorder to secure their faith in our empire and their place in it."

SHU_tribe_council: "Tribe Council"
SHU_tribe_council_desc: "Sivir's crown will give the tribes a place in the institutions envisioned for the renewed empire. Convene their council as a statement that imperial restoration should hear the communities it seeks to govern."

SHU_tribe_law: "Tribe Law"
SHU_tribe_law_desc: "Give the traditions of Shurima's tribes a formal place in the order we seek to restore. Let recognition of their customary law express the intended relationship between local communities and the imperial institutions."

SHU_arm_the_defenders: "Arm the Defenders!"
SHU_arm_the_defenders_desc: "The defenders of Shurima need weapons in their hands, not promises alone. Supply our stockpiles with infantry arms so the forces already under our command can be equipped for the struggle."
SHU_nazumah_investments: "Nazumah Investments"
SHU_nazumah_investments_desc: "Focusing on investments in Nazumah to boost local infrastructure and economic growth."

SHU_nazumah_self_govern: "Self-Management"
SHU_nazumah_self_govern_desc: "Lets 'Let' the Nazumahs controll their own affairs it will improving their internal affairs and resource management, and we won't waste our time on it."

SHU_restore_solari: "Recognize Solari Rule"
SHU_restore_solari_desc: "Declare Shurima's support for the Solari cause upon Targon. This gesture of recognition expresses the place we seek for the sun's faithful, without settling who rules the mountain."

SHU_restore_lunari: "Secure Lunari Future"
SHU_restore_lunaris_desc: "It's high time we secure the lunari people's future in targon, to aid us in the coming storm!"

SHU_moonstone: "Restore the Moonstone Accord"
SHU_moonstone_desc: "Nami seeks to restore the broken accord that safeguards her people. We can petition Diana when Targon is able to receive us, or pursue scattered Lunari knowledge through a separate search; cooperation cannot be assumed."

big_sun: "Big Sun"

SHU_annex_nazumah: "Demand Nazumah's Annexation"
SHU_annex_nazumah_desc: "The crown will demand that Nazumah accept direct imperial rule. Its people may submit or refuse; rejection will give Shurima grounds to seek annexation by force."

SHU_puppet_nazumah: "Demand Nazumah's Submission"
SHU_puppet_nazumah_desc: "We will demand that Nazumah accept Shuriman overlordship while retaining a separate government. Its response would determine whether submission proceeds by agreement or leaves us considering coercion."
SHU_puppet_nazumah_tt: "Sends Nazumah a demand for submission, which it may accept or refuse."

SHU_nazumahs_pride: "Respect Nazumah's Pride"
SHU_nazumahs_pride_desc: "Nazumah's pride cannot be erased by a proclamation from the capital. Acknowledge it within our dealings and affirm the place we seek for mutual recognition rather than another campaign of coercion."
SHU_nazumahs_pride_tt: "§OPuppets Nazumah, into our Vassel state!§!"

SHU_imperial_efforts: "Imperial Efforts"
SHU_imperial_efforts_desc: "The counsel of the Ascended must be matched by resolve throughout the empire. Rallying the administration behind our military ambitions will strengthen the crown and public support for its campaigns."

SHU_marai_marines: "Marai Marines"
SHU_marai_marines_desc: "Marai knowledge of the sea can help our forces prepare for amphibious operations. We will draw upon that experience to strengthen our invasion planning and coastal fighting, though a failure of the Moonstone quest may end this support."

SHU_question_of_nazumah: "The Nazumah Question"
SHU_question_of_nazumah_desc: "Nazumah guards its independence while Shurima seeks a renewed place among the desert's peoples. Debate the relationship we should pursue before choosing between imperial control and cooperation."

# "God Warrior Council"
SHU_ascended_god_warriors_council: "Ascended Council"
SHU_ascended_god_warriors_council_desc: "Azir will seek the counsel of the Ascended as the empire prepares to defend its restoration. Their martial legacy can guide our commanders and give the realm a common purpose without settling every rivalry of the old order."

SHU_nazumah_alliance: "Invite Nazumah to Our Alliance"
SHU_nazumah_alliance_desc: "We will offer Nazumah a place alongside Shurima in our faction. A shared alliance must rest on its agreement, rather than an imperial command."

