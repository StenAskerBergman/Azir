l_english:
 Void_Army: "The Voidborn Host"
 Void_Army_desc: "Icathia's surviving formations have been remade around Voidborn shock troops whose hunger is directed toward the enemy."
 Rift_Rapture: "Rift Rapture"
 Rift_Rapture_desc: "The reopened pathways beneath Icathia let the host surge forward before mortal armies can react."
 Rift_Open: "The Rift Stands Open"
 Rift_Open_desc: "A stable breach feeds soldiers and unnatural sustenance into the Void's campaign."
 TAR_tolerance_policy_desc: "Leona has permitted Lunari worship to survive under strict guarantees, easing the mountain's oldest division."
 purist_policy_desc: "The Solari hierarchy has declared Lunari practice a threat to Targon's sacred order."
 TAR_zealous_crusader: "Zealous Crusaders"
 TAR_zealous_crusader_desc: "The most fervent Solari have been mobilized to purge what they consider lunar heresy."
 TAR_solari_supreme_commander: "Solari Supreme Command"
 TAR_solari_supreme_commander_desc: "The army has been placed under officers whose loyalty to the Solari is beyond question."
 TAR_reformer_ally: "Ally of the Reformers"
 TAR_reformer_ally_desc: "The state now lends its weight to those seeking reconciliation between sun and moon."
 TAR_solari_compromise: "Promise to the Solari"
 TAR_solari_compromise_desc: "Reform will proceed without stripping the Solari of their traditional place on Mount Targon."
 TAR_lunari_compromise: "Promise to the Lunari"
 TAR_lunari_compromise_desc: "The Lunari have received guarantees that their faith and communities will be protected."
 TAR_lunari_reformation: "Lunari Reformation"
 TAR_lunari_reformation_desc: "Diana seeks a Targon in which the Lunari can return without repeating the Solari's persecution."
 TAR_lunari_rejection: "Lunari Rejection"
 TAR_lunari_rejection_desc: "Diana's followers reject Solari authority and prepare to secure the moon's faith by force."
 TAR_peaceful_path: "A Peaceful Path"
 TAR_peaceful_path_desc: "The mountain's rulers will attempt to end the cycle of persecution through compromise."
 TAR_reformers: "Ascendant Reformers"
 TAR_reformers_desc: "Religious and civic reformers have gained the confidence to reshape Targon's order."
 TAR_challange: "The Reformers' Challenge"
 TAR_challange_desc: "Open resistance to reform has turned the mountain's political struggle into a test of state authority."
