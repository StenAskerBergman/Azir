l_english:
 TAR_our_leader: "The Summit Decides"
 TAR_our_leader_desc: "Targon's next course demands a leader prepared to carry it. Choose among the figures available to us, as the mountain's rival visions compete for authority."
 TAR_victory_speech: "Rebuild Targon"
 TAR_victory_speech_desc: "The mountain's settlements need a government they can turn to again. Lay the foundations for rebuilding and decide whose hands will shape the new order."
 TAR_rakkor_settlement: "Entrust the Mountain to the Tribes"
 TAR_rakkor_settlement_desc: "The Rakkor kept the high valleys alive through winters and wars. Give the tribal councils charge of rebuilding the settlements and working the mountain's resources."
 TAR_lunari_settlement: "Let the Moon Govern"
 TAR_lunari_settlement_desc: "The faith that survived in hiding can now govern openly. Put Lunari councils in charge of Targon's future. Their return gives the government new authority, though those who once ruled will resist its influence."
 TAR_blessing_of_the_mountain: "Rakkor Stewardship"
 TAR_blessing_of_the_mountain_desc: "Rakkor councils put their knowledge of the high valleys to work, building for the settlements and drawing more from the resources of the mountain."
 TAR_lunar_dominion: "Lunari Authority"
 TAR_lunar_dominion_desc: "The Lunari turn the ties that sustained their faith underground into a governing order. Their leadership gains political power faster, but rival ideologies find more room to take hold."
 TAR_solar_ascendancy: "Solari Ascendancy"
 TAR_solar_ascendancy_desc: "The priesthood calls on the faithful to defend its new order. More answer the call to serve, and the Solari gain greater political authority."
 TAR_purity: "The Unclouded Sun"
 TAR_purity_desc: "One faith, one purpose beneath the sun: the Solari priesthood calls for an end to compromise. Its supremacy will harden our armies and rally the faithful, though division at home will deepen."
