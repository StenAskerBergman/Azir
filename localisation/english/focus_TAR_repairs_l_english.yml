l_english:
 TAR_our_leader: "The Summit Decides"
 TAR_our_leader_desc: "The struggle between Solari authority and Lunari survival has reached the summit. Targon must decide whose vision will guide the mountain."
 TAR_victory_speech: "A Voice Across the Mountain"
 TAR_victory_speech_desc: "The victor will address every Rakkor settlement, temple, and hidden refuge, promising that the celestial conflict has entered a new age."
 TAR_purity: "The Unclouded Sun"
 TAR_purity_desc: "Solari hardliners demand one faith beneath the sun and no refuge for Lunari practice. Their campaign will strengthen the militant priesthood at a grave cost to reconciliation."
