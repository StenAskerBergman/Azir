l_english:
 TAR_our_leader: "The Summit Decides"
 TAR_our_leader_desc: "Targon's next course demands a leader prepared to carry it. Choose among the figures available to us, as the mountain's rival visions compete for authority."
 TAR_victory_speech: "A Voice Across the Mountain"
 TAR_victory_speech_desc: "The reformers' achievement should give our people confidence in what comes next. Speak for a common future and strengthen the authority needed to carry the changes forward."
 TAR_purity: "The Unclouded Sun"
 TAR_purity_desc: "One faith, one purpose beneath the sun: the Solari priesthood calls for an end to compromise. Its supremacy will harden our armies and rally the faithful, though division at home will deepen."
