l_english:
 ascendant_supremacy: "Ascendant Supremacy"
 ascendant_supremacy_desc: "The restored Sun Disc has renewed the covenant between Shurima and its Ascended protectors, lending imperial authority an almost divine weight."
 SHU_infrastructure_bonus_desc: "Surveyors and guild crews reconnect the desert roads, oases, and caravan stations that once bound the Shuriman Empire together."
 SHU_cultural_renaissance_desc: "Scholars, artisans, and chroniclers recover the memory of ancient Shurima without denying the peoples who endured after its fall."
 SHU_military_glory_desc: "The empire tempers the legend of its Ascended hosts with disciplined officers, trained formations, and a modern chain of command."
 TAR_rakkor_tenacity: "Rakkor Tenacity"
 TAR_rakkor_tenacity_desc: "The warriors of the Rakkor draw strength from Mount Targon's merciless paths and their long tradition of meeting impossible trials head-on."
 TAR_celestial_pilgrimage: "Celestial Pilgrimage"
 TAR_celestial_pilgrimage_desc: "Pilgrims climbing toward the summit renew Targon's spiritual authority and carry tales of the mountain's celestial power back to every settlement."
 TAR_summit_harvest_idea: "Harvests of the High Valleys"
 TAR_summit_harvest_idea_desc: "Terraced fields and carefully guarded mountain pastures give Targon's scattered communities a more dependable food supply."
 icathia.5.t: "Resistance in the Ruins"
 icathia.5.d: "Armed cells have emerged among Icathia's shattered streets. They know every buried passage and intend to deny the invader an uncontested hold over the ruins."
 icathia.5.a: "Icathia still remembers."
 shuriman_rnews.6.a: "The desert has chosen its future."
