l_english: 
AUR_national_identity: "National Identity"
AUR_national_identity_desc: "Our island's future cannot be decided in foreign counting houses. Give Aurma's maritime traditions a place in public life and declare the principles by which we intend to steer."

AUR_maritime_heritage: "Maritime Heritage"
AUR_maritime_heritage_desc: "The harbor is our school, and every voyage adds to its lessons. Honor the skills of our seafarers and the customs that keep trade moving between distant shores."

AUR_maritime_mastery: "Maritime Mastery"
AUR_maritime_mastery_desc: "Knowing a route is only the beginning; a fleet must be ready to sail it together. Refine our navigation and shipboard routines so that Aurman vessels move swiftly and hold their formation."

AUR_aurman_sailors: "Aurman Sailors"
AUR_aurman_sailors_desc: "Our sailors know how to endure a hard voyage and how to catch a laden vessel. Pass those skills to the next generation of crews, making every expedition better prepared for the sea's hazards."

AUR_noxian_trade: "Noxian Trade"
AUR_noxian_trade_desc: "Noxian markets offer opportunities that our merchants cannot afford to ignore. Cultivate those commercial ties and put their proceeds to work at home."

AUR_family_ties: "Family Ties"
AUR_family_ties_desc: "Kinship can give a merchant a hearing where a stranger would find a closed door. Draw on the ties that connect our trading families abroad to strengthen confidence in Aurma's leadership."

AUR_our_sea: "Our Sea"
AUR_our_sea_desc: "These waters carry our livelihoods, and our captains refuse to leave their future to others. Rally Aurma behind a firmer presence at sea, backed by the experience of those who sail it."

AUR_piltover_trade: "Piltover Trade"
AUR_piltover_trade_desc: "Piltover's workshops and Aurma's merchants have much to offer one another. Strengthen these trading connections so that their prosperity supports our own production and influence."

AUR_clan_medarda: "Clan Medarda"
AUR_clan_medarda_desc: "A trusted contact in Clan Medarda is worth more than a harbor full of rumors. Cultivate these commercial connections to give our merchants a stronger footing and our people greater confidence in trade."

AUR_blood_is_thicker_than_water: "Blood Is Thicker than Water"
AUR_blood_is_thicker_than_water_desc: "When distant markets turn uncertain, familiar names can still open doors. Favor our established family connections in commerce and let those ties strengthen the government's hand."

AUR_boats_run_on_water_not_blood: "Boats Run on Water, Not Blood"
AUR_boats_run_on_water_not_blood_desc: "A sound bargain should stand on its own merits. Give reliable commercial partners their due, placing confidence in the agreements that keep Aurma's trade moving."

AUR_waves_of_resilience: "Waves of Resilience"
AUR_waves_of_resilience_desc: "Storms have never kept Aurma's sailors ashore for long. Rally experienced crews and fresh recruits so that losses at sea do not break our resolve."

AUR_sea_of_profit: "Sea of Profit"
AUR_sea_of_profit_desc: "A merchant's fortune should build more than a splendid household. Invest the wealth of our sea trade in workshops at home, giving Aurma a firmer foundation for prosperity."

AUR_fisheries: "Fisheries"
AUR_fisheries_desc: "Our fishing fleets feed households as well as markets. Support their work and, where we control a coastal harbor, expand the yards that build and maintain their vessels."

AUR_pirate_question: "Pirate Question"
AUR_pirate_question_desc: "Raiders threaten the routes on which our merchants depend. Gather the captains' experience and prepare a policy that gives Aurma a stronger hand in dealing with them."

AUR_shuriman_threat: "Shuriman Threat"
AUR_shuriman_threat_desc: "An ambitious power on the mainland could put our island's freedom of action at risk. Prepare our captains and rally support for defending Aurma's interests against pressure from Shurima."

AUR_shifting_currents: "Shifting Currents"
AUR_shifting_currents_desc: "The fortunes of an island can change with the next ship into port. Gather our leaders and captains to chart a course through the changes ahead."

AUR_uncertain_waters: "Uncertain Waters"
AUR_uncertain_waters_desc: "Merchants cannot plan their voyages while every rumor changes the government's course. Set out a steadier policy and give Aurma's people confidence in the hands at the helm."

AUR_aurman_pirates: "Aurman Pirates"
AUR_aurman_pirates_desc: "Our captains know the raiders' craft as well as any outlaw. Put that experience in Aurma's service, even if respectable merchants recoil at the company we keep."

AUR_calm_sea: "Calm Sea"
AUR_calm_sea_desc: "A steady crew does not mistake a quiet horizon for safety. Use this respite to strengthen our seamanship and restore confidence along the waterfront."

AUR_lurking_threats: "Lurking Threats"
AUR_lurking_threats_desc: "Not every danger arrives with a flag we recognize. Prepare our sailors for trouble beyond the harbor and persuade our people that vigilance is worth the effort."

AUR_aurman_privateer: "Aurman Privateer"
AUR_aurman_privateer_desc: "A captain with a commission answers to more than the promise of plunder. Bring private enterprise into the service of Aurma's maritime ambitions and give our leaders a stronger hand at sea."

AUR_aurman_navy: "Aurman Navy"
AUR_aurman_navy_desc: "Trade routes need more than brave captains acting alone. Organize our fleet to keep its formation and give its larger vessels dependable protection."

AUR_naval_linage: "Naval Lineage"
AUR_naval_linage_desc: "Each generation of captains inherits lessons paid for by the last. Turn that experience into a stronger naval doctrine and a sharper fighting edge for our largest ships."

AUR_coastal_raid_parties: "Coastal Raid Parties"
AUR_coastal_raid_parties_desc: "A crew must know how to fight beyond its own deck. Train our raiding parties and sailors together, sharing the hard lessons of shipboard combat and coastal operations."

AUR_overclass_society: "Overclass Society"
AUR_overclass_society_desc: "Piltover's prosperous households set a standard our own elites are eager to follow. Encourage their patronage of learning and public life, giving Aurma greater confidence and a stronger culture of inquiry."

AUR_end_to_era: "An End to an Era"
AUR_end_to_era_desc: "For too long, raiders have set the terms of life along our trade routes. Rally Aurma behind a more orderly maritime policy, with commissioned captains at its heart."

AUR_new_era: "New Era"
AUR_new_era_desc: "The captains once dismissed as outlaws now have a place in Aurma's councils. Their daring and experience will help us chart a new course, with greater influence for those who command at sea."

AUR_naval_outposts: "Naval Outposts"
AUR_naval_outposts_desc: "A fleet's reach depends on the harbors that can support it. Improve our methods for building naval bases so that future outposts can take shape more quickly."

AUR_pirate_bay: "Pirate Bay"
AUR_pirate_bay_desc: "Even the boldest captain needs a harbor for repairs. Where we hold a stretch of coast, expand its shipbuilding facilities into a dependable base for our crews."

AUR_warm_sea: "Warm Sea"
AUR_warm_sea_desc: "Familiar waters are the foundation of a confident fleet. Refine our crews' routines on the routes they know best, strengthening seamanship and confidence at home."

AUR_cold_sea: "Cold Sea"
AUR_cold_sea_desc: "Beyond familiar harbors, a crew's nerve matters as much as its charts. Prepare our sailors for harder voyages and rally support for Aurma's ambitions at sea."

AUR_sea_of_blood: "Sea of Blood"
AUR_sea_of_blood_desc: "The sea offers riches, but force can decide who keeps them. Rally the captains behind a more aggressive course, accepting the unrest that such ambitions may stir at home."

AUR_sea_of_thiefs: "Sea of Thieves"
AUR_sea_of_thiefs_desc: "No chart can account for every raider on the open sea. Draw on our captains' experience of these dangerous waters and rally support for a more assertive maritime policy."

AUR_tight_crews: "Tight Crews"
AUR_tight_crews_desc: "A captain can trust a ship only when its crew knows how to act together. Tighten our shipboard routines and prepare our submariners to bring their vessels home."

AUR_oceanic_outreach: "Oceanic Outreach"
AUR_oceanic_outreach_desc: "Our maritime ambitions need a voice beyond the harbor. Send experienced captains to carry Aurma's interests farther afield, strengthening our resolve and influence at home."

AUR_shallow_water_supremacy: "Shallow Water\nSupremacy"
AUR_shallow_water_supremacy_desc: "The waters close to shore leave little room for a captain's mistakes. Bring together the lessons of our crews, navigators, and fighting ships to support a more confident presence along the coast."

AUR_sea_of_iron: "Sea of Iron"
AUR_sea_of_iron_desc: "Ambitions at sea must be supplied from shore. Set our yards and workshops to a stronger rhythm, giving Aurma the industrial strength to sustain its fleet."

AUR_navigational_diplomacy: "Navigational Diplomacy"
AUR_navigational_diplomacy_desc: "A reliable chart can open a conversation that threats would close. Put our navigators' knowledge at the service of Aurma's diplomacy and give our leaders another means to advance our interests."

AUR_sea_maps: "Sea Maps"
AUR_sea_maps_desc: "Every veteran captain carries knowledge that no chart yet records. Gather their soundings, routes, and warnings before those lessons are lost, and put them to work for Aurma."

AUR_warships: "Warships"
AUR_warships_desc: "Our largest ships must be built well and fought well. Improve work in the yards and turn our captains' experience into greater striking power at sea."

AUR_freljordian_boarding_parties: "Freljordian Boarding Parties"
AUR_freljordian_boarding_parties_desc: "The Freljord breeds warriors accustomed to hardship. Bring willing recruits into our boarding parties and let their fighting experience strengthen Aurma's crews."

AUR_chaotic_sea: "Chaotic Sea"
AUR_chaotic_sea_desc: "Calm waters never last forever. Prepare our captains for disruption along the trade routes and rally the country behind a fleet ready to face it."

AUR_strait_question: "Strait Question"
AUR_strait_question_desc: "Our trade depends on passage through narrow waters. Bring captains and officials together to prepare Aurma's response when those routes are threatened."

AUR_deep_water_supremacy: "Deep Water\nSupremacy"
AUR_deep_water_supremacy_desc: "Far from a familiar harbor, navigation and fighting skill must serve the same purpose. Combine those lessons and rally support for Aurma's ambitions on the open sea."

AUR_water_tyrant: "Open Water Tyrant"
AUR_water_tyrant_desc: "It's Time We realize Our Destiny, the Sea is Ours!"

AUR_targonian_nav: "Targonian Navigators"
AUR_targonian_nav_desc: "Its clearly written in the stars we navigate, and Finally we see it!"

AUR_ocean_masters: "Ocean Masters"
AUR_ocean_masters_desc: "A proud fleet must be able to turn its captains' knowledge into coordinated action. Refine its organization and sailing routines so that Aurma's ships can answer danger swiftly and together."

AUR_ocean_stewardship: "Ocean Stewardship"
AUR_ocean_stewardship_desc: "A well-run ship earns the trust of those who sail aboard it. Make reliable service and careful seamanship a point of Aurman pride, bringing greater confidence to our crews and our people."

AUR_island_stewardship: "Island Stewardship"
AUR_island_stewardship_desc: "Ambition at sea must be supported by steady work ashore. Develop workshops in the lands we administer and give our people a stronger stake in Aurma's future."

AUR_island_ownership: "Island Ownership"
AUR_island_ownership_desc: "Prosperity means little if authority at home remains uncertain. Strengthen the administration of our holdings and unite their interests behind Aurma's government."

 
################################### OTHER\n                     \n      §H§!

AUR_990_DESC: "Aurma, a modest island off the coast of Shurima, dreams of grandeur amidst turbulent seas. As it charts a course toward greater prominence, foreign powers cast covetous eyes upon its shores. Will Aurma's aspirations weather the storms of foreign ambitions, or will the plans of rivals submerge Aurma's dreams beneath the waves of history?"

