l_english:
 landmark_void_gate: "Void Gate"
 landmark_void_gate_desc: "An open breach at the Void Rupture. Damage can extinguish the breach until the landmark is repaired."
 landmark_void_gate_closed: "Sealed Void Gate"
 landmark_void_gate_closed_desc: "The dormant gate at the Void Rupture."
 landmark_void_gate_construction: "Void Gate Under Construction"
 landmark_void_gate_construction_desc: "A ribbed frame is taking shape over the Void Rupture."
 landmark_void_gate_first_rift: "First Rift"
 landmark_void_gate_first_rift_desc: "The first firing has split the earth beneath the unfinished gate."
 void_gate.10.t: "Construction of the Void Gate Begins"
 void_gate.10.d: "Scouts in southern Shurima report that the Icathian cult has begun raising a gate over the Void Rupture. Great black ribs have risen from the ravine. At night, a violet light moves between their roots. The gate is still unfinished, and word has gone out to every court and command post that there may yet be time to intervene."
 void_gate.10.a: "Send word to the frontier."
 void_gate.11.t: "The First Rift Fires"
 void_gate.11.d: "The horizon turned white for a heartbeat. Then a column of pink fire climbed out of the Rupture, rolled over on itself, and spread into a mushroom cloud above the desert. The shock reached the watch posts long after the flash. Through the dust, survivors could still see the gate's ribs standing over a newly opened fissure."
 void_gate.11.a: "What have they opened?"
 void_gate.12.t: "A Storm Over Icathia"
 void_gate.12.d: "Three days after the flash, the dust has cleared enough for scouts to approach the Rupture. Sheets of violet lightning coil above the gate, and shapes are moving across the flats beneath it. The first blast lasted seconds. The breach it left behind is still feeding the storm."
 void_gate.12.a: "Keep the roads under watch."
