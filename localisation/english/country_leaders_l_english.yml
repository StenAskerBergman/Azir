l_english:
POLITICS_ELDRED_DESC:0 "Mageseeker eldred has been the driving force in the recent rise of the mageseeker organization, rising through the political ranks with his intrigue and manipulation. Seeking only a pure Demacia, he is set on driving the rebellious mages to extinction to preserve the integrity and superiority of Demacia."
POLITICS_JARVIN4_DESC:0 "The newly enacted King Jarvan IV has been thrusted into a precarious situation at the least. From the outburst of the mage civil war, to his father being assassinated, Jarvan IV must hold strong and persevre through all the challenges that face both him and his country. His actions in the next few years will determine the course of history for Demacia for centuries to come."
POLITICS_JARVIN3_DESC:0 "King Jarvan has led Demacia through many decades of unstable times, from foreign armies to internal affairs. He has upheld the core tenements of the Demacian nation for years, yet many in his court have taken these values astray. The mageseekers have risen in prominence, and with them, potential conflict and instability. How will the King and his bold prince lead Demacia through the coming storm?"
POLITICS_THRESH_DESC:0 "Described as an ambitious and cunning spirit, Thresh has been the warden of the Shadow Isles since most can remember. In a sea of dread and sorrow, Thresh lures all who dare venture to the isles to their untimely fate, and with each soul he takes, he draws closer to his grand plan."
POLITICS_MISSFORTUNE_DESC:0 "Finally breaking the yoke of the pirate king Gangplank, Miss Fortune finds herself the captain of bilgewater. Yet her rule is not certain, as many pirate gangs and warlords vie for power and control of the archipelago. Miss Fortune must stamp out all who stand in her way if she hopes one day rule the bay unopposed."
POLITICS_QIYANNA_DESC:0 "Ascending to power in any way she saw fit, Qiyanna rules the elusive kingdom of Ixtal in the deep jungle. The kingdom is not centralized, however, and is sparsely populated with those loyal to the elemental throne. Only through cementing her rule over the jungles will Qiyanna be able to fend off the outside world."
POLITICS_TONNIKA_DESC:0 ""
POLITICS_VANDER_DESC:0 "Once a strong fighter and leader for the freedom of the undercity, Vander has since taken to his quiet bar with his adopted misfits for company. Yet the wider world keeps moving, and his past will eventually and abruptly catch up to him."
POLITICS_THECOUNCIL_DESC:0 "The Council of Piltover decides the direction and fate for the people of both Piltover and the Undercity with its 7 representatives. Yet many people, both from the Undercity and from the upper districts, would view the council as slow and outdated. How will the council adapt to the sea of uncertanty that is the future?"
POLITICS_IRELIA_DESC:0 "Through the first Noxian invasion of Ionia, many rose to the occasion to protect their sacred land. Irelia was one among many who sought to kick out the Noxian invaders, granting her the favor of her people. Yet Noxus stirs under the vengeful eye of Swain, and ancient orders seek their untapped power, all of which aim to break the peace that Irelia fought so dearly for."
POLITICS_MALZAHAR_DESC:0 "A desolate wanderer of the wastes, Malzahar forsees a future where all life is unified in peace and prosperity. Through his visions, Malzahar prepares the world for those who will purify it, stiring countless abominations awake."
POLITICS_ARATHMAE_DESC:0 ""
POLITICS_JACKSTORMER_DESC:0 ""
POLITICS_AZIR_DESC:0 "Whether by fate or fortune, the god-emperor of Shurima has arisen, and with him, his glorious empire. Pretenders plot and darkin warriors stir, yet it need not matter, for all are no match for the glory of Shurima."
POLITICS_LEONA_DESC:0 "Being an aspect of the sun, Leona guards Mount Targon and its celestial inhabitants together with the Solari. She further seeks total victory against the dangerous and misguided Lunari, no matter the cost... right?"
POLITICS_BRANNIN_DESC:0 ""
POLITICS_NOORIN_DESC:0 ""
POLITICS_PIARRE_DESC:0 ""
POLITICS_ALYSSA_DESC:0 ""
POLITICS_TRIFARIX_DESC:0 "The Noxian Trifarix is a council of three that rules Noxus under the tenants of Might, Vision, and Guile. The Trifarix is a council that has been in place for many years, yet the current members are new to the council and have yet to prove themselves as capable rulers of the great nation of Noxus."
POLITICS_SWAIN_DESC:0 "Noxian Grand General Jericho Swain rules Noxus with a demonic fist, annihilating all dissenters of his newly ascended rule. The visionary ruler further prepares his grand ambitions for the great nation of Noxus through conquering the strong and preying on the weak, all in the name of Noxus."
POLITICS_VOLIBEAR_DESC:0 "Praise be the mighty Volibear! Grant your strength and fortitude to your followers and return the Freljord to its wild and feral roots!"
POLITICS_ASHE_DESC:0 "The compassionate warmother of the Avarosan tribe channels her iceborn magic to help guide her followers through the perils of the Freljord. Trouble brews, however, as the rival clan of the Winter's Claw grow more bold in their unification of the Freljord. For the survival of the Avarosan tribe and for the prosperity of the Freljord, Ashe must step up and face the challenges ahead."
POLITICS_SEJUANI_DESC:0 "Warmother of the Winter's Claw, Sejuani is a battle hardened warrior who leads her tribe admist the harsh Freljordian winters and foreign adversaries. Is the Winter's Claw bound to be simple raiders for the rest of history, or will Sejuani take her clan on a different path."
POLITICS_LISSANDRA_DESC:0 "The ice witch Lissandra was once ajoined by her two other sisters yet in order to save Runeterra, they and many others were entombed in ice to seal an unstoppable threat. Today, the seal to this evil begins to crack, and if Lissandra is not prepared, other worldly horrors will consume all that is known."
