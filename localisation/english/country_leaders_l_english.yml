POLITICS_SYLAS_DESC:0 "Sylas began his early years as a simple tool for the Mageseekers as a way to find and capture hidden mages for them. After an explosive incident, he was jailed for many years and was even set to be executed for his limited interaction with the outside world. Igniting a daring escape, Sylas must now choose to fight for himself against his old oppressors or lead the many hopeless mages in Demacia for a better future."
POLITICS_LUX_DESC:0 "Luxanna Crownguard, by decree from the royal family in Demacia, has been selected to represent and govern the city of Terbisia in order to provide a safe haven for all mages."
