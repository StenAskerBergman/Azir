l_english:
 nazumah.400.t: "Our Own Authority"
 nazumah.400.d: "Nazumah answers to no foreign throne. Our hunters and households will uphold that freedom together, guarding the right to decide our own future."
 nazumah.400.a: "Our future remains our own."
 nazumah.401.t: "A Demand for Freedom"
 nazumah.401.d: "Nazumah's future remains subject to a foreign throne. Shall we demand recognition of our independence, or hold our claim until a better moment?"
 nazumah.401.a: "Demand recognition of our independence."
 nazumah.401.b: "Hold our claim for now."
 nazumah.402.t: "Nazumah Demands Independence"
 nazumah.402.d: "Nazumah has demanded the right to govern without our authority. We must decide whether to release it from subject status or refuse the demand."
 nazumah.402.a: "Recognize Nazumah's independence."
 nazumah.402.b: "Refuse the demand."
 nazumah.403.t: "Recognition Refused"
 nazumah.403.d: "Our overlord has refused to recognize Nazumah's independence. Our subject status remains in force; this diplomatic demand has brought no release."
 nazumah.403.a: "We will remember this refusal."
