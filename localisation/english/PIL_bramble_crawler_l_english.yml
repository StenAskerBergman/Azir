l_english:
 PIL_design_bramble_crawler:0 "Design the Bramble Crawler"
 PIL_design_bramble_crawler_desc:0 "River Pilt's works engineers propose a tracked machine for ground where wagons cannot follow. Its toothed cutting drum and low gearing could clear a lane through the tangled growth on the Shuriman mainland. The Council must still commission the design and put it through trials."
 PIL_design_bramble_crawler_tt:0 "Opens §YBramble Crawler Engineering§! in Support Research."
 PIL_bramble_crawler_design:0 "Bramble Crawler Engineering"
 PIL_bramble_crawler_design_desc:0 "Piltover's engineers trade road speed and fuel economy for the traction to move heavy growth and keep a route open for the column behind them."
 azir_plt_bramble_crawler:0 "Bramble Crawler"
 azir_plt_bramble_crawler_1:0 "Bramble Crawler Mk I"
 azir_plt_bramble_crawler_1_short:0 "Bramble Mk I"
 azir_plt_bramble_crawler_1_desc:0 "A slow tracked clearance vehicle with a rotary drum with replaceable teeth, heavy gearing and a high fuel demand."
 azir_plt_bramble_crawler_battalion:0 "Bramble Crawler Battalion"
 azir_plt_bramble_crawler_battalion_desc:0 "A fuel-hungry engineering battalion that opens a lane for its division in jungle. The crawler's low top speed slows fast formations on open ground."
 PIL_test_bramble_crawlers:0 "Run the River Pilt Crawler Trials"
 PIL_test_bramble_crawlers_desc:0 "Set aside 45 days at River Pilt to test the cutter, gearing and fuel supply. A successful trial releases 24 crawlers and a Works Column template."
 PIL_bramble_crawler.1.t:0 "A Track Through the Thicket"
 PIL_bramble_crawler.1.d:0 "On a marked test strip at River Pilt the crawler opened a lane under load. Four infantry companies kept moving behind two crawler crews, but the fuel cart needed a second run before sundown. The Council has enough vehicles to outfit a works column. The engineers ask whether the next run should refine the design or teach the quartermasters how to supply it."
 PIL_bramble_crawler.1.a:0 "Keep the works engineers at the test strip"
 PIL_bramble_crawler.1.b:0 "Have the quartermasters drill a relief column"
