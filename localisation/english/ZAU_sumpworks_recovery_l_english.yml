l_english:
 ZAU_design_sumpworks_recovery:0 "Outfit the Sumpworks Rigs"
 ZAU_design_sumpworks_recovery_desc:0 "The freight lift is running again, but crews still have to go below it when a pump fails or a ramp floods. The Sump's shops propose a low recovery rig with a hoist that can lift wreckage where the larger yard cranes cannot reach."
 ZAU_design_sumpworks_recovery_tt:0 "Opens §YSumpworks Recovery Engineering§! in Support Research."
 ZAU_sumpworks_recovery_design:0 "Sumpworks Recovery Engineering"
 ZAU_sumpworks_recovery_design_desc:0 "Give the ward crews sealed pumps, compact rigs and interchangeable hoist parts so they can keep flooded routes and crowded streets passable."
 azir_zau_sumpworks_rig:0 "Sumpworks Rig"
 azir_zau_sumpworks_rig_1:0 "Sumpworks Recovery Rig"
 azir_zau_sumpworks_rig_1_short:0 "Sumpworks Rig"
 azir_zau_sumpworks_rig_1_desc:0 "A tracked recovery tractor with a repairable derrick and a guarded pump jacket. It can haul debris off narrow ramps and work in marsh water."
 azir_zau_sumpworks_recovery_company:0 "Sumpworks Recovery Company"
 azir_zau_sumpworks_recovery_company_desc:0 "Recovery crews clear wreckage and keep pumps in service in marshes and built-up districts. They use an engineer support slot and consume fuel and supplies."
 ZAU_test_sumpworks_recovery:0 "Run the Sumpworks Recovery Trial"
 ZAU_test_sumpworks_recovery_desc:0 "Spend 35 days proving the rig on the Sump's flooded service ramps. The trial requires both wards and a factory. The finished batch can equip one relief column."
 ZAU_sumpworks_recovery.1.t:0 "Who Gets the First Call?"
 ZAU_sumpworks_recovery.1.d:0 "The recovery rig hauled a broken pipe off the ramp and the crews had it passable before the shift bell. There are eight machines ready. The foundry has asked who gets to send the first order when the next flood cuts the wards off."
 ZAU_sumpworks_recovery.1.a:0 "Let the clinics and ward dispatchers call the crews"
 ZAU_sumpworks_recovery.1.b:0 "Guarantee the Directorate freight shifts first"
 ZAU_sumpworks_recovery.1.c:0 "Put the Firelight repair roster on call"
