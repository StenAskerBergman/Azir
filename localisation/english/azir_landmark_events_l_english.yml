l_english:
 azir_kaisa.1.t: "Kai'Sa Returns"
 azir_kaisa.1.d: "Kassadin followed the tunnels beneath the Rupture and found his daughter alive. Kai'Sa came back with him to see the new settlements for herself. She has spent years keeping creatures like these from reaching the surface. If Icathia will give her room to work, she is willing to stand with its defenders."
 azir_kaisa.1.d_hybrid: "Kassadin went below expecting to find tracks. He came back beside his daughter. Kai'Sa saw families settling behind the containment lines and heard what Icathia had promised its survivors. She could keep the armor that had kept her alive, and the people here would give her a place among them. She has chosen to stay and help defend the settlements."
 azir_kaisa.1.a: "Welcome home, Kai'Sa."
 azir_kaisa.1.b: "Ask her to serve with the defenders."
 azir_kaisa.1.c: "Let her keep her own watch."
 VOI_send_for_kaisa: "Send for Kai'Sa"
 VOI_send_for_kaisa_desc: "With the settlements established and the Rupture in our hands, Kassadin can bring his daughter back to see the people she has a chance to protect."
 XER_rival_sun_disc_category: "The Rival Sun Disc"
 XER_raise_rival_sun_disc: "Raise the Sun Disc of Nerimazeth"
 XER_raise_rival_sun_disc_desc: "Build an arcane Sun Disc on the old foundations while Azir still holds the imperial capital. Xerath's followers will have a place to conduct their own rites, even if the struggle for Shurima leaves the imperial disc in ruins."
 azir_sun_disc.1.t: "The Sun Disc Shatters"
 azir_sun_disc.1.d: "Shurima's capital has fallen. As the fighting reached the imperial dais, the Sun Disc broke above the city. Its last light spilled through the fractures and went out. Refugees looking back from the desert roads could still see the two halves hanging over the smoke."
 azir_sun_disc.1.a: "The capital has fallen."
 azir_sun_disc.2.t: "A Second Sun Over Nerimazeth"
 azir_sun_disc.2.d: "Xerath's followers have raised a Sun Disc on the old foundations at Nerimazeth. They say the arcane fire caught in its bronze will give them a source of power whatever becomes of Azir's capital. Pilgrims are already coming to the new dais. The first to enter its light are still inside."
 azir_sun_disc.2.a: "Nerimazeth has a sun of its own."
