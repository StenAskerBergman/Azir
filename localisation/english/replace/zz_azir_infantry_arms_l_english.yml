l_english:
 infantry_equipment: "Infantry Arms"
 infantry_equipment_short: "Infantry Arms"
 infantry_equipment_desc: "The weapons and field kit issued to ordinary troops. Armories supply replacements from the national stockpile."
 infantry_weapons: "Common Infantry Arms"
 infantry_weapons_desc: "Local smiths and craftspeople supply the weapons a foot company needs to take the field."
 infantry_equipment_0: "Common Infantry Arms"
 infantry_equipment_0_short: "Common Arms"
 infantry_equipment_0_desc: "Locally made weapons and field kit for the first muster."
 infantry_weapons1: "Muster Arms"
 infantry_weapons1_desc: "Armories prepare complete sets of weapons and kit so that companies can draw their issue together."
 infantry_equipment_1: "Muster Arms"
 infantry_equipment_1_short: "Muster Arms"
 infantry_equipment_1_desc: "Weapons and kit collected and issued by the company. Recruits draw their issue at muster."
 infantry_weapons2: "Close-Order Arms Drill"
 infantry_weapons2_desc: "Companies drill their ranks to strike together against exposed troops."
 improved_infantry_weapons: "Standardized Infantry Arms"
 improved_infantry_weapons_desc: "Armories agree on patterns for their most frequently replaced fittings. Troops can carry familiar weapons even when replacements come from another workshop."
 infantry_equipment_2: "Standardized Infantry Arms"
 infantry_equipment_2_short: "Standard Arms"
 infantry_equipment_2_desc: "Service weapons made to common armory patterns, with fittings that trained armorers can replace in the field."
 improved_infantry_weapons_2: "Coordinated Assault Drill"
 improved_infantry_weapons_2_desc: "Foot and mounted companies practice supporting one another when they attack troops in the open."
 advanced_infantry_weapons: "Masterwork Infantry Arms"
 advanced_infantry_weapons_desc: "Experienced armorers teach their best patterns to the workshops that supply the field army."
 infantry_equipment_3: "Masterwork Infantry Arms"
 infantry_equipment_3_short: "Masterwork Arms"
 infantry_equipment_3_desc: "The armories' finest service weapons, made in sufficient numbers to replace losses on campaign."
 advanced_infantry_weapons2: "Combined Assault Drill"
 advanced_infantry_weapons2_desc: "Foot troops, riders and transported companies rehearse a common assault. Transported troops learn to join the attack as soon as they arrive."
