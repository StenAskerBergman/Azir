l_english:
 industry_law: "Magic Law"
 security_law: "Doctrine of Power"
 education_law: "Faith and Spirit"

 magic_law_regulated: "Regulated Magic"
 magic_law_regulated_desc: "Licensed practitioners and state oversight. Magic is neither feared nor unleashed."
 magic_law_forbidden: "Forbidden Magic"
 magic_law_forbidden_desc: "Sorcery is outlawed and its users hunted. Order and morale hold firm, but knowledge is lost."
 magic_law_free: "Free Magic"
 magic_law_free_desc: "Anyone may study and build with the arcane. Discovery and industry surge, and so does danger."
 magic_law_dread_arts: "Dread Arts"
 magic_law_dread_arts_desc: "Necromancy turns the dead of conquered lands into soldiers, whatever the cost to the living."
 magic_law_divine_light: "Divine Light"
 magic_law_divine_light_desc: "Miracles are sanctioned as gifts of the divine. Wounded armies recover quickly and the faithful stand firm."
 magic_law_arcane_commerce: "Arcane Commerce"
 magic_law_arcane_commerce_desc: "Spells are licensed, taxed and sold. Profit drives industry, and loyalty follows the highest bidder."
 magic_law_imperial_arcana: "Imperial Arcana"
 magic_law_imperial_arcana_desc: "Only the throne may wield the great arts. Command flows from a single will, at the expense of open inquiry."
 magic_law_primal_rites: "Primal Rites"
 magic_law_primal_rites_desc: "Shamans bind the wild and the storm to the tribe. Armies endure harsh lands, but industry stays small."
 magic_law_wasting_blight: "Wasting Blight"
 magic_law_wasting_blight_desc: "A creeping blight feeds the army and starves the land. Soldiers need little and refuse to fall."
 magic_law_arcane_mastery: "Arcane Mastery"
 magic_law_arcane_mastery_desc: "The state is run by those who master the arts. Research and upgrades surge, but few ordinary citizens take up arms."
 magic_law_royal_wardens: "Royal Wardens"
 magic_law_royal_wardens_desc: "Sanctioned wardens serve the crown and guard it against the arcane. Disciplined, loyal and costly."

 power_law_custom: "Customary Rule"
 power_law_custom_desc: "Authority rests on local custom and long-standing arrangements."
 power_law_lineage: "Lineage and Tradition"
 power_law_lineage_desc: "The right to rule is inherited. Noble houses command the army, and peasants are rarely called to arms."
 power_law_might: "Might Makes Right"
 power_law_might_desc: "Power belongs to those who can take and hold it. The state drafts widely and trains fast."
 power_law_merchant: "Merchant Council"
 power_law_merchant_desc: "Wealth buys a seat at the table. Factories rise quickly, but few are willing to fight."
 power_law_hierarchy: "Holy Hierarchy"
 power_law_hierarchy_desc: "A priestly order governs in the name of the divine. Stable and well funded in political favor, but slow to arm."
 power_law_cartel: "Ruling Cartel"
 power_law_cartel_desc: "A handful of great houses and syndicates divide the state among themselves. Deals get done, and few trust them."
 power_law_decree: "Absolute Decree"
 power_law_decree_desc: "The sovereign's word is law. Orders move instantly and the draft answers, but ministers fear to suggest."
 power_law_moot: "Clan Moot"
 power_law_moot_desc: "Every clan sends its warriors when the moot calls. Fast, hardy and loyal, but with little industry and weak central rule."
 power_law_shadow_dominion: "Dominion of Shadows"
 power_law_shadow_dominion_desc: "The fallen answer to a single dark will. Armies fight on past all reason and raise new dead from the conquered."
 power_law_conclave: "Arcane Conclave"
 power_law_conclave_desc: "A council of mages sets policy and doctrine. Brilliant planning, thin popular support."
 power_law_crown_court: "Crown and Court"
 power_law_crown_court_desc: "Court, crown and army move as one. Honor and discipline are rewarded, while luxuries swallow part of the economy."

 faith_law_secular: "Secular State"
 faith_law_secular_desc: "The state keeps no official faith and schools teach practical knowledge."
 faith_law_state_cult: "State Cult"
 faith_law_state_cult_desc: "A single faith is woven into law and rule, uniting the people and hardening the army."
 faith_law_spiritual: "Spiritual Harmony"
 faith_law_spiritual_desc: "Society seeks balance with the spirits and the land, easing supply and strengthening the state."
 faith_law_holy_crusade: "Holy Crusade"
 faith_law_holy_crusade_desc: "Faith is a call to arms. Zealots fill the ranks, while the home front pays in stability and learning."
 faith_law_gospel_progress: "Gospel of Progress"
 faith_law_gospel_progress_desc: "Progress itself becomes the creed. Workshops and laboratories thrive, but few would die for it."
 faith_law_ascension: "Ascension Doctrine"
 faith_law_ascension_desc: "The ruler is a being beyond mortals, and the nation prepares to share in the ascent. Doctrine steadies the realm, at the cost of curiosity."
 faith_law_ancestors: "Ancestral Spirits"
 faith_law_ancestors_desc: "The dead walk beside the living. Warriors fight with fierce courage and need little, but the clans resist change."
 faith_law_void: "Cult of Ruin"
 faith_law_void_desc: "The nation no longer recruits. Instead, the void spits out new troops every week."
 faith_law_enlightenment: "Arcane Enlightenment"
 faith_law_enlightenment_desc: "Understanding the arcane is held as the highest good. Scholars flourish, and the army is an afterthought."
 faith_law_crown_oath: "Sacred Oaths"
 faith_law_crown_oath_desc: "Every soldier swears an oath to crown and creed. Loyal, orderly and slow to adapt."

 dem_magic_petricite: "Petricite Edict"
 dem_magic_petricite_desc: "Petricite walls and warding stone blunt every spell. Armies hold firm, but arcane learning is shut out."
 dem_power_vanguard: "Dauntless Vanguard Charter"
 dem_power_vanguard_desc: "An elite, disciplined vanguard anchors the realm's defense. Quality over numbers, and the court pays for it."
 dem_faith_justice: "Creed of Justice and Honor"
 dem_faith_justice_desc: "Every citizen is taught duty, honor and the law. The people stand united, but novelty is viewed with suspicion."
 shi_magic_black_mist: "Black Mist Dominion"
 shi_magic_black_mist_desc: "The Black Mist feeds the army and strangles the living. The dead need little and give way to nothing."
 shi_power_harrowing: "The Harrowing"
 shi_power_harrowing_desc: "The Ruined King's host sweeps the shore every few years. It fights on past all reason and raises new dead from the fallen."
 shi_faith_procession: "Endless Procession"
 shi_faith_procession_desc: "The dead rise to march without end. Recruitment withers, but the ranks never run dry."
 blg_magic_contraband: "Contraband Relics"
 blg_magic_contraband_desc: "Stolen relics and cursed trinkets fuel a thriving black market. Profitable, and always one step from disaster."
 blg_power_pirate_code: "Code of the Captains"
 blg_power_pirate_code_desc: "Captains answer to the Code, and the Code to whoever pays. Docks hum and crews are always ready, but nobody follows orders for long."
 blg_faith_tides: "Fortune of the Tides"
 blg_faith_tides_desc: "Sailors trust luck, omens and the serpent below. Fortune favors the bold, and the careful go hungry."
 ixt_magic_elemental: "Elemental Accord"
 ixt_magic_elemental_desc: "The Ixaocan orders share the secrets of the elements. Knowledge flows freely, and few are willing to leave the jungle."
 ixt_power_isolation: "Jungle Isolation"
 ixt_power_isolation_desc: "The borders stay sealed and the jungle does the rest. Invaders bleed, and the realm rarely looks outward."
 ixt_faith_orders: "Council of Elemental Orders"
 ixt_faith_orders_desc: "The elemental orders guide the people with patience. Calm and wise, but slow to rouse for war."
 zau_magic_shimmer: "Shimmer Dependency"
 zau_magic_shimmer_desc: "Shimmer pushes bodies and minds past their limits. Soldiers hit hard and recover fast, then burn out."
 zau_power_syndicates: "Undercity Syndicates"
 zau_power_syndicates_desc: "The undercity is run by crews who answer to profit. Factories improvise and deliver, loyalty is for sale."
 zau_faith_chemtech: "Chemtech Pragmatism"
 zau_faith_chemtech_desc: "If it works, it works. Labs push boundaries and ignore the cost, and the streets pay it."
 plt_magic_hextech: "Hextech Renaissance"
 plt_magic_hextech_desc: "Hextech crystals power a new golden age of invention. Progress is fast, expensive and never entirely safe."
 plt_power_council: "Council of Progress"
 plt_power_council_desc: "Councilors weigh every decision against profit and progress. Factories rise quickly, but the army is an afterthought."
 plt_faith_academy: "Academy Ideal"
 plt_faith_academy_desc: "The great academies set the nation's course. Engineers are prized, soldiers are not."
 ion_magic_spirit: "Spirit Realm Harmony"
 ion_magic_spirit_desc: "Magic is a conversation with the spirit realm, not a tool. Armies move lightly and heal quickly, but production lags."
 ion_power_wuju: "Wuju Discipline"
 ion_power_wuju_desc: "Small, disciplined schools teach fighters to turn force against itself. Fewer fighters, trained to a razor's edge."
 ion_faith_balance: "Way of Balance"
 ion_faith_balance_desc: "Harmony is the highest virtue. The people are calm and the state has patience, but few cheer for war."
 voi_magic_corruption: "Void Corruption"
 voi_magic_corruption_desc: "Corruption reshapes flesh into weapons. The swarm heals and adapts, and nothing else grows."
 voi_power_hive: "Hive Directive"
 voi_power_hive_desc: "A single will commands the swarm. Orders are perfect and nobody argues, because nobody thinks."
 voi_faith_swarm: "Endless Swarm"
 voi_faith_swarm_desc: "The swarm spawns instead of recruiting. It is tireless, hungry and utterly alien."
 shu_magic_sun_disc: "Sun Disc Rites"
 shu_magic_sun_disc_desc: "The Sun Disc's rites bless the realm with scholarship and fortitude. Ritual consumes wealth, and crops come second."
 shu_power_dynasty: "Ascended Dynasty"
 shu_power_dynasty_desc: "The ruler is more than mortal and the dynasty endures. Authority is absolute, and innovation is not."
 shu_faith_rebirth: "Sands of Rebirth"
 shu_faith_rebirth_desc: "The sands return what was lost. The old legions rise from the dust, but the realm pays in devotion and doubt."
 tar_magic_celestial: "Celestial Aspects"
 tar_magic_celestial_desc: "The stars grant their aspects to those who climb. Chosen few are exceptional, the rest are left behind."
 tar_power_sanctum: "Mountain Sanctum"
 tar_power_sanctum_desc: "The mountain itself is the fortress. Holding the heights is easy, leaving them is not."
 tar_faith_ascent: "Trials of Ascent"
 tar_faith_ascent_desc: "Every adult climbs, and those who succeed lead. Faith runs deep and patience runs thin."
 nox_magic_crimson: "Crimson Rites"
 nox_magic_crimson_desc: "Blood rites are a tool of the state. Soldiers are strengthened, the conquered are used, and morals are optional."
 nox_power_trifarix: "Trifarix Meritocracy"
 nox_power_trifarix_desc: "Strength earns rank and rank earns command. Talent rises quickly, and rivals die just as quickly."
 nox_faith_glory: "Glory of the Empire"
 nox_faith_glory_desc: "The empire is the only creed that matters. Every citizen is a soldier in waiting and every war a festival."
 fro_magic_frostwards: "Frost Wards"
 fro_magic_frostwards_desc: "Rime wards freeze the invader and the roads alike. Soldiers endure the cold, while the land gives little."
 fro_power_vigil: "Frostguard Vigil"
 fro_power_vigil_desc: "The Vigil holds the citadel through winter and war. Orderly and watchful, but short on workers and resources."
 fro_faith_winter: "Eternal Winter Creed"
 fro_faith_winter_desc: "The faithful embrace the cold as a promise. Armies march light and endure all, but the mind stays closed."
 ava_magic_phoenix: "Anivia's Rebirth"
 ava_magic_phoenix_desc: "The Cryophoenix returns every winter. Warriors recover and hope persists, but there is little to build with."
 ava_power_unity: "Unified Tribes"
 ava_power_unity_desc: "Many tribes under one banner. Warriors come when called, but unity is a fragile thing."
 ava_faith_vow: "Ashe's Vow"
 ava_faith_vow_desc: "A promise to protect the people ties the tribes together. Hopeful and determined, but poor."
 win_magic_rime: "Rime Rites"
 win_magic_rime_desc: "Rime rites harden warriors against the freeze. The warband thrives on hardship, and little else does."
 win_power_warband: "Warband Hierarchy"
 win_power_warband_desc: "Rank belongs to the strongest rider. The warband swells quickly and moves on a single word, and the rest suffers."
 win_faith_boar: "Fury of the Boar"
 win_faith_boar_desc: "The Boar's fury burns in every rider. Charges are devastating, and discipline is optional."
