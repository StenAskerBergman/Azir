 azir_sp_xer_arcane_siege_battery_desc: "Xerath's artificers at Nerimazeth will study the Obelisks of Power to learn how they conduct arcane energy. If they can apply the same principles to field guns, the battery can concentrate its fire on gates and fortifications ahead of an infantry assault."
