l_english:
 ZAU_bop:0 "Zaun's Crossing Policy"
 ZAU_bop_cooperative:0 "The Ward Compact"
 ZAU_bop_coercive:0 "The Glasc Directorate"
 ZAU_bop_status_quo:0 "An Uneasy Ward Bargain"
 ZAU_bop_status_quo_desc:0 "The stewards and yards have a working bargain. No delegation can yet commit the undercity to an open crossing."
 ZAU_bop_opening:0 "The Open Register"
 ZAU_bop_charter:0 "The Ward Compact"
 ZAU_bop_control:0 "Yard-First Permits"
 ZAU_bop_prerogative:0 "The Glasc Directorate"
 ZAU_bop_decisions:0 "Zaun's Crossing Policy"
 ZAU_bop_decisions_desc:0 "Choose what access this city grants, reserves or withdraws during the crossing crisis."
 ZAU_cooperative_charter:0 "Share the Hoist Register and Reserve Freight Space"
 ZAU_cooperative_charter_desc:0 "Open the hoist rosters to joint inspection and set aside working freight slots for Piltover. Our crews carry the cost of the reserved capacity until a joint timetable takes effect."
 ZAU_exclusive_charter:0 "Reserve the Yards for Zaun"
 ZAU_exclusive_charter_desc:0 "Keep the rosters in the undercity and give Zaunite carriers first call on local capacity. The wards will bargain from their own side of the crossing."
 ZAU_exploit_concession:0 "Take Control of the Shared Loading Slots"
 ZAU_exploit_concession_desc:0 "Use the access Piltover granted to reserve its available freight slots for our carriers. The advantage ends when the permits expire or Piltover cuts off access."
 ZAU_answer_breach:0 "Close the Hoist Register and Divert Freight"
 ZAU_answer_breach_desc:0 "Withdraw Piltover's access and put freight through local yards. The breach strengthens those pressing for Zaunite control."
 ZAU_fallback_freight:0 "Run the Lower Landing Detour"
 ZAU_fallback_freight_desc:0 "Pay for a parallel freight route through Lower Landing. It restores some capacity at a continuing cost in consumer goods."
 ZAU_fortify_crossing:0 "Fortify the Lower Approach"
 ZAU_fortify_crossing_desc:0 "Secure Zaun's approach from our side of the crossing. The decision does not declare war."
 ZAU_reserved_capacity:0 "Capacity Reserved for the Other Bank"
 ZAU_reserved_capacity_desc:0 "Our crews and workshops carry the cost of keeping space open for the other city."
 ZAU_priority_freight:0 "Exclusive Crossing Permits"
 ZAU_priority_freight_desc:0 "Our freight moves first while we retain access to the other city's crossing arrangements."
 ZAU_freight_disruption:0 "Freight Held at the Crossing"
 ZAU_freight_disruption_desc:0 "The city's commitments have been used against its own carriers. Shipments are waiting while an alternative is organized."
 ZAU_emergency_freight:0 "Emergency Freight Diversion"
 ZAU_emergency_freight_desc:0 "Emergency dispatches keep supplies moving while the city pays to hire replacement crews and carriers."
 ZAU_fallback_freight_idea:0 "Parallel Freight Route"
 ZAU_fallback_freight_idea_desc:0 "Duplicated crossings, storage and crews keep goods moving at a permanent cost."
 ZAU_joint_freight:0 "Two Cities Freight Charter"
 ZAU_joint_freight_desc:0 "The joint board publishes fares and work schedules. Shared workshops can service both banks and exchange research under the same charter."
 ZAU_bridge.1.t:0 "They Look Down on Us"
 ZAU_bridge.1.d:0 "Piltover used the hoist register and the freight capacity we set aside to move its own carriers to the head of the queue. The lower wards demand that we close the register and send their freight another way."
 ZAU_bridge.1.a:0 "Put an emergency response before the city."
 ZAU_bridge_cooperative:0 "Zaun committed to cooperation."
 ZAU_bridge_coercive:0 "Zaun committed to exclusive control."
