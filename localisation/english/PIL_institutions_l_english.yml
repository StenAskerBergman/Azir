l_english:
 PIL_public_warrant_council:0 "Public Warrant Council"
 PIL_public_warrant_council_desc:0 "Jayce and the Academy delegates want public warrants to carry designs beyond a single laboratory. Establish a licensing council once the Two Cities Accord and at least one external agreement are operating, or once our River Pilt detour is in service alongside both agreements."
 PIL_council_prerogative:0 "Council Prerogative"
 PIL_council_prerogative_desc:0 "Clan Ferros asks the Council to entrust procurement to its concession board. The Council will hear the request once the River Pilt works and a full requisition cycle have demonstrated what the corridor can deliver."
 PIL_independent_inspectorate:0 "Independent Inspectorate"
 PIL_independent_inspectorate_desc:0 "A failed request for survey access or a breach at the crossing gives the Council cause to examine its procurement records. Caitlyn Kiramman can follow the permits, invoices and inspection logs wherever they lead."
 PIL_hear_industrial_delegates:0 "Hear the Industrial Delegates"
 PIL_hear_industrial_delegates_desc:0 "Hear the Academy delegates or the charter board before declaring a freight policy. The hearing moves the balance of power into the corresponding range and leaves the crossing declaration open."
 PIL_enact_public_licensing:0 "Enact Public Licensing"
 PIL_enact_public_licensing_desc:0 "Put Jayce's public warrants into law and make the Academy delegation available as a political advisor. Enacting the policy before settling the crossing keeps the Council free to choose either freight position."
 PIL_repeal_public_licensing:0 "Repeal Public Licensing"
 PIL_repeal_public_licensing_desc:0 "Spend 50 political power and 60 days to repeal the law. The Academy delegation leaves office and the Council stops taking claims for recurring civilian studies. Completed research is retained."
 PIL_claim_civilian_study:0 "Commission a Civilian Engineering Study"
 PIL_claim_civilian_study_desc:0 "The Warrant Council can license a civilian design for a 45-day study while its freight and partner network operates. Completion grants one 50% industry research bonus. The Council must wait before commissioning another study."
 PIL_enact_exclusive_procurement:0 "Enact Exclusive Procurement"
 PIL_enact_exclusive_procurement_desc:0 "Grant the Ferros board exclusive procurement rights and make its delegation available as a political advisor. Reserved capacity increases consumer-goods demand for as long as the concession operates."
 PIL_settle_ferros_concession:0 "Settle the Ferros Concession"
 PIL_settle_ferros_concession_desc:0 "Spend 50 political power and 60 days to close the concession. New works, cycles and draws are suspended during settlement. When the agreement ends, the board loses its advisor seat, any unfinished cycle is canceled, and any reserved draw is released."
 PIL_river_pilt_procurement_works:0 "Begin River Pilt Procurement Works"
 PIL_river_pilt_procurement_works_desc:0 "Survey and fit out the corridor's storage and dispatch yards over 60 days. The completed works qualify River Pilt for requisition orders and add infrastructure where there is room to expand."
 PIL_run_requisition_cycle:0 "Run a Requisition Cycle"
 PIL_run_requisition_cycle_desc:0 "Reserve production from existing military factories for 90 days. Piltover must own and control River Pilt and have an operating Accord or a detour in service. The cycle fails if the concession, corridor or production capacity is lost."
 PIL_draw_emergency_equipment:0 "Draw Emergency Equipment"
 PIL_draw_emergency_equipment_desc:0 "Release 400 infantry equipment from the completed requisition cycle. Another draw requires another completed cycle."
 PIL_conduct_public_audit:0 "Conduct a Public Procurement Audit"
 PIL_conduct_public_audit_desc:0 "Give Caitlyn 60 days to check tender awards against the permits and delivery records. Factory output falls by 10% during the audit. The Council will then decide whether to publish the findings."
 PIL_public_licensing_policy:0 "Public Licensing"
 PIL_public_licensing_policy_desc:0 "The Council issues public warrants for civilian designs and seats an Academy delegation. Research claims depend on the freight network and the rights granted by participating partners."
 PIL_exclusive_procurement_policy:0 "Exclusive Procurement"
 PIL_exclusive_procurement_policy_desc:0 "Clan Ferros reserves factory and freight capacity under its concession. The Council can requisition equipment through River Pilt at a continuing cost in consumer goods."
 PIL_inspection_regime:0 "Regulated Inspection"
 PIL_inspection_regime_desc:0 "Caitlyn's published findings require recorded tenders and signed inspections. Verification slows factory output while clearer standards help production lines build efficiency. Exclusive concessions are barred."
 PIL_request_kumungu_survey:0 "Request the Kumungu Survey"
 PIL_request_kumungu_survey_desc:0 "Ask Ixtal to authorize a mapped, escorted surface survey in Kumungu. Ixtal retains control of access and may withdraw permission. The offer lapses after 30 days."
 PIL_study_kumungu_designs:0 "Study the Kumungu Survey"
 PIL_study_kumungu_designs_desc:0 "Academy engineers can study the survey under Ixtali supervision. After 45 days, receive one 30% industry research bonus. Losing permission or access ends the study."
 PIL_ix_revoke_survey:0 "Withdraw the Kumungu Survey Permit"
 PIL_ix_revoke_survey_desc:0 "Withdraw Ixtal's permission for Piltover to work from the Kumungu survey. Active studies relying on the permit may be canceled, and Piltover can no longer count it as a live agreement."
 PIL_request_scar_registry:0 "Propose a Crystal Scar Registry"
 PIL_request_scar_registry_desc:0 "Ask the Registry Office to catalogue specimens jointly. The Crystal Scar retains custody at every stage, and its officials can withdraw access. The offer lapses after 30 days."
 PIL_study_scar_registry:0 "Study the Crystal Scar Registry"
 PIL_study_scar_registry_desc:0 "Examine the joint catalogue under Registry Office supervision. After 45 days, receive one 30% electronics research bonus. Losing permission or access ends the study."
 PIL_cry_revoke_registry:0 "Withdraw Registry Access"
 PIL_cry_revoke_registry_desc:0 "Close Piltover's access to the joint catalogue. The Crystal Scar retains custody of the specimens, and Piltover can no longer count the registry as a live agreement."
 PIL_public_warrant_council_tt:0 "Unlocks recurring Civilian Engineering Studies while Public Licensing and the required partnerships remain active."
 PIL_council_prerogative_tt:0 "Unlocks an emergency equipment draw for each completed requisition cycle."
 PIL_independent_inspectorate_tt:0 "Unlocks Caitlyn's 60-day Public Procurement Audit in the Balance of Power panel."
 PIL_academy_delegation:0 "Academy Delegation"
 PIL_academy_advisor:0 "Academy Delegation"
 PIL_ferros_delegation:0 "Ferros Board Delegation"
 PIL_ferros_advisor:0 "Ferros Board Delegation"
 PIL_regional_diplomacy:0 "Regional Agreements"
 PIL_regional_diplomacy_desc:0 "Survey and registry access depend on the consent of the governments responsible for each site."
 PIL_events.30.t:0 "The Procurement Findings"
 PIL_events.30.d:0 "Caitlyn has matched the orders in the Council ledger against the permits carried by the haulers and the inspection certificates filed at the yards. Her report identifies where the paper trail broke and proposes a published register of tenders and signed inspections. The Council can order the report published or take the case back for its own deliberations."
 PIL_events.30.a:0 "Publish the findings and enforce the standards"
 PIL_events.30.b:0 "Return the case to the Council"
 PIL_regional_wait:0 "Let the offer lapse"
 PIL_regional_acknowledge:0 "Record the reply"
 PIL_regional.1.t:0 "Piltover Requests a Kumungu Survey"
 PIL_regional.1.d:0 "Piltover asks for a mapped surface survey in Kumungu. Our escorts would approve the route and supervise the engineers. The permit would cover survey records for a supervised study. It would remain ours to withdraw."
 PIL_regional.1.a:0 "Authorize a mapped, escorted survey"
 PIL_regional.1.b:0 "Decline the request"
 PIL_regional.2.t:0 "Ixtal Answers the Survey Request"
 PIL_regional.2.a:0 "Ixtal has approved the route and will assign escorts. Our engineers can begin a supervised study while the permit and access remain in force."
 PIL_regional.2.b:0 "Ixtal has declined to grant survey access. The Council can ask Caitlyn Kiramman to examine the procurement records that informed our request."
 PIL_regional.3.t:0 "Piltover Proposes a Joint Registry"
 PIL_regional.3.d:0 "Piltover asks the Registry Office for permission to catalogue specimens jointly. The proposed terms keep all specimens in the Crystal Scar's custody. Our officials would supervise access and retain the right to close the catalogue to visiting engineers."
 PIL_regional.3.a:0 "Approve the registry under our custody rules"
 PIL_regional.3.b:0 "Close the proposal"
 PIL_regional.4.t:0 "The Registry Office Replies"
 PIL_regional.4.a:0 "The Registry Office has approved joint cataloguing. Its officials retain custody and will supervise our engineers for as long as access remains open."
 PIL_regional.4.b:0 "The Registry Office has declined the proposal. Any further request will require a new reply."
