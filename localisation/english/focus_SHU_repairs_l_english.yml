l_english:
 SHU_fish_on_land: "The Tidecaller Ashore"
 SHU_fish_on_land_desc: "Nami has ventured ashore because the ancient accord between the Marai and Targon has broken down. We will hear her plea and begin helping her pursue the rite that protects her people."
 SHU_hire_yuntal_exils: "Recruit Yun Tal Exiles"
 SHU_hire_yuntal_exils_desc: "We will seek recruits among the Yun Tal exiles willing to serve Shurima. Their service will strengthen our ranks and bring experience to the army as we pursue our ambitions in Ixtal."
 SHU_example_ba_bilge_water: "Letters of Marque"
 SHU_example_ba_bilge_water_desc: "Develop the imperial authority needed to pursue a policy of privateering. Draw on the experience of our captains before seeking crews willing to serve that ambition."
 SHU_example_ca_bilge_water: "Break the Pirate Crews"
 SHU_example_ca_bilge_water_desc: "Strengthen the resolve and experience of our maritime service for the struggle against pirate crews. Their defeat must be won at sea, not assumed from a proclamation ashore."
 SHU_example_bb_bilge_water: "A Pact with Bilgewater"
 SHU_example_bb_bilge_water_desc: "Build confidence at home in the compact we seek with Bilgewater. Strengthen the government's authority to pursue a practical relationship with its captains."
 SHU_example_cb_bilge_water: "Rule the Serpent Isles"
 SHU_example_cb_bilge_water_desc: "Rally the maritime service behind our ambition to impose imperial order upon the isles. Greater experience and resolve will come at a cost to stability at home."
 SHU_total_war: "Nuclear Ambitions"
 SHU_total_war_desc: "Shurima must study powers beyond the weapons already at its disposal. Accelerate nuclear research as an ambitious technical undertaking, before any such power can be brought into service."
 SHU_approach_aurma: "Open Talks with Aurma"
 SHU_approach_aurma_desc: "With a foothold on the coast, Shurima can carry its political message to Aurma. We will promote our governing principles there as the crown considers its future relationship with the island realm."
 SHU_shuriman_ship_builders: "Shuriman Shipbuilders"
 SHU_shuriman_ship_builders_desc: "Establish a major shipbuilding complex at the coastal site secured for this program. Four new dockyards will give Shurima the industrial capacity to pursue its maritime ambitions."
 SHU_fate_of_brackern: "The Fate of the Brackern"
 SHU_fate_of_brackern_desc: "The question of the brackern belongs in our deliberations over the Crystal Scar. Establishing an imperial policy will give the crown a clearer mandate for the work that follows."
 SHU_no_more_hunger: "No More Hunger"
 SHU_no_more_hunger_desc: "The restored realm must be judged by what its people can build and sustain. A campaign against hunger will support civilian construction and bring more Shurimans into national service as we work toward lasting security."
 SHU_tribal_respect_desc: "Recognition must be accompanied by respect for the communities of the desert. Affirm that principle in our dealings with the tribes, making it part of the order we intend to build."
 SHU_tribe_unity: "Unity of the Tribes"
 SHU_tribe_unity_desc: "Respect for the tribes must become a lasting bond if the restored realm is to endure. We will affirm ties with Nazumah and seek a closer understanding, leaving room for acceptance or refusal rather than treating shared heritage as obedience."
 SHU_lion_riders: "Riders of the Desert Lions"
 SHU_lion_riders_desc: "The lion riders will stand as an emblem of the legions' courage and service to Shurima. We will use their example to rally support for the army and encourage commitment to its ranks."
 SHU_gold_refinement_bonus:0 "Shuriman Excavation Methods"
 SHU_piltovan_expertise:0 "Piltovan Electronics Expertise"
 SHU_zaunite_chemtech:0 "Zaunite Infantry Arms Research"
 SHU_nomadic_library_bonus:0 "Nomadic Technical Studies"
 SHU_taliyah_engineering:0 "Stoneweaver Excavation Studies"
 SHU_ixtali_elemental_exchange:0 "Ixtali Technical Studies"
 SHU_ionian_learning:0 "Ionian Electronics Studies"
 SHU_diverse_farmland_bonus:0 "Agricultural Industry Studies"
