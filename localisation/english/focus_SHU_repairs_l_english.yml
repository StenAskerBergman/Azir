l_english:
 SHU_fish_on_land: "The Tidecaller Ashore"
 SHU_fish_on_land_desc: "Nami is the first Marai Tidecaller to leave the sea. The old accord with Targon has failed, the Moonstone has not returned, and the magic protecting her people is fading. We must hear why the tide has carried her into our lands."
 SHU_hire_yuntal_exils: "Recruit Yun Tal Exiles"
 SHU_hire_yuntal_exils_desc: "The Yun Tal have guarded Ixtal's elemental traditions for generations. Exiles willing to serve Shurima can bring rare knowledge of the jungle and its magic."
 SHU_example_ba_bilge_water: "Letters of Marque"
 SHU_example_ba_bilge_water_desc: "Bilgewater captains respect profit more than ceremony. Imperial contracts and legal prizes can turn selected crews against our enemies."
 SHU_example_ca_bilge_water: "Break the Pirate Crews"
 SHU_example_ca_bilge_water_desc: "The reavers of Bilgewater threaten every honest route across the southern seas. A determined naval campaign will break their strongest crews."
 SHU_example_bb_bilge_water: "A Pact with Bilgewater"
 SHU_example_bb_bilge_water_desc: "Trade, docking rights, and a share of the spoils can secure a practical accord with the Serpent Isles."
 SHU_example_cb_bilge_water: "Rule the Serpent Isles"
 SHU_example_cb_bilge_water_desc: "Bilgewater's captains will accept imperial order only when our fleet leaves them no profitable alternative."
 SHU_total_war: "War for the Serpent Isles"
 SHU_total_war_desc: "Half-measures have failed. We will commit the legions and fleet to end Bilgewater's defiance."
 SHU_approach_aurma: "Open Talks with Aurma"
 SHU_approach_aurma_desc: "Aurma's islanders and sailors command valuable sea routes. We should decide whether they will join the empire by compact or by force."
 SHU_shuriman_ship_builders: "Shuriman Shipbuilders"
 SHU_shuriman_ship_builders_desc: "Marai craft, Aurman seamanship, and imperial resources will form a shipbuilding tradition worthy of a restored Shurima."
 SHU_fate_of_brackern: "The Fate of the Brackern"
 SHU_fate_of_brackern_desc: "Stories of ancient crystal guardians still surround the scarred western wastes. We must choose whether their legacy will be protected, studied, or consumed by imperial industry."
 SHU_no_more_hunger: "No More Hunger"
 SHU_no_more_hunger_desc: "The Sun Disc again draws water through the land. Irrigation, grain reserves, and fair distribution will ensure that no Shuriman settlement starves beneath its light."
 SHU_tribal_respect_desc: "Shurima's desert tribes endured while empires rose and fell. Respecting their customs will earn loyalty that decrees alone could never command."
 SHU_tribe_unity: "Unity of the Tribes"
 SHU_tribe_unity_desc: "Oasis clans, nomads, and settled communities will share a place in the restored realm without surrendering the traditions that carried them through the long interregnum."
 SHU_lion_riders: "Riders of the Desert Lions"
 SHU_lion_riders_desc: "Swift riders mounted and trained in the old Shuriman fashion will strike across the dunes before an enemy can prepare."
