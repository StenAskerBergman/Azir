################################### FOCUSES                     \n      §H§!

 # Tooltip and Ideas

 NAZ_basic_armed_forces: "Foundation of Armed Forces"
 NAZ_basic_armed_forces_desc: "The courage of a hunter deserves the support of a prepared fighting force. Gather our defenders' experience and turn it into lessons for the army we are building."

  # "Warrior Tradition"
 NAZ_warrior_tradition: "Tribal Traditions"
 NAZ_warrior_tradition_desc: "Nazumah's defenders inherit lessons won through courage and hardship. Bring more recruits into that tradition and turn its experience into stronger infantry training."

 NAZ_strengthen_the_hunters: "Strengthen the Hunters"
 NAZ_strengthen_the_hunters_desc: "Our hunters deserve formations built around their skills. Reinforce their specialist organization and improve the fighting strength, endurance, and mobility of our irregular troops."

 NAZ_universal_conscription: "Universal Conscription"
 NAZ_universal_conscription_desc: "The defense of our home cannot rest on a few celebrated fighters. Call more of our people into service and give Nazumah a broader reserve of defenders."

 NAZ_develop_special_units: "Develop Special Units"
 NAZ_develop_special_units_desc: "Specialized units can undertake missions that regular troops cannot, providing us with a crucial edge in unconventional and high-stakes scenarios."

 NAZ_modernize_warfare: "Modernize Warfare"
 NAZ_modernize_warfare_desc: "Modern warfare requires modern solutions. This focus will allow us to adopt the latest military technologies and strategies."

 NAZ_nations_best: "The Nation's Best"
 NAZ_nations_best_desc: "Those who defend Nazumah should know the value of the home behind them. Honor our finest fighters and strengthen their resolve in battles on our own soil."

 NAZ_utilize_our_strengths: "Utilize Our Strengths"
 NAZ_utilize_our_strengths_desc: "Whether our defense rests on veteran hunters or a broader levy, Nazumah's fighters have strengths worth developing. Put those lessons to work across the army, sharpening its attack and its ability to hold ground."

 NAZ_reform_the_conscription: "Reform Conscription"
 NAZ_reform_the_conscription_desc: "Public resolve must support the demands we place on our defenders. Rally Nazumah behind military service and extend recruitment where our existing obligations are still more limited."

 NAZ_eyes_on_the_imperialists: "Eyes on the Imperialists"
 NAZ_eyes_on_the_imperialists_desc: "An empire's methods deserve study even when its ambitions deserve resistance. Learn from its armies, fleets, and air forces so Nazumah can develop its own doctrines more readily."

 NAZ_encourage_local_arms_production: "Encourage Local Arms Production"
 NAZ_encourage_local_arms_production_desc: "Our defenders should not depend entirely on weapons made elsewhere. Expand arms production in the lands we hold and give Nazumah a stronger supply of its own."


 NAZ_the_roars_of_thunder: "The Roars of Thunder"
 NAZ_the_roars_of_thunder_desc: "Our workshops can help our defenders reach beyond the spear's length. Study artillery and anti-armor weapons, giving future designs a firmer foundation."

 NAZ_develop_indigenous_models: "Develop Indigenous Models"
 NAZ_develop_indigenous_models_desc: "A weapon should suit the hands and needs of those who carry it. Support the study of locally developed infantry arms rather than relying on every foreign design."

 NAZ_the_steel_lions: "The Steel Lions"
 NAZ_the_steel_lions_desc: "Give our armored ambitions a formation of their own. Establish the Steel Lions and raise a light-armored brigade in the capital, with the basic tank knowledge it needs."

 NAZ_warfare_from_afar: "Warfare from Afar"
 NAZ_warfare_from_afar_desc: "Artillery offers our hunters another way to bring force against an enemy. We will plan artillery support and additional gun battalions for the Eastern Hunters formation, without assuming that guns and crews are already available."

 NAZ_modern_infantry: "Modern Infantry"
 NAZ_modern_infantry_desc: "Our defenders need formations that can train and fight together. Establish a regular infantry organization and raise two equipped divisions in the capital."

 NAZ_pacify_the_countryside: "Pacify the Countryside"
 NAZ_pacify_the_countryside_desc: "To solidify our control over Nazumah, we must pacify the unruly elements within our borders, ensuring stability and security for our developmental plans."

 NAZ_army_modernization: "Army Modernization"
 NAZ_army_modernization_desc: "Our military requires modernization to meet the challenges of the modern world. This focus will boost our army's capabilities significantly."

 NAZ_mukden_military_academy: "Establish Military Academy"
 NAZ_mukden_military_academy_desc: "A modern army needs a modern military academy. By establishing a top-tier military education facility, we can ensure our officers are among the best trained in the world."

 NAZ_invite_foreign_investment: "Invite Foreign Investment"
 NAZ_invite_foreign_investment_desc: "By inviting foreign settlers and investors, we can boost our economy and improve our industrial capabilities significantly."

 # Updated Focus Names
 NAZ_develop_capitalstate: "Develop Capital State"
 NAZ_develop_capitalstate_desc: "Our hunters defend Nazumah; our workshops must help sustain it. Expand production in the capital so the city can support more of the work its future requires."

 NAZ_the_state_bank_of_nazumah: "The State Bank of Nazumah"
 NAZ_the_state_bank_of_nazumah_desc: "Nazumah's savings should serve Nazumah's needs. Establish a state bank to put more resources behind productive work and strengthen output in our workshops."

 NAZ_pave_the_roads: "Pave the Roads"
 NAZ_pave_the_roads_desc: "A load that cannot reach its destination is little use to anyone. Improve routes through the lands we administer so goods and supplies can move more readily."

 NAZ_the_steam_locomotive: "The Steam Locomotive"
 NAZ_the_steam_locomotive_desc: "A train can carry what many carts would struggle to move. Acquire locomotives and the knowledge to operate them, giving Nazumah another means to sustain its supplies."

 NAZ_the_nazuman_regional_development_fund: "The Regional Development Fund"
 NAZ_the_nazuman_regional_development_fund_desc: "Nazumah's state bank should consider the needs of settlements beyond the capital. We will make regional construction and infrastructure projects a priority for future investment."

 NAZ_exploit_national_resources: "Exploit National Resources"
 NAZ_exploit_national_resources_desc: "What lies beneath our land deserves careful study. Improve our knowledge of excavation so future workings can make better use of the resources available to us."


 NAZ_the_nazuman_industrial_fund: "The Industrial Fund"
 NAZ_the_nazuman_industrial_fund_desc: "Investment should leave useful work behind it. Expand workshops in the lands we hold, giving Nazumah more capacity to meet its own needs."

 NAZ_use_the_natural_harbors: "Use the Natural Harbors"
 NAZ_use_the_natural_harbors_desc: "If we hold a stretch of coast, its sheltered waters can serve more than passing vessels. Develop a dockyard there and put that harbor to work for Nazumah."

 NAZ_the_capital_city_airport: "The Capital City Airport"
 NAZ_the_capital_city_airport_desc: "The sky offers a route beyond the roads below. Expand the capital's airfield and acquire transport aircraft to support the movement of supplies."


 NAZ_improved_irrigation_systems: "Improved Irrigation Systems"
 NAZ_improved_irrigation_systems_desc: "Nazumah's settlements depend on making careful use of the water they have. We will plan improved irrigation as part of wider local development, preparing the ground for construction and future expansion."

 NAZ_the_nazuman_air_fleet: "The Air Fleet"
 NAZ_the_nazuman_air_fleet_desc: "Aircraft must be understood before they can be trusted with our defense. Study new designs across the classes of aircraft and build the experience to operate them."

 NAZ_state-funded_projects: "State-Funded Projects"
 NAZ_state-funded_projects_desc: "Public investment should reach the building site, not end at the council table. Organize state-backed construction so the work Nazumah needs can proceed more quickly."

 NAZ_the_grand_university_of_capital: "The Grand University of the Capital"
 NAZ_the_grand_university_of_capital_desc: "Our city should give its scholars room to pursue more than one question at a time. Expand higher learning in the capital and strengthen Nazumah's capacity for research."

 NAZ_Friend_or_Foe: "Friend or Foe"
 NAZ_Friend_or_Foe_desc: "Nazumah must decide how to face the powers beyond its walls. Give our leaders a clear voice as they weigh cooperation against resistance."

 NAZ_Friend_of_Shurima: "Friend of Shurima"
 NAZ_Friend_of_Shurima_desc: "Friendship with Shurima may serve Nazumah better than suspicion alone. Improve relations with its government, knowing that this choice will deepen our differences with Xerath."

 NAZ_Recognize_Azirs_Sovereignty: "Recognize Azir's Sovereignty"
 NAZ_Recognize_Azirs_Sovereignty_desc: "Nazumah will recognize Azir's claim to rule Shurima as the basis for closer relations. This declaration will strengthen our political position and our regard for Shurima, while deepening our hostility toward Xerath."

 NAZ_Economic_Alliance: "§R Red Alliance§!"
 NAZ_Economic_Alliance_desc: "Economic cooperation should strengthen the work we can do at home. Expand civilian production in the lands we administer, giving Nazumah more capacity to meet its needs."

 NAZ_Foe_of_Shurima: "Foe of Shurima"
 NAZ_Foe_of_Shurima_desc: "Nazumah will not quietly accept Shurima's claims. Take a firmer stand against its government, knowing that this opposition will improve relations with Xerath while worsening them with Shurima."

 NAZ_Declare_Independence: "Declare Independence"
 NAZ_Declare_Independence_desc: "Nazumah must speak for its own future. If we remain subject to a foreign throne, we may demand recognition of our independence; if we are already free, we will reaffirm that freedom."

 NAZ_Fortify_the_Borders: "Fortify the Borders"
 NAZ_Fortify_the_Borders_desc: "When a hostile neighbor threatens our frontier, courage should have shelter behind it. Build defenses along the qualifying borders of our lands and those of our subjects or faction partners."

 NAZ_Independent_Economy: "Independent Economy"
 NAZ_Independent_Economy_desc: "Our freedom of action depends on what we can supply ourselves. Expand arms production in the lands we administer so Nazumah's defenders have a stronger base at home."

 NAZ_National_Pride: "National Pride"
 NAZ_National_Pride_desc: "Nazumah's strength rests on people who believe their home is worth defending. Honor what binds us together and restore confidence in the future we share."

 NAZ_War_Preparations: "War Preparations"
 NAZ_War_Preparations_desc: "Our defenders deserve weapons suited to the struggle ahead. Accelerate the study of infantry arms and prepare better designs for future production."

 NAZ_hunters_path: "Hunter's Path"
 NAZ_hunters_path_desc: "Nazumah's hunters have earned a voice in the future they defend. Rally our leaders and our people behind a course shaped by their courage and experience."

 NAZ_royal_subject: "Royal Subject"
 NAZ_royal_subject_desc: "Subject status need not silence Nazumah's voice. Seek greater room to govern our own affairs and strengthen confidence at home while we remain under an overlord."

 NAZ_political_equals: "Political Equals"
 NAZ_political_equals_desc: "An independent Nazumah should speak with the confidence of an equal. Strengthen our political authority and unite our people behind that standing."

 NAZ_the_capital_railroad: "The Capital Railroad"
 NAZ_the_capital_railroad_desc: "Where our capital borders land held by our overlord, a rail connection can bring the two closer. Build that link when the geography allows it, supporting the movement of supplies."

 NAZ_invite_foreign_settlers: "Invite Foreign Settlers"
 NAZ_invite_foreign_settlers_desc: "Having recognized a Shuriman claim to rule, we will welcome settlers who can contribute to Nazumah's future. Their arrival will bring more people into our available manpower and support further development of the capital where its present scale allows."

 NAZ_countryleader: "Country Leader"
 NAZ_countryleader_desc: "An independent Nazumah needs leadership ready to stand beside its defenders. Give our country's leader a place in army command, or sharpen that commander's attack skills if they already serve as a field marshal."

 NAZ_securing_the_future: "Securing the Future"
 NAZ_securing_the_future_desc: "A safer future begins with neighbors who have reason to trust us. Strengthen mutual goodwill around Nazumah and give our leaders more authority to pursue cooperation."

 NAZ_improving_the_educational_system: "Improving the Educational System"
 NAZ_improving_the_educational_system_desc: "Nazumah's scholars need institutions that can preserve practical knowledge and pass it to the next generation. Improving education will support research and reassure the people that their future is being prepared for."

 NAZ_construct_great_monuments: "Construct Great Monuments"
 NAZ_construct_great_monuments_desc: "Our capital should honor the people whose courage sustains Nazumah. Raise monuments to that shared pride and strengthen confidence in the home we defend."

 NAZ_the_nazuman_volunteer_force: "The Volunteer Force"
 NAZ_the_nazuman_volunteer_force_desc: "An independent Nazumah can choose where its hunters offer their service abroad. We will permit volunteer deployments and ease the restrictions on sending a force, while leaving the decision to commit our troops in our own hands."

 NAZ_military_cooperation: "Military Cooperation"
 NAZ_military_cooperation_desc: "Our commanders can learn more by working together than by guarding every lesson as their own. Share military experience and strengthen the command resources available to Nazumah's defenders."

 NAZ_that_which_is_rightfully_ours: "That Which Is Rightfully Ours"
 NAZ_that_which_is_rightfully_ours_desc: "An independent Nazumah must decide which claims it is prepared to defend. We will strengthen the government's authority and, for a time, make future war goals quicker to justify and less disruptive to international tensions."

 NAZ_commandos: "Commandos"
 NAZ_commandos_desc: "Some duties demand more than the training of a regular formation. Develop special-forces knowledge and support further study so Nazumah can prepare specialists of its own."

 NAZ_a_jagged_alliance: "A Jagged Alliance"
 NAZ_a_jagged_alliance_desc: "Nazumah may need partners without surrendering its right to choose them. We will make it easier to seek a place in a faction when circumstances demand one, while weighing the obligations that membership would bring."

 NAZ_observe_and_learn: "Observe and Learn"
 NAZ_observe_and_learn_desc: "Our commanders should return from cooperation with lessons they can use. Study the experience of armies, fleets, and air forces to develop Nazumah's doctrines more readily."

 NAZ_foreign_investors: "Foreign Investors"
 NAZ_foreign_investors_desc: "Outside investment should leave useful skills and production behind it. Support industrial study and establish a new workshop where the lands we control have room for one."

 NAZ_research_exchange_programs: "Research Exchange Programs"
 NAZ_research_exchange_programs_desc: "Shared study can benefit both Nazumah and the power above it. Exchange industrial and electronic knowledge with our overlord, helping both sides develop new technologies more readily."


 NAZ_nazuman_loyalist_advisors: "Loyalist Advisors"
 NAZ_nazuman_loyalist_advisors_desc: "Those who advise our government should keep Nazumah's interests foremost. Strengthen their voice in our affairs and press for greater autonomy within our subject relationship."

 NAZ_lay_claim_to_the_lowlands: "Lay Claim to the Lowlands"
 NAZ_lay_claim_to_the_lowlands_desc: "An independent Nazumah will press its territorial claims beyond its present borders. We will prepare demands against outside rulers in the designated lowland region, without treating a claim as possession."

 NAZ_push_for_the_highlands: "Claims toward Ixaocan"
 NAZ_push_for_the_highlands_desc: "Nazumah's expansion policy now looks toward the region around Ixaocan. We will press claims to land held by others and prepare demands against independent rulers whose capitals lie there."

 NAZ_secure_the_shakkal: "Secure the Shakkal"
 NAZ_secure_the_shakkal_desc: "Nazumah will assert claims in the designated Shakkal region and prepare demands against independent rulers based there. Securing the land will still require more than a declaration of our intentions."

 NAZ_rallying_the_nazuman_people: "Rallying the People"
 NAZ_rallying_the_nazuman_people_desc: "Nazumah's independence rests on more than the hunters already under arms. Rally the settlements behind our defense so a larger share of the people can answer the call to service."

 NAZ_the_capital_school_of_technology: "The Capital School of Technology"
 NAZ_the_capital_school_of_technology_desc: "Our students should have the means to turn practical questions into new knowledge. Expand technical study in the capital and give Nazumah greater capacity for research."

 NAZ_promote_nazumah_nationalism: "Promote Nationalism"
 NAZ_promote_nazumah_nationalism_desc: "Our people should not lose their voice under another power. Rally confidence in Nazumah's own future and press for greater autonomy in our affairs."

 NAZ_crowning_of_the_hunter: "Crowning of the Hunter"
 NAZ_crowning_of_the_hunter_desc: "Nazumah's hunters have carried the ambitions of an independent realm beyond its old borders. We will seek a settlement that treats the conquered lands as part of our homeland, rather than promising a new ruler merely through ceremony."

 NAZ_proclaim_Kingdom_of_Nazumah: "The Kingdom Question"
 NAZ_proclaim_Kingdom_of_Nazumah_desc: "An independent Nazumah must decide what authority its growing realm should claim. We will consider a kingdom rooted in our own traditions before committing to a wider imperial ambition."

 NAZ_Big_Game: "Big Game"
 NAZ_Big_Game_desc: "Our hunters will prepare for a campaign that demands more than courage alone. Better infantry weapons, additional recruits and shared military experience will support the effort as we rally public backing for the struggle."
 NAZ_regional_cooperation: "Nazumahn Regional Cooperation"

 NAZ_Test_Focus: "Test Focus"
 NAZ_Test_Focus_desc: "A test focus to ensure functionality and performance of the focus tree."

 azirs_rule_accepted: "Azirs Rule Recognized"
 azirs_reign_recognized: "Azirs Reign Recognized"
 sivirs_sovereignty_recognized: "Sivirs Sovereignty Recognized"


 NAZ_Imperial_Alliance: "§G Imperial Alliance§!"
 NAZ_Imperial_Alliance_desc: "Recognition should be followed by dependable cooperation. Strengthen Nazumah's political confidence and its goodwill toward Shurima along the imperial route."

 NAZ_Republican_Alliance: "§C Republican Alliance§!"
 NAZ_Republican_Alliance_desc: "Our republican course needs steady relations as well as conviction. Build confidence at home and strengthen goodwill toward Shurima without surrendering Nazumah's voice."

 NAZ_Recognize_Sivirs_Sovereignty: "Recognize Sivir's Sovereignty"
 NAZ_Recognize_Sivirs_Sovereignty_desc: "Nazumah will recognize Sivir's claim to rule Shurima and pursue cooperation on that basis. Our declaration will strengthen political authority and our regard for Shurima, while setting us further against Xerath."

 NAZ_Common_Cause: "Common Cause"
 NAZ_Common_Cause_desc: "Those who resist Shurima's claims have reason to make their voices heard. Commit Nazumah to that opposition and strengthen our leaders' resolve, even as relations with Shurima worsen."

 NAZ_Military_Cooperation: "Military Cooperation"
 NAZ_Military_Cooperation_desc: "Cooperation should leave our defenders better prepared. Support armored research and expand arms production in the lands we hold, giving Nazumah more means to sustain its forces."

 NAZ_Air_Force: "Air Force"
 NAZ_Air_Force_desc: "Nazumah's ambitions in the air need a stronger industrial foundation. Where we hold land for new military workshops, we will expand production and support armor research as part of that broader preparation."

 NAZ_Navy_Cooperation: "Naval Force"
 NAZ_Navy_Cooperation_desc: "Cooperation beyond our borders should strengthen Nazumah's own workshops. We will expand military production on controlled land and study armor while laying the foundations for our wider defense ambitions."

 NAZ_collective_farms: "Collective farms"
 NAZ_collective_farms_desc: "Working the land together should make room for a stronger local economy. Expand capacity for development in the core lands we fully control, giving Nazumah more space to build."





