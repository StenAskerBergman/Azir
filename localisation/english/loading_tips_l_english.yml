l_english:
 LOADING_TIP_0:0 "Kings demand you kneel before their heirlooms and unearned titles. Noxus wants you to stand so you can be reforged in a glory shared by all. \n- Darius"
 LOADING_TIP_1:0 "No more kings! No more queens! No more Mageseekers! It all ends now!\n- Sylas"
 LOADING_TIP_2:0 "You need not follow, but you will witness.\n- Azir"
 LOADING_TIP_3:0 "I have found my limit a thousand times, and still I press further.\n- Pantheon"
 LOADING_TIP_4:0 "All who live will serve.\n- Viego"
 LOADING_TIP_5:0 "I AM THE WORLD ENDER!\n- Aatrox"
 LOADING_TIP_6:0 "Where they fall, freedom grows.\n- Irelia"
 LOADING_TIP_7:0 "Someday, all this will be Ixaocan. A glorious empire, with an empress to fit.\n- Qiyana"
 LOADING_TIP_8:0 "All your lives, you have chased your own destruction. At long last, I am here.\n- Bel'Veth"
 LOADING_TIP_9:0 "When going is tough, call on Braum!\n- Braum"
 LOADING_TIP_10:0 "The only way to defeat a superior enemy is to stop at nothing. To become what they fear.\n- Silco"
 LOADING_TIP_11:0 "I’ve seen this power in the wrong hands. It corrupts, consumes, lays waste to civilizations.\n- Heimerdinger"
 LOADING_TIP_12:0 "Bilgewater is mine and mine alone.\n- Gangplank"
 LOADING_TIP_13:0 "Ok.\n- Rammus"
