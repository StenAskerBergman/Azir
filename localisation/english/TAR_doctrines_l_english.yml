l_english:
 TAR_solari_doctrine: "The Sunward Charter"
 TAR_solari_doctrine_desc: "The Sunward Temple funds arms production through temple workshops and projects authority abroad through the Ra’Horak. Civilian construction bears the cost."
 TAR_solari_mandate_vote: "Ratify the Temple Mandate"
 TAR_solari_mandate_vote_desc: "Grant the temple authority over the levy at the cost of dissent on the slopes."
 TAR_solari_law: "Levy the Temple Forges"
 TAR_solari_law_desc: "Temple forges put arms production first. The levy postpones civilian works and leaves less room for independent workshops."
 TAR_solari_overture: "Offer Pilgrim Escorts"
 TAR_solari_overture_desc: "The Ra’Horak can escort pilgrims through the foothills, but every escort takes warriors away from the mountain."
 TAR_solari_law_spirit: "Temple Forge Levy"
 TAR_solari_law_spirit_desc: "Temple forges put arms production first. The levy postpones civilian works and leaves less room for independent workshops."
 TAR_doctrines.1.t: "Offer Pilgrim Escorts"
 TAR_doctrines.1.d: "The Ra’Horak offer escorts for pilgrim caravans. The escort can bring travelers home safely and extend the reach of Solari authority."
 TAR_doctrines.1.a: "Accept Targon’s offer"
 TAR_doctrines.1.b: "Decline the offer"
 TAR_lunari_doctrine: "The Moonlit Compact"
 TAR_lunari_doctrine_desc: "Diana brings the sanctuary network into government. Hidden observatories pool knowledge and night guides extend Lunari reach while secrecy slows military coordination."
 TAR_lunari_mandate_vote: "Recognize the Sanctuary Councils"
 TAR_lunari_mandate_vote_desc: "Recognize the hidden congregations and spend political capital integrating their delegates."
 TAR_lunari_law: "Fund the Hidden Observatories"
 TAR_lunari_law_desc: "Lunari sanctuaries pool their star charts and moonstone studies. Keeping the chain of shelters secret slows the passage of military orders."
 TAR_lunari_overture: "Offer Night Shelters"
 TAR_lunari_overture_desc: "Night guides offer shelter across the foothills. The council must reveal some of its routes and spend political capital protecting those who maintain them."
 TAR_lunari_law_spirit: "Hidden Observatory Network"
 TAR_lunari_law_spirit_desc: "Lunari sanctuaries pool their star charts and moonstone studies. Keeping the chain of shelters secret slows the passage of military orders."
 TAR_doctrines.2.t: "Offer Night Shelters"
 TAR_doctrines.2.d: "Lunari guides offer travelers from across the border passage through a chain of night shelters. Accepting helps the travelers and exposes a few sanctuaries to outsiders."
 TAR_doctrines.2.a: "Accept Targon’s offer"
 TAR_doctrines.2.b: "Decline the offer"
 TAR_rakkor_doctrine: "The Oath of the Ranges"
 TAR_rakkor_doctrine_desc: "Rakkor assemblies control local musters, caches and training. Their companies can operate on leaner supply, but must rotate back to village duties."
 TAR_rakkor_mandate_vote: "Convene the Village Assemblies"
 TAR_rakkor_mandate_vote_desc: "Give the villages a voice in the muster. Rival congregations lose the right to dictate its terms."
 TAR_rakkor_law: "Muster the Pass Companies"
 TAR_rakkor_law_desc: "Village assemblies take charge of musters and train companies to sustain themselves on scattered caches. Rotating the companies through village service slows large offensives."
 TAR_rakkor_overture: "Offer Joint Pass Drills"
 TAR_rakkor_overture_desc: "Joint drills spread Rakkor mountaincraft to the foothills. Instructors will be away from the villages that raised them."
 TAR_rakkor_law_spirit: "Pass Company Muster"
 TAR_rakkor_law_spirit_desc: "Village assemblies take charge of musters and train companies to sustain themselves on scattered caches. Rotating the companies through village service slows large offensives."
 TAR_doctrines.3.t: "Offer Joint Pass Drills"
 TAR_doctrines.3.d: "Rakkor companies propose joint mountain drills with troops from across the border. Both sides can learn from the exercise, though the instructors will leave their villages short-handed."
 TAR_doctrines.3.a: "Accept Targon’s offer"
 TAR_doctrines.3.b: "Decline the offer"
 TAR_reopen_charter: "Reopen the Mountain Charter"
 TAR_reopen_charter_desc: "Revoke the active law and return the balance to the assembly. The resulting deadlock suspends mandate votes and new laws for 90 days. The existing government and completed focus branch stay in place."

 TAR_purists: "Solari Purist"
 TAR_solari: "Solari"
 TAR_solari_theocracy: "Solari Targon"
 TAR_solari_theocracy_DEF: "Solari Targon"
 TAR_solari_theocracy_ADJ: "Solari"
 TAR_eclipse_decision: "The Eclipse Decision"
 TAR_eclipse_decision_desc: "The Lunari can call the mountain communities to arms. Hear Diana and Rahvun, or leave their banners furled and begin Rebuild Targon."
 TAR_can_begin_eclipse: "Targon can hold the Eclipse council"
 TAR_can_begin_eclipse_tt: "Diana and Rahvun must both be in independent Targon at peace. Targon must control its capital and another owned core state. Any Rakkor delegation must have returned, and rebuilding must not have begun."
 TAR_eclipse_council_open: "The Eclipse council is in session"
 TAR_eclipse_rally_underway: "Rakkor delegates are meeting with the clans"
 TAR_eclipse.1.t: "The Eclipse Council"
 TAR_eclipse.1.d: "Diana calls for the Lunari to rise. Rahvun orders the Solari guard to stand its ground. Beyond the temples, the Rakkor clans have yet to say how many warriors they will send. Targon can still turn to rebuilding in peace."
 TAR_eclipse.1.rally: "Give the Rakkor clans time to answer."
 TAR_eclipse_rally_tt: "Wait 30 days before calling the council again. Rakkor support raises the Lunari share of the forces at the split from 35% to 50%. Peaceful rebuilding remains available."
 TAR_eclipse.1.lunari: "Take the field with Diana and the Lunari."
 TAR_eclipse_lunari_tt: "Begin the civil war as Diana's Lunari against Rahvun's Solari. The Lunari start with a 35% share of the forces, or 50% after the Rakkor delegation returns."
 TAR_eclipse.1.solari: "Stand with Rahvun and the Solari guard."
 TAR_eclipse_solari_tt: "Begin the civil war as Rahvun's Solari against Diana's Lunari. The Solari start with a 65% share of the forces, or 50% after the Rakkor delegation returns."
 TAR_eclipse.1.leave: "Let the council adjourn."
 TAR_eclipse.2.t: "The Standards Come Down"
 TAR_eclipse.2.solari: "The Lunari armies have laid down their weapons. Begin Rebuild Targon, then decide whether the survivors will have a place in the settlement or the Solari priesthood will rule alone."
 TAR_eclipse.2.lunari: "The last Solari garrison has fallen silent. Begin Rebuild Targon, then decide whether to reconcile the two faiths or place the mountain's future in Lunari hands."
 TAR_eclipse.2.a: "Call the mountain councils."
 TAR_eclipse_solari_victory: "The Solari won the Eclipse War"
 TAR_eclipse_lunari_victory: "The Lunari won the Eclipse War"
 TAR_eclipse_solari_side: "Fighting for the Solari in the Eclipse War"
 TAR_eclipse_lunari_side: "Fighting for the Lunari in the Eclipse War"
