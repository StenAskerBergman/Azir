 VOI_apex_hunter: "Apex Hunter"
 VOI_apex_hunter_TT: "Unlocks Apex " # Unlock: Cat_vs_Bug_Category
 VOI_apex_hunter_CR: "Strengthens our army's experience in service of the queen."
 VOI_apex_hunter_desc: "We will turn to Kha'Zix as the cult seeks a more ruthless approach to its campaigns. This will open the way to appoint him as an adviser to our cause."

 VOI_voidborne_acoustics: "Voidborne Acoustics"

 VOI_unseen_threats: "Unseen Threats"

 VOI_our_army: "Our Army"

 VOI_remora_reborn: "Our Nature"

 VOI_our_world: "Our World"

 VOI_new_world: "New World... "
 VOI_new_world_desc: "The cult will devote more scholars and resources to the future it claims the Void will bring. A wider research effort will support that ambition and strengthen the authority directing it."

 VOI_Expand_the_Horde: "Expand the Horde"
 VOI_Expand_the_Horde_desc: "The cult will strengthen the army that carries its cause beyond the ruins. A more cohesive force and greater capacity for specialist troops will give our followers the means to press their attacks."

 VOI_Void_Invasion: "Void Invasion"
 VOI_Void_Invasion_desc: "The cult will rally its followers for the offensive it has long promised. Greater resolve and military experience will prepare our forces for the campaigns ahead."

 VOI_shifting_sands: "Shifting Sands"
 VOI_shifting_sands_TT: "Shifting Sands"
 VOI_shifting_sands_desc: "Rek'Sai's predatory instincts have a place in the cult's campaigns. Opening her adviser role will let us draw on the Void Burrower's hunting expertise, if she remains with our country."

 # First Draft
 # VOI_shifting_sands_desc: "We must summon Rek'sai, with her we can extend our reach across the entire deserts, using her children as a testing ground for our new Void-powered technologies..."


 VOI_Subjugate_the_Resisters: "Subjugate the Resisters"
 VOI_Subjugate_the_Resisters_desc: "The cult will demand obedience from those who reject its promise. Consolidating authority, rallying support for its campaigns, and expanding its research effort will prepare the faithful to press their cause."

 # Not Used
 VOI_Domination_of_shifting_sands: "Domination of Shifting Sands"
 VOI_Domination_of_shifting_sands_desc: "Extend our reach across the deserts, using them as a testing ground for our new Void-powered technologies."

 VOI_The_Voids_Influence: "The Void's Influence"
 VOI_The_Voids_Influence_desc: "The remnants of Icathia face a choice between resisting the Void and surrendering to its promise. We must confront that division before rival voices draw our people further apart."

 VOI_Crushed_Resistance: "Crushed Resistance"
 VOI_Crushed_Resistance_desc: "The Resistance Movement is stunned that so many of our followers blindly trust Malzahar knowing our history with the void, thereby leaving our nation for a better life..."

 VOI_Embrace_the_Void: "Embrace the Void"
 VOI_Embrace_the_Void_desc: "We will cast our lot with the Void and silence those who resist its promise. Its influence can swell our ranks and strengthen our attacks while we hold its foothold, but this surrender will deepen unrest and strain our supply reach."


 VOI_Void_Prophet: "Void Prophet"
 VOI_Void_Prophet_desc: "Those who embraced the Void need a voice to give their surrender a purpose. By elevating the prophet's message, we will rally the faithful around a single promise of salvation."

 VOI_Voidborn_Soldiers: "Voidborn Soldiers"
 VOI_Voidborn_Soldiers_desc: "The cult will organize its army around the strength it attributes to the Void. Greater cohesion, stronger attacks, and a larger place for specialist troops will prepare our forces for war."

 VOI_Void_Rituals: "Void Rituals"
 VOI_Void_Rituals_desc: "The faithful will bind themselves to the Void through rites of submission. These observances will strengthen the authority of the cult, even as they unsettle those who still cling to mortal life."

 VOI_Spread_the_Void: "Spread the Void"
 VOI_Spread_the_Void_desc: "The faithful must prepare to carry their cause beyond the ruins. We will sharpen their military resolve for the struggle ahead, seeking to spread what they believe is salvation."

 VOI_Void_Empowerment: "Void Empowerment"
 VOI_Void_Empowerment_desc: "Our leaders will invoke the Void's promise to demand greater discipline from their followers. The cult will consolidate its authority and prepare its commanders for the campaigns to come."

 VOI_Rift_Rapture: "Rift Rapture"
 VOI_Rift_Rapture_desc: "While we hold the rift's foothold, the faithful will rally around the promise of the Void. Greater resolve, faster planning, and swifter armies will prepare them for the struggle ahead."

 VOI_Her_Arrival: "Her Arrival"
 VOI_Her_Arrival_desc: "Belveth our Queen will soon arrive... Our army must match her expectations"

 VOI_our_queen: "Our Queen"
 VOI_our_queen_desc: "The faithful will organize their military efforts around the queen they revere. While we hold the rift's foothold, commanders will prepare to carry that cause into the struggle ahead."

