 VOI_our_war: "Our War"
 VOI_our_war_TT: "For Our Final Endevour has begun..."
 VOI_our_war_desc: "The cult will demand wider conscription and the full mobilization of the economy for its campaigns. We will rally support for war and reinforce the authority directing production where total mobilization is already established."

