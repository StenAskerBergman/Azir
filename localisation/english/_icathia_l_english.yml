 icathia.1.t: "Our Last Hope!"
 icathia.1.desc: "Our royal line may yet survive through Lupé's family: Milio, a young boy in Ixtal, is believed to carry the Axamuk inheritance. Neither he nor the Ixtali authorities know of this claim; bringing him to Icathia could give our scattered people a symbol around which to rebuild."

 icathia.1.a: "Make finding Milio a priority."
 icathia.1.b: "The search for Milio can wait."
 icathia.1.c: "We must bring Milio home urgently."
#
# icathia.1.a: "We must Recover Prince Axamuk Ilio!"


 # icathia.1.a.tt: "Recovering Milio As Prince can be done via §OAgency§!, §CDiplomatic Request§!, or Via §GOperations§!!"
 icathia.1.a.tt: "Affirms our intention to seek Milio. Makes no immediate change."

 icathia.1.b.tt: "Defers our intention to seek Milio. Makes no immediate change."

 icathia.1.c.tt: "Calls for an urgent search for Milio. Makes no immediate change."


 VOI_Ixtal_Recovery_description: "Its time we recover our bloodlines, the last royal bloodlines appears to still exist... Lupé blood line, and in it a young prince exists in Ixtal... unaware of his families secret heritage. His, current name he goes by is Milio. \n We must recover Milio, he is our last hope to restore icathian rule! go! Get Prince Axamuk Ilio to take our current throne!"


 icathia.2.t: "The Remnants of a Void World"
 icathia.2.desc: "The Void has left Icathia in ruins. Malzahar's followers gather around the Rupture while those who resist rally around the old city. War between them is now inevitable. Choose which side to lead when the country breaks apart. Those who seek containment and a place for the Void's survivors will fight with the Icathians, whose traditionalists and reformists must still settle their differences."

 icathia.2.a: "Resist the Void's Corruption"

 icathia.2.b: "Succumb to the Void's Influence"
 icathia.7.t: "The Unfinished Settlement"
 icathia.7.desc: "The Void Followers have been defeated, but the alliance that stood against them is already fraying. Traditionalists demand the return of the old order. Reformists insist that victory must bring a different government. We have 180 days to restore public confidence or revive the Grand Wizard Council before either side takes up arms."
 icathia.7.a: "We must settle this while we still can."
 icathia.8.t: "The Icathian Coalition Breaks"
 icathia.8.desc: "With the common enemy gone and no settlement in place, the dispute over Icathia's future has returned to the streets. Rival leaders have called their supporters to arms. The coalition that won the war has split."
 icathia.8.a: "Icathia faces another war."
