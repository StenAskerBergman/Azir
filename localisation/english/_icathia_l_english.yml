 VOI_Mage_King: "Mage King"
 VOI_Mage_King_desc: "Those who resist the Void will look to Icathia's tradition of mage rule for a renewed sense of purpose. We will strengthen the authority of that cause and expand the scholarly work needed to rebuild our future."

 VOI_law_university: "Open University"
 VOI_law_university_desc: "With Zilean among us, we can give Icathia's scholars a wider place in the work of recovery. The university will expand our research capacity and support faster study for the future we still hope to build."

 Icathian_agriculture_desc: "The agricultural capabilities of Icathia are essentially nonexistent due to its current state. The land is a desolate wasteland, heavily influenced by the catastrophic release of the Void. This devastation left the region barren and uninhabitable, making traditional farming and agriculture impossible. The soil is likely contaminated, and the environment is hostile, with remnants of the Void posing continual threats to any attempts at cultivation or habitation."

 Icathian_wasteland: "The current state of Icathia is one of desolation and ruin. After its catastrophic fall, triggered by the release of the Void to counter Shurima's Ascended Host, the region became a barren wasteland. The land is now largely uninhabitable, marked by the remnants of ancient battles and the pervasive influence of the Void."

 #
 VOI_pacify_our_neightbours: "Reshape Our Image"
 VOI_pacify_our_neightbours_decs: "It's time we reshape our image to the world so people understand icathia is safe again!"

 VOI_pacify_the_countryside: "Pacify the Countryside" # Remove all the remenents of a resistance - Wipe out any and all inhabitants
 VOI_pacify_the_countryside_desc: "The cult regards resistance beyond the towns as a challenge to its authority. We will make imposing obedience on the countryside a priority, though declaring that purpose does not itself secure the land."
 VOI_pacify_the_countryside_effect_tooltip: "Establishes the cult's countryside pacification policy."

 VOI_Shadow_War: "Shadow War"
 VOI_Shadow_War_desc: "The cult must prepare the realm for the war it expects. We will rally support where resolve is weak, mobilize the economy where it is ready, or strengthen our authority if war production is already established."

 VOI_void_containment: "Void Containment"
 VOI_void_containment_desc: "Icathia cannot rebuild while ignoring the threat beneath its ruins. We will place containment at the center of public policy and weigh how best to protect the survivors without repeating the ambitions that brought disaster."

 VOI_assertiveness: "Assertiveness" # Make a powerful Ally and Join their faction!
 VOI_assertiveness_desc: "Survival must not leave Icathia voiceless. We will rally support for a firmer stance toward outside powers and prepare our government to defend the country's interests."

 VOI_obedience: "Obedience" # Accept our current cards, become a obedient vassel state
 VOI_obedience_desc: "Icathia needs time to recover before it can challenge stronger powers. A policy of deference will reassure those who fear another ruinous confrontation and give our government room to rebuild its authority."

 VOI_revive_the_grand_wizard_council: "Revive the Grand Wizard Council"
 VOI_revive_the_grand_wizard_council_desc: "Icathia's restoration needs a council able to turn competing counsel into a common policy. The revived assembly will strengthen political coordination and bring scholarly discipline to military planning and doctrine."

 VOI_The_Man_Without_a_Weapon: "The Man Without a Weapon" # Recover Jax
 VOI_The_Man_Without_a_Weapon_desc: "Jax carries a lamppost into battle. He can show the Resistance how to hold a narrow approach, fight with whatever is at hand, and put its scarce weapons to better use."

 VOI_Zilean: "Contact Zilean"
 VOI_Zilean_desc: "Icathia will seek Zilean's counsel and place greater weight on the knowledge preserved by its scholars. Expanding our research effort will help the resistance look beyond immediate survival."

 VOI_The_Man_Without_A_Daughter: "Talk to a Father"  # Talk to Kassadin - Hire Kassadin
 VOI_The_Man_Without_A_Daughter_desc: "We will seek Kassadin's support for the resistance and keep open the hope of speaking with his daughter. This effort will strengthen our resolve and broaden the work devoted to Icathia's recovery."

 VOI_purple_meat: "Debate the Price of Survival"

 VOI_talk_to_a_daughter: "Talk to a Daughter"
 VOI_talk_to_a_daughter_desc: "Kassadin can follow the tunnels beneath the Rupture, but Kai'Sa needs a reason to come back. With settlers returning and containment under way, he can show her what there is to defend. If we chose the Hybrid Path, he can also promise her a place among us, living armor and all."

 VOI_Resistance_Fighters: "Resistance Fighters"
 VOI_Resistance_Fighters_desc: "Icathia needs willing recruits and commanders who understand the struggle for survival. We will gather more people into the resistance and improve our army's experience without surrendering our hope of a mortal future."


 VOI_Ancient_Icathian_Knowledge: "Ancient Icathian Knowledge"
 VOI_Ancient_Icathian_Knowledge_desc: "The knowledge preserved from old Icathia must serve the living. By studying it alongside our resistance efforts, we can advance the industrial research needed to rebuild."

 VOI_Cleanse_the_Corruption: "Cleanse the Corruption"
 VOI_Cleanse_the_Corruption_desc: "We will reaffirm our rejection of the Void and steady those working to rebuild Icathia. Renewed public confidence will strengthen the resistance, even while the danger beyond our settlements remains."

 VOI_Restoration_of_Icathia: "Restoration of Icathia"
 VOI_Restoration_of_Icathia_desc: "With the old city secured, we will make it the capital of a restored Icathia and expand its civilian workshops. A surviving mage or royalist majority may shape the government as our people regain confidence in a future of their own."

 VOI_Resist_the_Void: "Resist the Void"
 VOI_Resist_the_Void_desc: "Icathia's survivors will refuse the Void's claim upon their future. We will organize resistance forces where we still hold secure ground and rally our people to defend mortal life."

 VOI_Seek_the_Ancient_Tombs: "Seek the Ancient Tombs"
 VOI_Seek_the_Ancient_Tombs_desc: "Icathia's burial sites may preserve knowledge that the living can still use. We will organize their study to support industrial research and draw practical experience from work among the ruins."

 VOI_Uncover_Lost_Secrets: "Uncover Lost Secrets"
 VOI_Uncover_Lost_Secrets_desc: "The fragments recovered from old Icathia deserve sustained study. We will expand our scholarly effort and strengthen the authority supporting it, seeking knowledge useful to the realm's recovery."

