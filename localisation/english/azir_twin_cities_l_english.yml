l_english:
 azir_sp_plt_hexlyene_caliver: "Reopen the Hexlyene Designs"
 azir_sp_plt_hexlyene_caliver_desc: "The Wardens once commissioned a hex-powered caliver. Its designs have been locked away ever since. The Horological Institute can bring them back to the proving ground and arm a company trained to stop armored targets."
 azir_sp_plt_cube_battery: "Portable Hextech Cube Batteries"
 azir_sp_plt_cube_battery_desc: "The Hexahedral Configuration gave Piltover a way to carry crystalline power. An adaptation for the caliver would steady its output and let Wardens fire a stronger charge without sacrificing reliability."
 azir_plt_caliver_equipment: "Hexlyene Caliver"
 azir_plt_caliver_equipment_1: "Vishlaa's Hexlyene Caliver"
 azir_plt_caliver_equipment_1_short: "Hexlyene Caliver"
 azir_plt_caliver_equipment_2: "Cube-Fed Hexlyene Caliver"
 azir_plt_caliver_equipment_2_short: "Cube-Fed Caliver"
 azir_plt_warden_caliver_company: "Warden Caliver Company"
 azir_plt_warden_caliver_company_desc: "Wardens train with rare hex-powered calivers to pierce armor. Their weapons need a dedicated production line."
 azir_sp_zau_hex_carbine: "Standardize the Hex Carbine"
 azir_sp_zau_hex_carbine_desc: "Zaun's mechanicians can turn the Hex Carbine into a weapon that crews can repair from one workshop to the next. The first kits go to raiders trained to fight through crowded streets and tight industrial passages."
 azir_sp_zau_reusable_esophilters: "Reusable Esophilters"
 azir_sp_zau_reusable_esophilters_desc: "When the Gray settles into a passage, a disposable filter is only as good as the next resupply. Pair reusable breathing gear with serviceable carbines and field spares so crews can keep moving through the undercity."
 azir_zau_carbine_equipment: "Hex Carbine Kit"
 azir_zau_carbine_equipment_1: "Hex Carbine Kit"
 azir_zau_carbine_equipment_1_short: "Hex Carbine"
 azir_zau_carbine_equipment_2: "Hex Carbine and Esophilter Kit"
 azir_zau_carbine_equipment_2_short: "Esophilter Kit"
 azir_zau_sump_raider_company: "Sump Raider Company"
 azir_zau_sump_raider_company_desc: "Undercity raiders use compact carbines and local knowledge to move and fight through dense urban districts."
