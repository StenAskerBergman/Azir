l_english:
 PIL_ZAU_survey_tt:0 "Unlock the Canal Survey decision once Zaun seats its engineers."
 PIL_ZAU_terms_tt:0 "Authorize Piltover's choice of crossing policy once Zaun answers the survey."
 PIL_ZAU_engineers_tt:0 "Allow Piltover to send the inspection order and give Zaun the choice of how to answer."
 PIL_ZAU_reopen_tt:0 "Commit this bank to the works. Once both banks commit, either may publish the reopening schedule."
 PIL_ZAU_glasc_supply_contract:0 "Glasc Supply Contract"
 PIL_ZAU_glasc_supply_contract_desc:0 "The two banks are buying repair parts through Glasc Industries. One purchase book makes delivery predictable, and gives Renata leverage in both cities."
 PIL_ZAU_hextech_bonus:0 "Twin Cities Research"
 PIL_ZAU_crossings:0 "The Twin Cities"
 PIL_ZAU_crossings_desc:0 "Charters, laboratories and the crossings tie Piltover to Zaun. Every concession at the crossing changes who sets the terms."
 PIL_ZAU_events.17.t:0 "The Canal Survey"
 PIL_ZAU_events.17.d:0 "The harbor survey finds that bridge freight, canal traffic and the incline lifts depend on the same overworked transfer point. Inspectors want to restrict heavy loads while they examine the piers."
 PIL_ZAU_events.17.a:0 "Send the inspection order to both banks."
 PIL_ZAU_events.17.b:0 "File the survey until the crossing can be discussed."
 PIL_ZAU_events.18.t:0 "The Inspection Order"
 PIL_ZAU_events.18.d:0 "Piltover's surveyors want the freight loads reduced while they examine the crossing. The lower crews have been asking for the same inspection for months. They want a copy of the report and room on the inspection team."
 PIL_ZAU_events.18.a:0 "Send the ward engineers."
 PIL_ZAU_events.18.b:0 "Keep the crews on local repairs."
 PIL_ZAU_events.21.t:0 "The Two Cities Accord"
 PIL_ZAU_events.21.d:0 "Both banks have opened their registers and reserved freight space for one another. The board may now commission repairs on both approaches. Until the work is done, the cost of keeping space open falls on each city's workshops."
 PIL_ZAU_events.21.a:0 "Put the repair board to work."
 PIL_ZAU_events.22.t:0 "They Look Down on Us"
 PIL_ZAU_events.22.d:0 "From below, the upper bank seems close enough to touch. Both cities have barred the other's cargo from their registers. The lower wards have enough crews to keep some shifts running, but getting their goods out will mean paying for a second route."
 PIL_ZAU_events.22.a:0 "Let the wards speak together."
 PIL_ZAU_events.25.t:0 "The Crossing Reopens"
 PIL_ZAU_events.25.d:0 "Goods move across again under the published tariff. On the quay, the harbor master counts the first returning barges while the repair board posts the next maintenance closure in advance."
 PIL_ZAU_events.25.a:0 "Record the reopening."
 PIL_ZAU_events.26.t:0 "Permits at the Upper Gate"
 PIL_ZAU_events.26.d:0 "Both administrations have closed their registers to the other. Shipowners are short of crews and spare parts. They can keep trading if the Council pays for a separate route through River Pilt."
 PIL_ZAU_events.26.a:0 "Record the disruption."
 PIL_ZAU_bridge_survey:0 "Commission the Canal Survey"
 PIL_ZAU_bridge_survey_desc:0 "Examine the common transfer point and send the results to both banks."
 PIL_ZAU_bridge_reopen:0 "Reopen the Crossing"
 PIL_ZAU_bridge_reopen_desc:0 "If both cities are still cooperating and both approaches are funded, either city may publish the timetable. Both receive the freight charter and exchange workshop research."
