l_english:
 VOI_abandonment: "Abandoned by the World"
 VOI_abandonment_desc: "Icathia's survivors were left to the Void while the world looked away. Research, recruitment and industry all suffer under the weight of that isolation."
 Void_Threats: "Void Threats"
 Void_Threats_desc: "Void creatures roam Icathia's borders and stalk its ruins. Until they are dealt with, construction cannot proceed at a normal pace."
 No_Void_Threats: "Void Threats Subdued"
 No_Void_Threats_desc: "The immediate Void creatures have been driven back, and the survivors can build in relative peace."
 Active_Void_Threats: "Active Void Threats"
 Active_Void_Threats_desc: "Void creatures are on the move and the survivors must respond."
 Voidborn_Army: "Voidborn Army"
 Voidborn_Army_desc: "Creatures of the Void fight in the ranks beside Icathia's soldiers."
 void_influence: "Void Influence"
 void_influence_desc: "The Void's power flows through Icathia's armies at a cost to its supply lines."
 crushed_void_resistance: "Crushed Resistance"
 crushed_void_resistance_desc: "Those who opposed the Void's influence have been broken."
 void_resistance: "Void Resistance"
 void_resistance_desc: "Icathia's people stand against the Void's corruption."
 void_resistance2: "Void Resistance II"
 void_resistance2_desc: "The resistance against the Void has hardened and organized."
 void_resistance3: "Void Resistance III"
 void_resistance3_desc: "The resistance against the Void is now a determined national effort."
 Kohir: "Kohir"
 Kohir_desc: "Shurima's armies are bolstered against the Void."
 Mage_King: "Mage King"
 Mage_King_desc: "Those who resist the Void look to Icathia's tradition of mage rule for purpose and authority."
 Icathia_Ruins: "Icathia in Ruins"
 Icathia_Ruins_desc: "Icathia's ruins burden the economy and slow all reconstruction."
 Icathian_Miracle: "Icathian Miracle"
 Icathian_Miracle_desc: "Against all expectation, Icathia's reconstruction is flourishing."
 Barren_wasteland: "Barren Wasteland"
 Barren_wasteland_desc: "Icathia's land is barren and scarred by the Void."
 Icathian_agriculture: "Icathian Agriculture"
 VOI_void_influence_category: "Void Influence"
 VOI_void_influence_category_desc: "Harness the formidable power of the Void to serve our cause."
