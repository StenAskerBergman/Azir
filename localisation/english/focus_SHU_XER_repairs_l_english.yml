l_english:
 XER_WAR_GSD: "Prepare the Great Sai Campaign"
 XER_WAR_GSD_desc: "A united Great Sai would change the shape of our desert ambitions. We will gather political support for a campaign against this wider authority."
 SHU_XER_MAIN: "The Shuriman Crossroads"
 SHU_XER_MAIN_desc: "The rival claims to Shurima demand a government able to hold its course. We will strengthen political authority and public confidence before pursuing the realm's next priorities."
 SHU_XER_HEXT: "Acquire Hextech Principles"
 SHU_XER_HEXT_desc: "The study of hextech will give our scholars a direction for further experimentation. We will support research into electronics before attempting more ambitious applications."
 SHU_XER_HEXF: "Found a Hextech Faculty"
 SHU_XER_HEXF_desc: "A dedicated faculty will give the realm room to pursue another line of research. Political backing will help establish it as part of our rebuilding efforts."
 SHU_XER_FIRE: "Expand the Armament Workshops"
 SHU_XER_FIRE_desc: "The army needs workshops able to turn its plans into sustained production. A new military factory and further military experience will strengthen that effort."
 SHU_XER_SHIP: "Desert-Born Shipyards"
 SHU_XER_SHIP_desc: "Shipbuilding must become part of the realm's reconstruction. Where we own and control coastal territory, a new dockyard will support that ambition while naval experience guides the work."
 SHU_XER_TECH: "A New Age of Scholarship"
 SHU_XER_TECH_desc: "Scholarship will have a place beside the realm's workshops and arsenals. Expanded research capacity will support new studies and strengthen public confidence in rebuilding."
 SHU_XER_INFB: "Pave the Inner Routes"
 SHU_XER_INFB_desc: "The first infrastructure works are only a beginning. Further improvements in territory we own and control will carry the rebuilding effort forward and strengthen its political backing."
 SHU_XER_HUB: "Improve the Capital Routes"
 SHU_XER_HUB_desc: "The capital must support the realm's growing military responsibilities. Further infrastructure improvements and military experience will help prepare that work."
 SHU_XER_RADI: "Eyes Across the Dunes"
 SHU_XER_RADI_desc: "A radar station will support our efforts to observe the skies. Air experience will guide preparations for a more capable air service."
 SHU_XER_mining_bonus:0 "Desert Excavation Methods"
 SHU_XER_agriculture_bonus:0 "Agricultural Industry Research"
 SHU_XER_hextech_bonus:0 "Hextech Electronics Research"
