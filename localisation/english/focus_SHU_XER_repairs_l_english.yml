l_english:
 XER_WAR_GSD: "Campaign in the Great Sai"
 XER_WAR_GSD_desc: "The Great Sai is the heart of Shurima's interior. Securing its caravan roads and desert approaches will prepare the next stage of our campaign."
 SHU_XER_MAIN: "The Shuriman Crossroads"
 SHU_XER_MAIN_desc: "Whether ruled by the restored emperor or the Magus Ascendant, Shurima must choose how the reborn realm will marshal its wealth, knowledge, and armies."
 SHU_XER_HEXT: "Acquire Hextech Principles"
 SHU_XER_HEXT_desc: "Piltovan hextech joins precise engineering to magical crystals. Studying its principles may let Shuriman scholars build wonders of their own."
 SHU_XER_HEXF: "Found a Hextech Faculty"
 SHU_XER_HEXF_desc: "A permanent faculty will train artificers who can adapt foreign hextech methods to the demands of the desert."
 SHU_XER_FIRE: "Forge Sunfire Weapons"
 SHU_XER_FIRE_desc: "Shuriman smiths will combine disciplined mass production with the heat and symbolism of the sun, expanding our military industry."
 SHU_XER_SHIP: "Desert-Born Shipyards"
 SHU_XER_SHIP_desc: "The restored empire cannot end at the coast. New yards will turn timber, metal, and Marai seamanship into an imperial fleet."
 SHU_XER_TECH: "A New Age of Scholarship"
 SHU_XER_TECH_desc: "The empire once gathered knowledge from across the continent. Rebuilt academies will make scholarship a pillar of Shurima's return."
 SHU_XER_INFB: "Pave the Inner Routes"
 SHU_XER_INFB_desc: "Stone roads across the dunes will bind oasis towns, mines, and garrisons to the capital."
 SHU_XER_HUB: "Caravan Supply Hubs"
 SHU_XER_HUB_desc: "Fortified caravanserais and depots will keep armies supplied where ordinary logistics would vanish beneath the sand."
 SHU_XER_RADI: "Eyes Across the Dunes"
 SHU_XER_RADI_desc: "Long-range detection posts will watch the desert approaches and warn our commanders before hostile aircraft or armies can strike."
