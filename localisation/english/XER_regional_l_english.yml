l_english:
 XER_bop: "Authority in Arcanum"
 XER_bop_magus: "Arcane Administration"
 XER_bop_governors: "Frontier Governors"
 XER_bop_unsettled: "Contested Authority"
 XER_bop_magus_influence: "Workshop Patronage"
 XER_bop_magus_mandate: "Central Requisition"
 XER_bop_governor_influence: "Delegated Command"
 XER_bop_governor_mandate: "Governor Mandates"
 XER_bop_decisions: "Authority in Arcanum"
 XER_regional_battery_tt: "Has a fielded division with an Arcane Siege Battery at 80% strength or higher"
 XER_regional_arcane_registry: "Charter the Arcane Workshops"
 XER_regional_arcane_registry_desc: "Give the workshops a charter to train specialist crews and petition for central requisition."
 XER_regional_frontier_charters: "Negotiate Frontier Charters"
 XER_regional_frontier_charters_desc: "Give Renekton and the frontier officers authority to maintain garrisons under a negotiated supply obligation."
 XER_regional_disc_victory: "Secure the Sun Disc"
 XER_regional_disc_victory_desc: "Hold the Disc after taking it from Shurima and demonstrate that the equipped battery and its workshops can sustain the conquest."
 XER_regional_protectorate_victory: "Confirm the Protectorates"
 XER_regional_protectorate_victory_desc: "Ratify the governors’ authority after retaining the capital, provisioning both frontier garrisons and concluding an armistice."
 XER_centralize_requisition: "Install Central Requisition"
 XER_centralize_requisition_desc: "Place supplies and specialist appointments under Xerath’s administrators. Repealing the law will demobilize their crews."
 XER_delegate_frontier: "Install Frontier Mandates"
 XER_delegate_frontier_desc: "Give the officers control of local defense and supply. Revoking their mandates will disrupt garrison readiness."
 XER_prepare_arcane_crews: "Mobilize Specialist Crews"
 XER_prepare_arcane_crews_desc: "Commit 36 reserve artillery pieces to specialist crew training. Deploy an equipped battery division through the existing division designer and recruitment system."
 XER_provision_frontier: "Provision the River Garrisons"
 XER_provision_frontier_desc: "Send 100 infantry weapons to garrisons in River Renek and River Faraj for 120 days. Both states must remain owned, controlled and occupied by Arcanum divisions to qualify."
 XER_repeal_requisition: "Repeal Central Requisition"
 XER_repeal_requisition_desc: "Replace the central law and release specialist crews. Siege readiness falls for 60 days."
 XER_revoke_frontier_mandates: "Revoke the Governors’ Mandates"
 XER_revoke_frontier_mandates_desc: "Return local powers to the capital. Garrison readiness falls for 60 days."
 XER_break_with_magus: "Break with the Magus"
 XER_break_with_magus_desc: "Use the evidence exposed by the tomb crisis to place military command under Renekton. The succession disrupts command for 60 days and suspends the specialist program."
 XER_offer_shurima_armistice: "Offer Shurima an Armistice"
 XER_offer_shurima_armistice_desc: "Ask Shurima to stop fighting while it holds the Sun Disc. If Renekton has taken military command, acceptance establishes a 90-day truce."
 XER_offer_nazumah_armistice: "Offer Nazumah an Armistice"
 XER_offer_nazumah_armistice_desc: "Ask Nazumah to stop fighting while it holds its capital."
 XER_arcane_readiness: "Arcane Siege Administration"
 XER_arcane_readiness_desc: "Equipped crews draw replacements from the river workshops."
 XER_frontier_readiness: "Provisioned Frontier Commands"
 XER_frontier_readiness_desc: "Local officers maintain their own supply dumps, but coordinating a single offensive takes longer."
 XER_siege_disruption: "Specialist Demobilization"
 XER_siege_disruption_desc: "Disbanded crews and replacement requisition officers slow offensive preparations."
 XER_garrison_disruption: "Mandates Recalled"
 XER_garrison_disruption_desc: "The capital must replace the officers who organized frontier defense."
 XER_command_succession: "Fractured Command Succession"
 XER_command_succession_desc: "Renekton’s officers need time to replace the Magus’s command staff."
 XER_regional.2.t: "Renekton Takes Command"
 XER_regional.2.d: "The tomb’s echoes have forced Renekton to confront how Xerath used his captivity. The governors have transferred military authority to Renekton and suspended the Magus’s specialist program. The new command can ask Shurima for a temporary truce. Nasus’s place in Renekton’s future remains unsettled."
 XER_regional.2.a: "Understood"
 XER_regional.3.t: "Armistice in Force"
 XER_regional.3.d: "The other government accepted our terms and the two armies have ceased hostilities. The governors can cite the agreement when they petition to confirm their protectorates."
 XER_regional.3.a: "Understood"
 XER_regional.4.t: "Armistice Refused"
 XER_regional.4.d: "The other government has declined. The governors must observe the diplomatic cooldown before approaching that government again."
 XER_regional.4.a: "Understood"
 XER_regional.5.t: "Armistice Lapsed"
 XER_regional.5.d: "The war or command situation no longer permits this agreement. The offer has closed without an armistice."
 XER_regional.5.a: "Understood"
