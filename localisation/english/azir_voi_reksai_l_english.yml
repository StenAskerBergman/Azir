l_english:
 VOI_muster_reksai: "Muster Rek'Sai's Burrowers"
 VOI_muster_reksai_desc: "Follow the Void Burrower into the sands. Her brood will move beneath the desert and strike where the enemy least expects it."
 VOI_muster_reksai_tt: "Unlocks the §YRek'Sai's Burrowers§! assault template, limited to one division. Its Xer'Sai battalions move faster and gain attack and movement bonuses in deserts."
 VOI_unlock_reksai_muster_tt: "Unlocks the §YMuster Rek'Sai's Burrowers§! decision while Rek'Sai is with us."
 azir_voi_xersai_training: "Xer'Sai Muster"
 azir_voi_xersai_training_desc: "Organize Rek'Sai's brood for fast desert assaults."
 azir_voi_xersai_assault: "Xer'Sai Assault Brood"
 azir_voi_xersai_assault_desc: "Fast assault battalion that follows the Void Burrower through the desert."
 VOI_form_xersai_burrower_company: "Form the Xer’Sai Burrower Company"
 VOI_form_xersai_burrower_company_desc: "Our scouts have learned to hear the brood moving under the sand. With the Rupture in our hands, they can chart its tunnels and guide the army to places the enemy leaves unguarded."
 VOI_form_xersai_burrower_company_tt: "Unlocks the §YXer’Sai Burrower Company§! in the division designer. Each company uses 20 infantry equipment and 10 support equipment."
 VOI_xersai_controls_rupture_tt: "Controls the §YVoid Rupture§!."
 azir_voi_xersai_burrower_training: "Xer’Sai Tunneling Doctrine"
 azir_voi_xersai_burrower_training_desc: "Train scouts to follow the brood's tunnels and guide desert assaults."
 azir_voi_xersai_burrower_company: "Xer’Sai Burrower Company"
 azir_voi_xersai_burrower_company_desc: "Reconnaissance support trained to guide divisions through the sands and strike from unexpected approaches."
 VOI_equip_riftbound_burrowers: "Equip the Riftbound Burrowers"
 VOI_equip_riftbound_burrowers_desc: "The open Gate lets our workshops tune seismic instruments to the brood's movements. The kits help scouts read the ground ahead of a desert assault. Only workshops supplied from the Rupture can make them."
 VOI_equip_riftbound_burrowers_tt: "Unlocks the §YXer’Sai Riftbound Company§! and §YRiftbound Seismic Kits§!. Replace Burrowers in the division designer to field the upgrade. Each company requires 20 infantry equipment and 10 kits. Kit production requires control of the Rupture."
 azir_voi_xersai_riftbound_training: "Riftbound Reconnaissance"
 azir_voi_xersai_riftbound_training_desc: "Use instruments tuned at the Rupture to follow the brood through the desert."
 azir_voi_xersai_riftbound_company: "Xer’Sai Riftbound Company"
 azir_voi_xersai_riftbound_company_desc: "An upgraded Burrower reconnaissance company with better scouting and stronger desert attack and movement bonuses. It relies on seismic kits made with access to the Rupture."
 azir_voi_xersai_seismic_kit: "Riftbound Seismic Kits"
 azir_voi_xersai_seismic_kit_1: "Riftbound Seismic Kit"
 azir_voi_xersai_seismic_kit_1_short: "Seismic Kit"
