#MRE and Demacia
 MRE_peace:0 "Peace On The Horizon"
 MRE_peace_desc:0 "Peace between our humble rebellion and the government of Demacia seems inevitable at this point, and as the expected victors, it should be up to us to dictate the peace treaty. §RMust keep Demacia at 50% capitulation progress or higher to progress!"
 peaceTreaty:0 "Peace Treaty"
 peaceTreaty_desc:0 "A peace treaty is currently being written!"

 MRE_demons:0 "Demacian Demons"
 MRE_demons_desc:0 "There have been reports of demons ravaging our country side. It is up to us to find and deal with these menaces before they cause too much damage."

