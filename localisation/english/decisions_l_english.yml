#Noxus
 NOX_trifarix:0 "Noxian Trifarix"
 NOX_trifarix_descr:0 "The Noxian Trifarix stands as the new governing body of Noxus, ruling the nation through strength and unity. Each member of the Trifarix, however, aims to best influence the noble houses of Noxus to help push their own agenda forward."
 
 NOX_promote_might:0 "Promote Might"
 NOX_promote_might_desc:0 "We must push the virtues of might and strength to the people of Noxus!"
 NOX_promote_vision:0 "Promote Vision"
 NOX_promote_vision_desc:0 "We must push the virtues of vision and cunningness to the people of Noxus!"
 NOX_promote_guile:0 "Promote Guile"
 NOX_promote_guile_desc:0 "We must push the virtues of guile and deception to the people of Noxus!"
 NOX_political_favors:0 "Political Favors"
 NOX_political_favors_desc:0 "We can expend some of our own influence in order to sway many in the Noxian nobility to side with us in other matters."
 NOX_find_general:0 "Find A Suitable General"
 NOX_find_general_desc:0 "Our resources can reach across the Empire in search of the best of talent for military duty, especially ones that align with our ideals."

