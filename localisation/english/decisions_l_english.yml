 martial_law:0 "Martial Law"
 martial_law_desc:0 "Involving the military is an effective means of combating a demonic entity, though we might face some casualties."
 prepare_a_defense:0 "Prepare A Defense"
 prepare_a_defense_desc:0 "By allocating a portion of our weapons to equip the locals in their plight against the demon, we can hinder the demon's reign."
 relocate_resources:0 "Relocate Resources"
 relocate_resources_desc:0 "Ensuring our bureaucracy moves at a fast enough pace to make quick decisions will surely help in our demonic fight."
