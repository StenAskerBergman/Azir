 SHU_unlock_lion_rider_muster_tt: "Unlocks the decision §YMuster the Lion Riders§! under §YThe Great Rise§!."
 SHU_muster_lion_riders: "Muster the Lion Riders"
 SHU_muster_lion_riders_desc: "Gather the riders and equip them from the legions' stores. Their scouts will guide our columns across the dunes and report enemy movements."
 SHU_muster_lion_riders_tt: "Unlocks the §YLion Rider Recon Company§! in the Division Designer."
 azir_shu_lion_rider_training: "Lion Rider Training"
 azir_shu_lion_rider_training_desc: "Training in desert route finding and battlefield reconnaissance."
 azir_shu_lion_rider_company: "Lion Rider Recon Company"
 azir_shu_lion_rider_company_desc: "Shuriman reconnaissance support trained to guide divisions across desert terrain. Uses standard infantry and support equipment and shares the reconnaissance support type."
