l_english:
 XER_unlock_baccai_company_tt: "Unlocks the §YBaccai Assault Company§! in the Division Designer."
 XER_unlock_renekton_warband_tt: "Unlocks §YRenekton's Warband§! in the Division Designer."
 azir_xer_baccai_training: "Baccai Assault Training"
 azir_xer_baccai_training_desc: "Organize Xerath's Baccai followers into companies trained to storm fortifications."
 azir_xer_baccai_assault_company: "Baccai Assault Company"
 azir_xer_baccai_assault_company_desc: "Assault support company trained to breach fortified positions. It occupies the same support slot type as engineers."
 azir_xer_warband_training: "Blood Pact Muster"
 azir_xer_warband_training_desc: "Bind veteran fighters to Renekton's commanders and organize them into frontline warbands."
 azir_xer_renekton_warband: "Renekton's Warband"
 azir_xer_renekton_warband_desc: "A line infantry battalion that uses more troops, weapons, and supply to press an attack."
 XER_channel_mana_surge: "Channel a Mana Surge"
 XER_channel_mana_surge_desc: "The Herald of the Magus teaches that places of power can lend their strength to Xerath's armies. Draw on the Rival Sun Disc at Nerimazeth to strengthen our forces for a short campaign."
 XER_mana_surge: "Mana Surge"
 XER_mana_surge_desc: "Arcane power drawn from the Rival Sun Disc strengthens Xerath's army on the offensive."
 XER_renekon: "$XER_chiefdom$"
 XER_renekon_DEF: "$XER_chiefdom_DEF$"
 POLITICS_RENEKTON_DESC: "Once a commander of Shurima's armies, Renekton now leads the enclave on his own terms. His commanders look to him to lead the next campaign."
