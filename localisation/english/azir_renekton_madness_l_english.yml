l_english:
 XER_renekton_madness_category: "Echoes of the Tomb"
 XER_hear_the_tomb: "Listen to the Tomb"
 XER_hear_the_tomb_desc: "Renekton hears the tomb in the quiet after battle. In lands his armies have seized, some of his followers have begun to hear it too. He can follow the voice, but there is a limit to what even an Ascended body can bear."
 XER_renekton_last_days: "Renekton's Last Days"
 XER_renekton_last_days_desc: "The change is consuming him. If neither treatment nor transformation is complete when time runs out, Renekton will die."
 XER_spread_renekton_madness: "Carry the Echo to [FROM.GetName]"
 XER_spread_renekton_madness_desc: "Send those who heard the tomb to the conquered towns. Their presence spreads the echo and disrupts work across the state."
 XER_renekton_tainted_land: "Echoes of the Tomb"
 XER_renekton_three_states_tt: "Spread the echo to at least three conquered states."
 XER_renekton_final_form: "The Last Chain Breaks"
 XER_renekton_final_form_desc: "Three conquered lands have taken up the tomb's echo. Renekton can draw their fury into himself and survive the change. Once he does, his brother's treatment can no longer reach him."
 XER_renekton_final_form_idea: "Corrupted Renekton"
 XER_renekton_final_form_idea_desc: "Renekton survived by taking the fury into himself. His forces fight with greater ferocity, and his rule has grown harder to bear."
 XER_answer_the_vigil: "Answer the Vigil"
 XER_answer_the_vigil_desc: "Across the silence, his brother is still listening. This time Renekton has something to say."
 SHU_renekton_recovery_category: "A Brother's Vigil"
 SHU_offer_renekton_treatment: "Send for Renekton"
 SHU_offer_renekton_treatment_desc: "Nasus believes his brother can still be reached. Renekton will have to agree to the treatment. Its work must finish before the change takes him."
 SHU_renekton_treatment: "Bring Renekton Back"
 SHU_renekton_treatment_desc: "Nasus is working to bring his brother back before the change becomes permanent."
 SHU_hold_a_vigil: "Keep Another Vigil"
 SHU_hold_a_vigil_desc: "Nasus can spend another night listening to his brother and gain ten days in the treatment. He has been sleeping less with each visit."
 SHU_ask_zilean_to_help: "Ask Zilean to Share the Watch"
 SHU_ask_zilean_to_help_desc: "Zilean can give the brothers more time together. If he accepts, the treatment will finish thirty days sooner."
 SHU_nasus_fractured: "A Fractured Vigil"
 SHU_nasus_fractured_desc: "Nasus came back from the vigil changed. His attendants hear him answer a voice they cannot hear."
 azir_renekton.1.t:0 "Something Answered"
 azir_renekton.1.d:0 "The soldiers thought the sounds would stop once they left the battlefield. In the towns they captured, doors began to rattle after dark. Renekton heard the voice again and understood that his followers could carry it farther. Each time he listens, the silence he used to know grows shorter."
 azir_renekton.1.a:0 "I hear you."
 azir_renekton.2.t:0 "Nasus at the Door"
 azir_renekton.2.d:0 "Nasus has asked for time alone with his brother. He remembers the man who held the line beside him and believes he can still bring that man back. The guards wait for Renekton's answer."
 azir_renekton.2.a:0 "Let him in."
 azir_renekton.2.b:0 "Send him away."
 azir_renekton.3.t:0 "Time for Two Brothers"
 azir_renekton.3.d:0 "Nasus has asked Zilean to help him reach Renekton. A moment held still might give the brothers time to talk before the voice returns."
 azir_renekton.3.a:0 "Give them the time they need."
 azir_renekton.3.b:0 "We need Zilean here."
 azir_renekton.4.t:0 "Corrupted Renekton"
 azir_renekton.4.d:0 "Renekton drew the voices of the conquered lands into himself. By morning he could stand again. The soldiers outside his chamber heard him call for his axe."
 azir_renekton.4.a:0 "Bring me my axe."
 azir_renekton.5.t:0 "The Voice Falls Quiet"
 azir_renekton.5.d:0 "Renekton slept through the night for the first time since the campaign began. When he woke, he knew his brother's voice. In the occupied towns, the doors were quiet."
 azir_renekton.5.a:0 "Let him rest."
 azir_renekton.6.t:0 "Too Late for Renekton"
 azir_renekton.6.d:0 "The change took Renekton's life before anyone could bring him back. His guards carried him out at dawn, and the sounds in the conquered towns went quiet."
 azir_renekton.6.a:0 "He has fallen."
 azir_renekton.7.t:0 "What Nasus Brought Back"
 azir_renekton.7.d:0 "Nasus came home before dawn. When an attendant asked whether Renekton had spoken, Nasus answered in his brother's voice. He has refused to return to the chamber."
 azir_renekton.7.a:0 "Close the doors."
