l_english:
 AUR_open_water_tyrant: "Open-Water Tyrants"
 AUR_open_water_tyrant_desc: "Let our rivals hear the confidence of captains who intend to set their own course. Rally Aurma behind its maritime ambitions and put hard-won experience at the government's service."
 AUR_targonian_navigators: "Targonian Navigators"
 AUR_targonian_navigators_desc: "Our Targonian navigators bring their own traditions to the chart table. Draw on their experience to strengthen our seamanship and give Aurma's leaders greater confidence in the course ahead."
