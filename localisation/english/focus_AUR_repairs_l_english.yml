l_english:
 AUR_open_water_tyrant: "Open-Water Tyrants"
 AUR_open_water_tyrant_desc: "Aurma's captains know that the open sea rewards strength and punishes hesitation. Our great warships will dominate the waters beyond the reefs."
 AUR_targonian_navigators: "Targonian Navigators"
 AUR_targonian_navigators_desc: "Travelers from Mount Targon read the heavens with uncommon precision. Their knowledge of stars and seasons will guide Aurman fleets far from familiar shores."
