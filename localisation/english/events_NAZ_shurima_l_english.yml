  nazumah.200.t: "Preparations Against Azir"
  nazumah.200.d: "The decision to pursue Azir demands careful preparation. Recruits and equipment can be gathered before the campaign proceeds to its next stage."
  nazumah.200.a: "Equip the expedition."

  nazumah.201.t: "Preparations Against Nasus"
  nazumah.201.d: "Pursuing Nasus will require recruits and reliable equipment. We can strengthen the expedition before it faces the dangers ahead."
  nazumah.201.a: "Equip the expedition."

