 azir_void_espionage.1.b: "Goofy"
 azir_void_espionage_category: "Void Espionage"
 azir_recruit_void_operative: "Charm of the Void Watchers"
 azir_recruit_void_operative_desc: "[Root.GetAzirVoidOperativeDossier]\n\nRequires an Intelligence Agency, a free operative slot, and either a chosen tone or the end of the selection period on 1 April 990."
 azir_void_operative_dossier_serious: "Recruit Vel'Koz. The Eye of the Void studies Runeterra to find weaknesses the Watchers can exploit."
 azir_void_operative_dossier_goofy: "Recruit Definitely Not Vel'Koz. His glasses are entirely ordinary. They are also how he discovered that the stolen blueprints were upside down."
