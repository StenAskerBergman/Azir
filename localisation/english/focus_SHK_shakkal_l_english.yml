l_english:
  RAI_rise_of_the_shuriman_raiders: "Rise of the Shuriman Raiders"
  RAI_rise_of_the_shuriman_raiders_desc: "Scattered raiding bands cannot bargain or command as one. We will give the camps a common voice and turn their growing influence into political authority."

  RAI_desert_wanderers: "Desert Wanderers"
  RAI_desert_wanderers_desc: "Our fighters know the tracks and hiding places around their own camps. Drawing on that knowledge will strengthen attacks on the land we claim as home."

  RAI_lore_keepers: "Lore Keepers"
  RAI_lore_keepers_desc: "The camps carry knowledge that no imperial archive has preserved for them. Giving their keepers a place in our studies will help us learn without surrendering those traditions."

  RAI_cultural_exchange: "Cultural Exchange"
  RAI_cultural_exchange_desc: "Trade between the camps and settled communities needs more than a wary exchange at the road's edge. Familiar customs and trusted intermediaries will improve how merchants regard us."

  RAI_blood_and_sand: "Blood and Sand"
  RAI_blood_and_sand_desc: "Every band has fighters who learned their craft defending a camp or a water source. Sharing that hard-won experience will sharpen our attacks on the country we call home."

  RAI_horse_lords: "Horse Lords"
  RAI_horse_lords_desc: "Mounted fighters give our bands a tradition worth organizing around. Better cavalry tactics will strengthen their attacks and help them hold their ground when enemies answer."

  RAI_dune_fighters: "Dune Fighters"
  RAI_dune_fighters_desc: "Bands accustomed to fighting apart must learn to support one another. Shared drills will turn their hard-earned experience into stronger attacks and a steadier defense."

  RAI_oasis_control: "Oasis Control"
  RAI_oasis_control_desc: "A band that wastes its provisions cannot stay in the field for long. Organizing supplies around the oases we rely on will reduce what our forces need to sustain their campaigns."

  RAI_sand_scouts: "Sand Scouts"
  RAI_sand_scouts_desc: "Mounted scouts can range ahead of the bands and bring back news of enemy movements. We will make their reports a regular part of our reconnaissance."

  RAI_survival_training: "Survival Training"
  RAI_survival_training_desc: "A long march can wear down a band before an enemy ever meets it. Teach every fighter to care for equipment and endure the journey, reducing losses to attrition."

  RAI_plunder_and_pillage: "Plunder and Pillage"
  RAI_plunder_and_pillage_desc: "The promise of plunder can rally the camps behind a campaign. We will sharpen our raids on home ground and build support for the fighting ahead."

  RAI_ruthless_tactics: "Ruthless Tactics"
  RAI_ruthless_tactics_desc: "Scouts must bring back more than warnings: their reports must shape how the bands fight. Relentless drills will turn that knowledge into firmer attacks and defenses."

  RAI_loyal_to_the_clan: "Loyal to the Clan"
  RAI_loyal_to_the_clan_desc: "A fighter who trusts the band beside him is less likely to break when the line comes under pressure. Strengthen the bonds of the clans so our forces can hold together and defend their ground."

  RAI_treaty_with_outlaws: "Treaty with Outlaws"
  RAI_treaty_with_outlaws_desc: "Agreements among the outlaw bands can settle disputes that otherwise consume the camps' attention. A common understanding will give our leaders more time and authority to act."

  RAI_nomadic_coalition: "Nomadic Coalition"
  RAI_nomadic_coalition_desc: "The bands need not abandon their own customs to stand together. Coordinating their campaigns will strengthen both attack and defense on the land they call home."

  RAI_expansion_of_territory: "Expansion of Territory"
  RAI_expansion_of_territory_desc: "Our leaders must make the case for extending the camps' reach before calling the bands to war. A clearer policy of expansion will shorten the work of justifying future campaigns."

  SHK_new_leadership: "New Leadership"
  SHK_new_leadership_desc: "A gang can follow whoever shouts loudest; a people needs a steadier hand. Bring Shakkal's leaders together and give them the authority to chart our next move."

  SHK_the_sadists: "The Sadists"
  SHK_the_sadists_desc: "These commanders measure strength by the fear they leave behind. Their fighters will press the attack harder, but the people at home will pay for their methods."

  SHK_the_eggheads: "The Eggheads"
  SHK_the_eggheads_desc: "A sharp mind can win what a reckless charge throws away. Give our thinkers room to study, test their ideas, and prepare the plans our fighters need."

  SHK_the_grunts: "The Grunts"
  SHK_the_grunts_desc: "The fighters who hold the line have earned their say. Put practical discipline first, training recruits more quickly and teaching them to stand their ground."

  SHK_the_boss: "The Boss"
  SHK_the_boss_desc: "A dozen rival voices can leave every order disputed. Back a leader who can make decisions stick and give Shakkal a firmer center of authority."

  SHK_preparing_for_total_war: "Preparing for Total War"
  SHK_preparing_for_total_war_desc: "Small raids will not prepare us for a war that reaches every camp. Rally support for the struggle ahead and bring more of our people into its service."

  SHK_draconian_recovery: "Draconian Recovery Methods"
  SHK_draconian_recovery_desc: "The commanders demand that our workshops deliver, whatever the cost. Force production to a harder pace, accepting the anger these measures will stir among our people."

  SHK_critical_thinking: "Critical Thinking"
  SHK_critical_thinking_desc: "A plan that cannot survive a hard question will not survive a battle. Encourage our thinkers to challenge weak assumptions and turn better knowledge into better preparation."

  SHK_the_master_plan: "The Master Plan"
  SHK_the_master_plan_desc: "Raids fought in isolation cannot serve a common purpose. Give our commanders a shared plan and organize the fighters to carry it through together."

  SHK_gangland_diplomacy: "Gangland Diplomacy"
  SHK_gangland_diplomacy_desc: "Our spokesmen intend to bargain from strength. Sharpen the fighters' offensive edge and give Shakkal's leaders more weight behind their words."

  SHK_everyone_works: "Everyone Works"
  SHK_everyone_works_desc: "No camp can live on the efforts of a few. Put more hands to productive work and military service, building the discipline to keep both supplied."

  SHK_dont_question_the_boss: "Don’t Question the Boss"
  SHK_dont_question_the_boss_desc: "The boss expects an order to settle an argument. Reinforce that authority so decisions carry further and the camps have a steadier hand above them."

  SHK_iron_grip: "The Iron Grip"
  SHK_iron_grip_desc: "The boss intends to hold the camps together when hardship comes. Make that authority felt throughout Shakkal and rally support for the struggles ahead."

  SHK_rise_of_the_shuriman_raiders: "Rise of the Shuriman Raiders"
  SHK_rise_of_the_shuriman_raiders_desc: "Unite the raiders under one banner for increased power and cohesion."

  SHK_desert_wanderers: "Desert Wanderers"
  SHK_desert_wanderers_desc: "Train our people to be self-sufficient and skilled in desert navigation."

  SHK_lore_keepers: "Lore Keepers"
  SHK_lore_keepers_desc: "Preserve the knowledge and traditions of our ancestors."

  SHK_cultural_exchange: "Cultural Exchange"
  SHK_cultural_exchange_desc: "Establish relationships with neighboring cultures to enrich our own."

  SHK_blood_and_sand: "Blood and Sand"
  SHK_blood_and_sand_desc: "Harness the harsh desert environment to harden our fighters."

  SHK_horse_lords: "Horse Lords"
  SHK_horse_lords_desc: "Emphasize cavalry tactics and the breeding of superior warhorses."

  SHK_dune_fighters: "Dune Fighters"
  SHK_dune_fighters_desc: "Specialize our troops in desert warfare tactics."

  SHK_oasis_control: "Oasis Control"
  SHK_oasis_control_desc: "Secure vital water sources to ensure the sustainability of our people."

  SHK_sand_scouts: "Sand Scouts"
  SHK_sand_scouts_desc: "Deploy highly trained scouts to gather intelligence and navigate the desert."

  SHK_survival_training: "Survival Training"
  SHK_survival_training_desc: "Prepare our forces with rigorous survival training programs."

  SHK_plunder_and_pillage: "Plunder and Pillage"
  SHK_plunder_and_pillage_desc: "Engage in raids to acquire resources and weaken our enemies."

  SHK_ruthless_tactics: "Ruthless Tactics"
  SHK_ruthless_tactics_desc: "Adopt brutal tactics to intimidate and demoralize our foes."

  SHK_loyal_to_the_clan: "Loyal to the Clan"
  SHK_loyal_to_the_clan_desc: "Foster a strong sense of loyalty and unity within our ranks."

  SHK_treaty_with_outlaws: "Treaty with Outlaws"
  SHK_treaty_with_outlaws_desc: "Negotiate with outlaw groups to secure their cooperation."

  SHK_nomadic_coalition: "Nomadic Coalition"
  SHK_nomadic_coalition_desc: "Unite the various nomadic tribes under a single banner."

  SHK_expansion_of_territory: "Expansion of Territory"
  SHK_expansion_of_territory_desc: "Expand our territory through conquest and settlement."


  SHK_reject_our_ways: "Reject Our Ways"
  SHK_reject_our_ways_desc: "A life of raids need not decide every generation's future. Give those seeking a different course the authority to begin, and build confidence that change can serve our people."

  SHK_reject_their_rules: "Reject Their Rules"
  SHK_reject_their_rules_desc: "No distant ruler has earned the right to dictate how our camps should live. Rally our people behind a firmer voice of our own and prepare our fighters to defend it."

  SHK_constant_resistance: "Constant Resistance"
  SHK_constant_resistance_desc: "Resistance must outlast the first bold speech. Keep our fighters ready and our people committed, even as the strain of constant preparation unsettles life at home."

  SHK_icathian_ties: "Icathian Ties"
  SHK_icathian_ties_desc: "Those who look to Icathia's legacy need a voice in Shakkal's future. Give that connection a place in our public life and gather support around it."

  SHK_icathian_heritage: "Icathian Heritage"
  SHK_icathian_heritage_desc: "For those who claim an Icathian heritage, remembrance should lead to study as well as pride. Make room for more research and give that shared pursuit a place in Shakkal's life."

  SHK_foreign_trade: "Foreign Trade"
  SHK_foreign_trade_desc: "Resistance alone will not fill a workshop. Put the proceeds of trade from beyond our borders into production at home, giving Shakkal a stronger industrial footing."

  SHK_foreign_support: "Foreign Support"
  SHK_foreign_support_desc: "Securing aid and support from foreign allies."

  SHK_embrace_new_ways: "Embrace New Ways"
  SHK_embrace_new_ways_desc: "Our workshops cannot improve by repeating every old habit. Encourage new industrial methods and give our leaders the means to carry those lessons into practice."

  SHK_icathia_ancestors: "Icathia Ancestors"
  SHK_icathia_ancestors_desc: "Honoring our Icathian ancestors and their legacy."


  SHK_kill_burn_destroy: "Kill, Burn, Destroy"
  SHK_kill_burn_destroy_desc: "Some commanders believe only a ruthless fight can secure our future. Rally their fighters for a harsher struggle, accepting the unrest that such a course will bring at home."

  SHK_protect_shield_guard: "Protect, Shield, Guard"
  SHK_protect_shield_guard_desc: "Our fighters must serve the people whose homes they defend. Gather their experience around a common duty and give the camps confidence in those who stand guard."

  SHK_rebuild: "Rebuild"
  SHK_rebuild_desc: "A future worth defending must have work behind it. Establish more workshops in the lands we administer and give Shakkal a stronger foundation for recovery."

  SHK_resemble: "Resemble"
  SHK_resemble_desc: "We need not repeat another people's mistakes to learn from their successes. Study proven industrial methods and give our leaders the means to put them to use."

  SHK_recreate: "Recreate"
  SHK_recreate_desc: "Old ambitions need new knowledge if they are to survive. Make room for further research and gather our people behind the future it could open."

  SHK_shakkal_republic: "Shakkal Republic"
  SHK_shakkal_republic_desc: "Let the promise of a Shakkal republic give our camps a common purpose. Proclaim that political vision and build the public confidence needed to carry it forward."

  SHK_greater_shakkal: "Greater Shakkal"
  SHK_greater_shakkal_desc: "Those who dream of a greater Shakkal must be ready to serve it. Rally new fighters and public support behind that ambition."

  SHK_icathia_alliance: "Icathia Alliance"
  SHK_icathia_alliance_desc: "Those who favor an alliance with Icathia must first build support for that course at home. Give their policy a clear voice and unite our people behind its promise."

  SHK_icathia_reborn: "Icathia Reborn"
  SHK_icathia_reborn_desc: "For some among us, Icathia's legacy offers a vision of what comes next. Commit our leadership to that ambition and expand the research that might give it substance."

  SHK_ancestral_lineage: "Ancestral Lineage"
  SHK_ancestral_lineage_desc: "Our elders carry stories that give the camps a common past. Honor those traditions without surrendering the future we are building, and strengthen the bonds that hold our people together."

  SHK_sand_storm: "Sand Storm"
  SHK_sand_storm_desc: "Our fighters must turn determination into preparation. Gather the lessons of past struggles and rally Shakkal behind the effort still ahead."

  SHK_the_bell_tolls: "The Bell Tolls"
  SHK_the_bell_tolls_desc: "When Shakkal recognizes a common enemy, hesitation serves no one. Rally our people for the struggle and bring our fighters' experience to bear."

  SHK_desert_dream: "Desert Dream"
  SHK_desert_dream_desc: "Grand visions mean little without livelihoods to sustain them. Build new workshops in the lands we hold and give our people confidence that prosperity can reach their homes."

  SHK_greater_ambitious: "Greater Ambitions"
  SHK_greater_ambitious_desc: "Caution has its place, but our leaders intend to make Shakkal's voice carry further. Gather the authority and public resolve needed to pursue a bolder course."

  SHK_greater_dreams: "Greater Dreams"
  SHK_greater_dreams_desc: "Strength alone cannot build the future we imagine. Expand our capacity for research and give those ambitions a firmer place in Shakkal's policy."

  SHK_our_legacy: "Our Legacy"
  SHK_our_legacy_desc: "An ambitious people needs a past it can stand behind. Honor what our camps have endured and give our leaders a stronger mandate to carry that legacy forward."

  SHK_graveyard_of_empires: "Graveyard of Empires"
  SHK_graveyard_of_empires_desc: "An invader should find no easy victory here. Bring fresh fighters into the struggle and turn our hard-earned experience into the resolve to resist."

  SHK_our_destiny: "Our Destiny"
  SHK_our_destiny_desc: "Our future should be shaped by the people who must live it. Unite Shakkal behind that purpose, with the confidence and resolve to see it through."

  SHK_return_to_traditions: "Return to Traditions"
  SHK_return_to_traditions_desc: "Settling down need not mean forgetting who we are. Bring the customs of the camps into our new public life and strengthen confidence in the leaders who uphold them."

  SHK_our_ancestors: "Our Ancestors"
  SHK_our_ancestors_desc: "The stories of those before us belong to more than any one camp. Honor that common inheritance and let it strengthen the bonds between our people."

  SHK_icathian_lineage: "Icathian Lineage"
  SHK_icathian_lineage_desc: "Celebrating our lineage and connection to Icathia."

  SHK_settle_down: "Settle Down"
  SHK_settle_down_desc: "A permanent home needs work as well as walls. Expand production in the lands we administer and give our people a stronger stake in the settlements taking shape there."

  SHK_our_lands: "Our Lands"
  SHK_our_lands_desc: "The ground beneath our camps is worth more than a distant ruler's promises. Rally fresh fighters around the defense of our homeland and give our people a cause they can call their own."

  SHK_our_coast: "Our Coast"
  SHK_our_coast_desc: "Our coast should serve the people who live behind it. Gather the knowledge of sailors and coastal leaders so Shakkal can speak more firmly about its interests along the shore."

  SHK_our_sea: "Our Sea"
  SHK_our_sea_desc: "The horizon need not mark the limit of our ambitions. Build on our sailors' experience and rally support for a stronger Shakkal presence at sea."

  SHK_our_share: "Our Share"
  SHK_our_share_desc: "Our people expect their interests to be heard, not traded away without a word. Unite the camps behind that demand and give our leaders a stronger mandate."

