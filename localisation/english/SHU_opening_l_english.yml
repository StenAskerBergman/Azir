l_english:
 SHU_opening.1.t:0 "The Southern Oasis"
 SHU_opening.1.d:0 "The families who fled the Ascended wars built Nazumah around an oasis and learned to defend it on their own. As Shurima rises, our council must decide what that shared history asks of us."
 SHU_opening.1.a:0 "Respect their independence and seek common ground."
 SHU_opening.1.b:0 "Keep Shurima's claim to the south alive."
 SHU_nazumah_respect_autonomy:0 "Respects Nazuman Independence"
 SHU_nazumah_contest_autonomy:0 "Disputes Nazuman Independence"
