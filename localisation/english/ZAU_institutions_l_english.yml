l_english:
 ZAU_ward_services_charter:0 "Charter the Ward Services"
 ZAU_ward_services_charter_desc:0 "The Sump clinic and the Promenade workshops have kept their doors open through a full service cycle. Vander's delegates can now put those maintenance obligations and local purchasing rights in writing."
 ZAU_contract_directorate:0 "Underwrite the Directorate"
 ZAU_contract_directorate_desc:0 "The Lower Landing yards have carried a complete order for a foreign customer. Renata can now use that record to centralize purchasing and borrow against freight revenue."
 ZAU_firelight_emergency_federation:0 "Hear the Firelight Delegation"
 ZAU_firelight_emergency_federation_desc:0 "Freight disruption has left wards bargaining for pump parts and clean filters. Ekko proposes lending Firelight crews the authority to schedule essential cargo and repairs for sixty days. Each ward keeps a vote on what follows."
 ZAU_enact_local_purchasing:0 "Enact Local Purchasing"
 ZAU_enact_local_purchasing_desc:0 "Let ward delegates buy supplies directly and seat a delegation of ward engineers. Small shops can fill repair orders quickly. Fragmented orders make heavy factory construction harder."
 ZAU_renegotiate_ward_purchasing:0 "Renegotiate the Ward Purchasing Charter"
 ZAU_renegotiate_ward_purchasing_desc:0 "Spend 60 days returning purchase authority to the ordinary ward committees. The engineering delegation leaves the cabinet and the charter's recovery orders close."
 ZAU_enact_exclusive_purchasing:0 "Enact Exclusive Purchasing"
 ZAU_enact_exclusive_purchasing_desc:0 "Make Renata's purchasing office the sole industrial buyer. A live, fulfilled contract backs the credit line. Servicing that credit diverts civilian industry."
 ZAU_wind_down_directorate_purchasing:0 "Wind Down Exclusive Purchasing"
 ZAU_wind_down_directorate_purchasing_desc:0 "Close the credit line, cancel pending offers and undelivered orders, and spend 60 days settling accounts. The purchasing office loses its cabinet seat. Fulfilled service agreements can continue."
 ZAU_fund_sump_clinic:0 "Fund the Sump Clinic"
 ZAU_fund_sump_clinic_desc:0 "Pay for a clinic, air filters and pump maintenance in the Sump. The ward must remain under Zaun's ownership and control during construction."
 ZAU_fund_promenade_workshop:0 "Fund the Promenade Workshop"
 ZAU_fund_promenade_workshop_desc:0 "Fund a shop to machine replacement parts for pumps and lifts. The Promenade must remain under Zaun's ownership and control during construction."
 ZAU_begin_ward_service_cycle:0 "Begin a Ward Service Cycle"
 ZAU_begin_ward_service_cycle_desc:0 "Keep the Sump and Promenade supplied for 90 days through the reopened crossing or the Lower Landing detour. If either completed regional agreement is live when the cycle opens, reciprocal filter imports cut 30 days from the schedule once."
 ZAU_ward_service_cycle:0 "Keep the Ward Services Running"
 ZAU_ward_service_cycle_desc:0 "Deliver filters, pumps and replacement components. Maintain Zaun's ownership and control of both wards and keep a freight route operating until the cycle ends."
 ZAU_dispatch_ward_recovery:0 "Dispatch Ward Recovery Crews"
 ZAU_dispatch_ward_recovery_desc:0 "Use ward stocks to mobilize maintenance crews after a freight interruption. Both wards must remain secure until dispatch."
 ZAU_build_lower_landing_freight_works:0 "Build the Lower Landing Freight Works"
 ZAU_build_lower_landing_freight_works_desc:0 "Upgrade loading bays and component storage in Lower Landing. Keep the state under Zaun's ownership and control throughout the works."
 ZAU_order_directorate_equipment:0 "Place a Directorate Equipment Order"
 ZAU_order_directorate_equipment_desc:0 "Order 60 support equipment from coordinated workshops. Keep the purchasing policy, freight route and at least one fulfilled agreement active throughout production."
 ZAU_invoke_firelight_mandate:0 "Invoke the Firelight Emergency Mandate"
 ZAU_invoke_firelight_mandate_desc:0 "Give Ekko's crews a sixty-day mandate over essential freight and maintenance. If both wards remain secure and the domestic detour operates at the end, the wards can vote to federate."
 ZAU_federation_emergency_repairs:0 "Dispatch Federation Repair Crews"
 ZAU_federation_emergency_repairs_desc:0 "Pool pump crews and workshop stocks for emergency repairs. Both wards and the domestic detour must remain secure."
 ZAU_regional_agreements:0 "Zaunite Service Agreements"
 ZAU_regional_agreements_desc:0 "Zaun's engineers can supply and service pumps and filters in exchange for reciprocal filter supplies and industrial orders. Counterpart authorities retain custody and decide who may enter their worksites."
 ZAU_offer_kumungu_filtration:0 "Offer Kumungu Filtration"
 ZAU_offer_kumungu_filtration_desc:0 "Offer pumps, filters and servicing on Kumungu Coast. Ixtali supervisors control access. The offer expires after 30 days."
 ZAU_offer_scar_reclamation:0 "Offer Crystal Scar Reclamation Services"
 ZAU_offer_scar_reclamation_desc:0 "Offer dust filters and equipment servicing to the Crystal Scar custodians. They keep custody and control of site access. The offer expires after 30 days."
 ZAU_ixt_delivery:0 "Deliver the Kumungu Filtration Order"
 ZAU_ixt_delivery_desc:0 "Ship pumps and filters and complete supervised installation. Keep the freight route open and both Lower Landing and Kumungu Coast under their respective signatories' ownership and control."
 ZAU_cry_delivery:0 "Deliver the Crystal Scar Reclamation Order"
 ZAU_cry_delivery_desc:0 "Ship dust filters and replacement components and service equipment under the custodians' supervision. Keep the freight route open and both worksites under their respective signatories' ownership and control."
 ZAU_ixt_cancel_filtration:0 "Withdraw from the Zaun Filtration Agreement"
 ZAU_ixt_cancel_filtration_desc:0 "Revoke Zaun's access to the Kumungu project. Any unfinished shipment is canceled, and future treaty benefits end."
 ZAU_cry_cancel_reclamation:0 "Withdraw from the Zaun Reclamation Agreement"
 ZAU_cry_cancel_reclamation_desc:0 "Revoke Zaun's access to Scar worksites. Any unfinished shipment is canceled, and future treaty benefits end."
 ZAU_ward_resilience:0 "Ward Services in Operation"
 ZAU_ward_resilience_desc:0 "Clerks, clinic staff and workshop crews have kept filters, pumps and spares moving between the wards. The benefit depends on both wards and their freight network."
 ZAU_local_purchasing:0 "Local Purchasing Charter"
 ZAU_local_purchasing_desc:0 "Ward buyers keep small repair orders moving. Heavy procurement proceeds in smaller batches."
 ZAU_ward_repair_crews:0 "Emergency Ward Repair Crews"
 ZAU_ward_repair_crews_desc:0 "Pooled maintenance crews are clearing the repair backlog."
 ZAU_exclusive_purchasing:0 "Directorate Exclusive Purchasing"
 ZAU_exclusive_purchasing_desc:0 "The Directorate's purchasing office holds the city's industrial buying mandate."
 ZAU_contract_industrial_credit:0 "Contract-backed Industrial Credit"
 ZAU_contract_industrial_credit_desc:0 "Delivered orders secure credit for heavy factory construction. Servicing those debts ties up consumer industry."
 ZAU_firelight_mandate_idea:0 "Firelight Emergency Mandate"
 ZAU_firelight_mandate_idea_desc:0 "Ekko coordinates essential cargo and maintenance under authority lent by the wards for sixty days."
 ZAU_ixt_filtration_service:0 "Kumungu Filtration Service"
 ZAU_ixt_filtration_service_desc:0 "Ixtali supervisors oversee the maintenance of pumps and filters installed under the Zaun agreement."
 ZAU_cry_filtration_service:0 "Crystal Scar Filtration Service"
 ZAU_cry_filtration_service_desc:0 "Scar custodians direct the upkeep of dust filters and serviced equipment on their own sites."
 ZAU_ward_engineer_delegation:0 "Ward Engineer Delegation"
 ZAU_glasc_purchasing_office:0 "Glasc Purchasing Office"
 ZAU_ward_purchasing_unlock_tt:0 "Unlocks the £pol_power §YLocal Purchasing§! decision in Zaun's Balance of Power panel. Requires the cooperative range."
 ZAU_glasc_purchasing_unlock_tt:0 "Unlocks the £pol_power §YExclusive Purchasing§! decision in Zaun's Balance of Power panel. Requires Renata in office, the coercive range, and a live fulfilled contract."
 ZAU_firelight_mandate_unlock_tt:0 "Unlocks §YInvoke the Firelight Emergency Mandate§! in the Zaun domestic agenda."
 ZAU_ward_purchasing_effect_tt:0 "Makes the §YWard Engineer Delegation§! available and allows §YWard Recovery§! after a freight interruption."
 ZAU_glasc_purchasing_effect_tt:0 "Makes the §YGlasc Purchasing Office§! available, opens §YContract-backed Industrial Credit§!, and unlocks equipment orders."
 ZAU_federation_ratified_tt:0 "Unlocks §YDispatch Federation Repair Crews§! and closes new regional freight offers. Accepted agreements continue under their existing terms."
 ZAU_events.31.t:0 "The Wards Keep the Pumps Running"
 ZAU_events.31.d:0 "Filter crews brought the last Promenade order down to the Sump this morning. Vander's delegates now have a full ledger of parts delivered, pumps serviced and clinic shifts kept. They can take that record to the ward tables as the basis for a purchasing charter."
 ZAU_events.31.a:0 "Put the accounts before the delegates."
 ZAU_events.32.t:0 "The Wards Lend Their Authority"
 ZAU_events.32.d:0 "Ekko's crews take the freight roster for sixty days. Clinic supplies and pump spares go first. The ward delegates keep their seats and will decide whether the arrangement deserves a charter when the term ends."
 ZAU_events.32.a:0 "Start with the essential loads."
 ZAU_events.33.t:0 "A Vote for the Emergency Federation"
 ZAU_events.33.d:0 "The detour is running and the clinics received their orders. Ekko returns the temporary freight roster to the ward delegates. They can resume separate schedules or ratify a federation that can call on their repair crews in an emergency."
 ZAU_events.33.restore:0 "Return the schedules to the wards."
 ZAU_events.33.ratify:0 "Ratify the Firelight Emergency Federation."
 ZAU_events.34.t:0 "The Emergency Mandate Ends"
 ZAU_events.34.d:0 "The wards could not finish the term with secure services and a working detour. The Firelight roster closes and the existing ward delegates resume responsibility for essential supplies."
 ZAU_events.34.a:0 "Return authority to the wards."
 ZAU_regional.1.t:0 "Zaun Offers Pumps for Kumungu"
 ZAU_regional.1.d:0 "Zaun's engineers offer pumps and replaceable filters for Kumungu Coast. Ixtali supervisors will approve access, oversee installation and inspect every servicing crew. Once the order is delivered, the agreement opens a reciprocal filter supply for Zaun."
 ZAU_regional.1.decline:0 "Close the proposal."
 ZAU_regional.1.accept:0 "Accept under Ixtali supervision."
 ZAU_regional.2.t:0 "Kumungu Filtration Reply"
 ZAU_regional.2.accepted:0 "The Ixtali supervisors accepted. When a freight route is operating, the freight office begins a ninety-day mission to deliver and install the pumps and filters."
 ZAU_regional.2.closed:0 "The Ixtali filtration offer closed without an agreement. No shipment has been authorized."
 ZAU_regional.2.a:0 "File the reply."
 ZAU_regional.3.t:0 "A Proposal for the Scar Custodians"
 ZAU_regional.3.d:0 "Zaun offers dust filters, manufactured spares and equipment servicing. The Crystal Scar custodians retain custody of the site and decide where and when technicians may enter. The contract opens reciprocal filter supply after delivery."
 ZAU_regional.3.decline:0 "Close the proposal."
 ZAU_regional.3.accept:0 "Accept with custody reserved."
 ZAU_regional.4.t:0 "Crystal Scar Reclamation Reply"
 ZAU_regional.4.accepted:0 "The Crystal Scar custodians accepted the custody and access terms. When a freight route is operating, the freight office begins a ninety-day mission to deliver the order and service the equipment."
 ZAU_regional.4.closed:0 "The Crystal Scar offer closed without an agreement. No shipment has been authorized."
 ZAU_regional.4.a:0 "File the reply."
