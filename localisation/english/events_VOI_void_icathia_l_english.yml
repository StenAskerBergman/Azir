 VOI_Ritual_of_Axamuk: "Ritual of Axamuk"
 VOI_Ritual_of_Axamuk_desc: "We will make the ritual of Axamuk a public affirmation of the restored realm. Its observance will rally confidence and strengthen the authority directing Icathia's recovery."

 VOI_Axamuk_Supremacy: "Axamuk's Supremacy"
 VOI_Axamuk_Supremacy_desc: "The restored realm will rally around the authority claimed in Axamuk's name. Greater confidence and a stronger martial purpose will support its armies as Icathia faces the dangers beyond its settlements."

