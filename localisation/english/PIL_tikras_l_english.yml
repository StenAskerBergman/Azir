l_english:
 PIL_excavator_agenda:0 "Hextech Excavator Works"
 PIL_excavator_agenda_desc:0 "The Bramble Crawler can clear a lane through growth that closes behind a man on foot. The fuel, the crews and the authority to send it forward are all matters for the dispatch book."
 ZAU_take_over_excavator_works:0 "Reopen the Captured Excavator Works"
 ZAU_take_over_excavator_works_desc:0 "The Academy works are ours, along with the Piltovan crawler drawings. Put the surviving jigs back in use and register a Reclamation Column under Zaun's workshops."
 ZAU_excavator_works_transferred_tt:0 "§YZaun§! can manufacture §YBramble Crawlers§! and field the §YRiver Pilt Reclamation Column§!."
 PIL_send_tikras_expedition:0 "Send the Bramble Crawlers into Kumungu"
 PIL_send_tikras_expedition_desc:0 "A prospecting party wants crawlers to open the first lane from the Kumungu coast. Keep twelve machines in reserve before authorizing the expedition. One crawler is lost in the first skirmish. This dispatch takes place before a war with Ixtal."
 PIL_report_tikras_deployment:0 "Hear the Kumungu Field Report"
 PIL_report_tikras_deployment_desc:0 "A division with a crawler battalion must enter Ixtali-owned Kumungu or Kumungu Coast. Its report opens decisions about the settlement in its path."
 PIL_tikras_grievance:0 "The Destruction of Tikras"
 PIL_tikras_compensation:0 "Compensation for the Mining Skirmish"
 PIL_tikras.1.t:0 "The First Cut"
 PIL_tikras.1.pil:0 "The company's dispatch describes a shelf of ore past the first belt of Kumungu trees. The drum had scarcely cleared a lane when the wardens came out of the brush. Tikras lost its prefect trying to stop the cutting. One crawler was hauled into the village as a trophy, and the mine crew has failed to report back. The contractors want the Council to send the reserve machines."
 PIL_tikras.1.zau:0 "The works committee sent the old Piltovan rigs out with Zaunite crews and a foreman who knew what the fuel would cost. His last entry records a lane cut for the mine. Then came word that the wardens had stopped the party and that Tikras had lost its prefect in the fighting. One machine now stands in their square. The fitters want to know what we owe the men still missing."
 PIL_tikras.1.war:0 "The crawler crews have reached Ixtali ground. Where the infantry could barely keep a trail open yesterday, the fuel carts can follow today. We have found the remains of a mining party near the cut. The wardens carried one of the company's rigs away. The field commander asks whether to go after it."
 PIL_tikras.1.zau_war:0 "The Reclamation Column has reached the old mining cut. Zaun's crews can bring fuel along the lane their machines opened. They found the last camp abandoned and one crawler missing. The works steward wants the machine back, but the fitters are asking what happened to the people who drove it."
 PIL_tikras.1.a:0 "Send a party after the missing crew"
 PIL_tikras.1.b:0 "Call off the expedition"
 PIL_tikras.2.t:0 "A Prefect for Tikras"
 PIL_tikras.2.d:0 "Mara has taken her place as prefect. Her younger sister Qiyana comes to Tikras to ask the elders for the office and hears that the law is on Mara's side. She breaks the captured crawler in their square to show them whose command the jungle answers. The elders keep their prefect. On her way back to Ixaocan, Qiyana stops drawing the vines over the path behind her. Bayal notices. By dusk, our search party has noticed too."
 PIL_tikras.2.war:0 "Scouts report a dispute in Tikras. The elders kept Mara as prefect after her sister came to demand the office. Qiyana left the captured crawler crushed beneath ice and stone, then took the hidden path out of the village. She let the vines stand open behind her. Our forward crews can see the trail now, and want orders before the wardens close it."
 PIL_tikras.2.a:0 "Follow the open path"
 PIL_tikras.2.b:0 "Offer compensation and turn back"
 PIL_tikras.2.c:0 "Bring the crews home"
 PIL_tikras.3.t:0 "Orders at the Tree Line"
 PIL_tikras.3.d:0 "The reserve crawlers stop short of the clearing. The search party found the missing miners dead. A contractor asks for leave to level the settlement in reprisal. The party can still be recalled. Beyond the last trunks are the houses of Tikras and the people sheltering in them."
 PIL_tikras.3.war:0 "The company has brought its machines to the edge of Tikras. The commander asks whether to clear a path around the village and push on, or turn the cutters on the settlement in reprisal for the mining party. The road can be opened without going through the houses."
 PIL_tikras.3.a:0 "Give the order to level Tikras"
 PIL_tikras.3.b:0 "Clear a military route around Tikras"
 PIL_tikras.3.c:0 "Stand down. Leave the village be"
 PIL_tikras.4.t:0 "The Dispatch from Tikras"
 PIL_tikras.4.pil:0 "The contractors report that their machines did what was ordered. Survivors fled into the jungle and Mara reached Ixaocan to tell her sister what happened. The final dispatch names the missing crew and gives the village a single line. The Council must decide what goes in the public record."
 PIL_tikras.4.zau:0 "The Reclamation Column returned with Piltovan numbers still stamped under the fresh paint. The villagers who escaped will remember whose crews were at the controls. At the works gate, the fitters ask to see the dispatch and the order bearing our seal."
 PIL_tikras.4.a:0 "Publish the order and fund relief"
 PIL_tikras.4.b:0 "Defend the decision in public"
 PIL_tikras.5.t:0 "The Ruins of Tikras"
 PIL_tikras.5.d:0 "Mara reaches Ixaocan and asks for help for the people still hiding in the jungle. She tells Qiyana that Tikras should have been hers to defend. The survivors have lost their homes and the wardens need orders. There will be time enough to ask how the path was found."
 PIL_tikras.5.a:0 "Send the wardens to hold the approaches"
 PIL_tikras.5.b:0 "Gather the survivors and rebuild the watch"
 PIL_tikras.6.t:0 "New Numbers on Old Steel"
 PIL_tikras.6.d:0 "The fitters kept the Piltovan gearbox, cut out the damaged feed lines and painted over the Council's numbers. There is a ledger for the old machines and another for the ones we build ourselves. Put the next order through the Reclamation Works. We have our own crews to drive them."
 PIL_tikras.6.a:0 "Put Zaun's name on the dispatch"
