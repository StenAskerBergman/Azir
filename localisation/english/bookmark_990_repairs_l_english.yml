l_english:
 990_BOOKMARK_NAME: "Runeterra: An Empire Reborn"
 990_BOOKMARK_DESC: "The Sun Disc rises over a divided Runeterra. Shurima's return threatens old freedoms, Targon's faiths approach open conflict, Icathia struggles against the Void, and every desert power must decide whether to serve an Ascended empire or resist it."
 990_DEM_DESC: "Demacia is a proud western kingdom protected by petricite and an elite military. Its fear of magic, however, is feeding an internal crisis that strength of arms alone cannot contain."
 990_NOX_DESC: "Noxus is an expansionist empire that promises advancement to anyone with the strength to claim it. Under Swain and the Trifarix, it seeks new opportunities beyond every border—including the fractured lands of Shurima."
 FRO_990_DESC: "Hidden behind ice and ancient deception, Lissandra's Frostguard watch over secrets buried beneath the Freljord. Their public faith masks a far older struggle against the Watchers and the truth of the Frozen Thralls."
 URS_990_DESC: "The Ursine answer the call of Volibear and reject the weakness of settled civilization. The growing storm offers them a chance to return the Freljord to tooth, claw, and the old ways."
 AVA_990_DESC: "Ashe's Avarosans seek to unite the Freljord through alliance, shared purpose, and the legacy of Avarosa. Their dream must survive both the Winter's Claw and the gods of the old wilderness."
 WIN_990_DESC: "Sejuani's Winter's Claw believes survival proves worth. They raid the weak, endure the impossible, and will accept no Freljord united under anyone else's terms."
 SHK_990_DESC: "The Shakkal dune raiders thrive where imperial law has collapsed. With Shurima rising again, their clans must choose between plunder, unity, and a last war for the freedom of the Great Sai."
 OTHER_990_DESC: "Many other peoples of Runeterra stand beyond the powers shown here. Select any country on the map to begin its story."
