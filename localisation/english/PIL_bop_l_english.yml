l_english:
 PIL_bop:0 "Piltover's Crossing Policy"
 PIL_bop_cooperative:0 "A Charter for Both Cities"
 PIL_bop_coercive:0 "The Council's Prerogative"
 PIL_bop_status_quo:0 "Permits and Precedent"
 PIL_bop_status_quo_desc:0 "The Council keeps the old permits in force while the houses and Wardens dispute the terms of any new charter."
 PIL_bop_opening:0 "The Open Register"
 PIL_bop_charter:0 "A Charter for Both Cities"
 PIL_bop_control:0 "Council Permit Review"
 PIL_bop_prerogative:0 "The Council's Prerogative"
 PIL_bop_decisions:0 "Piltover's Crossing Policy"
 PIL_bop_decisions_desc:0 "Choose what access this city grants, reserves or withdraws during the crossing crisis."
 PIL_cooperative_charter:0 "Publish the Survey and Open the Freight Register"
 PIL_cooperative_charter_desc:0 "Give the other bank working access to the crossing register and reserve it space on our freight schedule. Our workshops will bear the cost until a joint timetable takes effect."
 PIL_exclusive_charter:0 "Put the Crossing Under Council Permit"
 PIL_exclusive_charter_desc:0 "Keep the register closed and shift administrative authority to our own carriers. Pact talks remain open until the other bank commits."
 PIL_exploit_concession:0 "Impose Exclusive Freight Permits"
 PIL_exploit_concession_desc:0 "Use the other bank's open register or reserved slots to move our cargo ahead of theirs. The advantage ends when the permits expire or the other city cuts off access."
 PIL_answer_breach:0 "Suspend Access and Divert Cargo"
 PIL_answer_breach_desc:0 "Revoke the exploited access and pay for emergency rerouting. Backlash against the failed concession moves this city toward its coercive policy."
 PIL_fallback_freight:0 "Run the River Pilt Barge Detour"
 PIL_fallback_freight_desc:0 "Pay for a parallel freight route. It restores some capacity at a continuing cost in consumer goods."
 PIL_fortify_crossing:0 "Fortify the Upper Approach"
 PIL_fortify_crossing_desc:0 "Secure our own approach. Both cities remain free to decide whether the confrontation goes further."
 PIL_reserved_capacity:0 "Capacity Reserved for the Other Bank"
 PIL_reserved_capacity_desc:0 "Our crews and workshops carry the cost of keeping space open for the other city."
 PIL_priority_freight:0 "Exclusive Crossing Permits"
 PIL_priority_freight_desc:0 "Our freight moves first while we retain access to the other city's crossing arrangements."
 PIL_freight_disruption:0 "Freight Held at the Crossing"
 PIL_freight_disruption_desc:0 "The city's commitments have been used against its own carriers. Shipments are waiting while an alternative is organized."
 PIL_emergency_freight:0 "Emergency Freight Diversion"
 PIL_emergency_freight_desc:0 "Emergency dispatches keep supplies moving while the city pays to hire replacement crews and carriers."
 PIL_fallback_freight_idea:0 "Parallel Freight Route"
 PIL_fallback_freight_idea_desc:0 "Duplicated crossings, storage and crews keep goods moving at a permanent cost."
 PIL_joint_freight:0 "Two Cities Freight Charter"
 PIL_joint_freight_desc:0 "The joint board publishes fares and work schedules. Shared workshops can service both banks and exchange research under the same charter."
 PIL_bridge.1.t:0 "Permits Seized at the Crossing"
 PIL_bridge.1.d:0 "Zaun's carriers have used our reservations to claim priority at the crossing. The Council can withdraw the concession, but replacing the deferred freight will cost money and political support."
 PIL_bridge.1.a:0 "Put an emergency response before the city."
 PIL_bridge_cooperative:0 "Piltover committed to cooperation."
 PIL_bridge_coercive:0 "Piltover committed to exclusive control."
